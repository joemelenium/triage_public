# Plain language rules for any text a patient sees: questions, advice, and the
# names of possible conditions. The engine refuses to load content that breaks
# them. Reviewers can add entries.
#
# Two kinds of rule:
#
# avoid: words the NHS digital service manual's "A to Z of NHS health writing"
#   tells writers to avoid, with the word to use instead. Based on NHS user
#   research. A text may only use an avoided word if it also uses one of the
#   "unless_with" phrases, for example "feeling sick (nausea)".
#   Source: https://service-manual.nhs.uk/content/a-to-z-of-nhs-health-writing
#   Contains public sector information licensed under the Open Government Licence v3.0.
#
# explain: medical words with no everyday alternative. A text may use one only
#   if it also explains it, using one of the "explained_by" phrases. Where the A
#   to Z covers the word, its advice was followed. Otherwise the explanation is
#   AI-drafted and needs review.
#     term          the medical word (matched without regard to capitals, and also
#                   matches longer words that start with it, so "tonsil" covers "tonsils")
#     plain         what it means, in plain words
#     explained_by  the text must also contain one of these phrases
#     explained_in  optional: a question that explains the word. Questions only asked
#                   after a "yes" to that question need not explain it again.

avoid:
  - {term: "acute", use_instead: "sudden, starts suddenly, short-term"}
  - {term: "absorb", use_instead: "take in"}
  - {term: "chronic", use_instead: "for a long time, does not go away"}
  - {term: "disease", use_instead: "condition, problem or illness"}
  - {term: "disorder", use_instead: "condition, problem or illness"}
  - {term: "medication", use_instead: "medicine"}
  - {term: "drugs", use_instead: "medicines", unless_with: [overdose]}
  - {term: "exceed", use_instead: "more than"}
  - {term: "excessive", use_instead: "too much"}
  - {term: "fever", use_instead: "high temperature", unless_with: [high temperature, glandular fever, scarlet fever, hay fever]}   # the A to Z keeps "fever" in condition names
  - {term: "nausea", use_instead: "feeling sick", unless_with: [feeling sick, feel sick]}
  - {term: "vomit", use_instead: "being sick", unless_with: [being sick, been sick, blood in your vomit]}
  - {term: "normally", use_instead: "usually"}
  - {term: "occur", use_instead: "happen, or reword"}
  - {term: "oral", use_instead: "mouth, or by mouth"}
  - {term: "persist", use_instead: "carry on, keep going"}
  - {term: "prognosis", use_instead: "outlook"}
  - {term: "renal", use_instead: "kidney"}
  - {term: "risk", use_instead: "chance"}
  - {term: "seek", use_instead: "ask for"}
  - {term: "suffering from", use_instead: "have, or reword"}
  - {term: "chemist", use_instead: "pharmacy"}
  - {term: "equivalent", use_instead: "equal to"}
  - {term: "medical record", use_instead: "health record"}
  - {term: "telephone", use_instead: "phone"}
  - {term: "etc", use_instead: "list the things, or say 'for example'"}
  - {term: "can't", use_instead: "cannot"}
  - {term: "don't", use_instead: "do not"}
  - {term: "rectum", use_instead: "bottom", unless_with: [bottom]}
  - {term: "uterus", use_instead: "womb", unless_with: [womb]}
  - {term: "flatulence", use_instead: "farting", unless_with: [farting]}
  - {term: "gullet", use_instead: "food pipe"}
  - {term: "water infection", use_instead: "urinary tract infection (UTI)"}

