presenting: [chest_pain]
summary: 77-year-old woman who has felt very tired since yesterday and woke this morning with a mild uncomfortable
  feeling in her chest that is still there. She cannot say how it started because she woke with it. Her
  daughter, who is with her, says her skin has gone grey. She has high blood pressure.
opening_statement: I don't feel right. I've been ever so tired since yesterday, and I woke up this morning
  with an uncomfortable feeling in my chest. It's not bad. My daughter's here and she says I've gone a
  grey colour.
