# Entry symptom: watering eyes.
# NOT FOR CLINICAL USE. AI-drafted, not clinically reviewed.
#
# Each rule says: WHEN these findings are present, the outcome is at least THIS.
# A rule marked "soft: true" is the exception: the conditions that look likely
# may lower its outcome, if something the patient said points to a milder cause.
# The engine takes the most urgent rule that fires. If none fires, it uses the
# default at the bottom.
#
# Something in the eye, a red eye or eye pain each bring in their own entry
# symptom and its red flags as soon as the patient says yes to them.

id: watering_eyes
name: "Watering eyes"
presenting_finding: watering_eyes
status: "AI-drafted, not clinically reviewed"

screens:
  - id: watering_eyes_urgent_screen
    level: urgent
    question: "Do any of these apply? Choose all that apply."
    findings:
      - vision_change
      - eye_pain_severe
      - red_eye
      - something_in_eye

  - id: watering_eyes_gp_checklist
    level: routine
    question: "Do any of these apply? Choose all that apply."
    findings:
      - watering_affects_daily_life
      - eyelid_turning_in_or_out
      - eyelid_lump_not_going
      - worried_about_symptoms

red_flags:
  - id: rf_we_vision
    description: "Watering eyes with any changes to the sight, such as loss of vision"
    when: vision_change
    outcome: {acuity: urgent, level_of_care: urgent_care, timeframe: today, timeframe_detail: "Ask for an urgent GP appointment or get help from NHS 111"}
    advice: advice_eye_urgent
    source: nhs_watering_eyes

  - id: rf_we_severe_pain
    description: "Watering eyes with severe eye pain"
    when: eye_pain_severe
    outcome: {acuity: urgent, level_of_care: urgent_care, timeframe: today, timeframe_detail: "Ask for an urgent GP appointment or get help from NHS 111"}
    advice: advice_eye_urgent
    source: nhs_watering_eyes

outcome_rules:
  - id: or_we_daily_life
    description: "Eyes keep watering and it is stopping everyday activities"
    when: watering_affects_daily_life
    outcome: {acuity: routine, level_of_care: general_practice, timeframe: no_fixed_time, timeframe_detail: "See a GP. No fixed time is given."}
    advice: advice_watering_gp
    source: nhs_watering_eyes

  - id: or_we_eyelid
    description: "Eyelid turning inwards or drooping away from the eye"
    when: eyelid_turning_in_or_out
    outcome: {acuity: routine, level_of_care: general_practice, timeframe: no_fixed_time, timeframe_detail: "See a GP. No fixed time is given."}
    advice: advice_watering_gp
    source: nhs_watering_eyes

  - id: or_we_lump
    description: "Lumps or swellings around the eyes not better with treatment from a pharmacist"
    when: eyelid_lump_not_going
    outcome: {acuity: routine, level_of_care: general_practice, timeframe: no_fixed_time, timeframe_detail: "See a GP. No fixed time is given."}
    advice: advice_watering_gp
    source: nhs_watering_eyes

  - id: or_we_worried
    description: "Worried about the watering"
    when: worried_about_symptoms
    outcome: {acuity: routine, level_of_care: general_practice, timeframe: no_fixed_time, timeframe_detail: "See a GP. No fixed time is given."}
    advice: advice_watering_gp
    source: ai_judgement
    note: "The Watering eyes page has no rule for being worried. The Red eye page says see a GP or optician if you are worried about your eyes; applying it here is AI judgement."

default:
  description: "Watering eyes with nothing that needs more help: often get better on their own"
  outcome: {acuity: self_manageable, level_of_care: self_care, timeframe: not_needed, timeframe_detail: "Watering eyes often get better on their own. A pharmacist can help."}
  advice: advice_watering_self_care
  source: nhs_watering_eyes
