notes: 'The pattern and background point to a heart problem with no emergency sign. Source difference,
  and the reason expected and minimum safe acuity differ. For chest pain that comes and goes: chest_pain.txt
  says non-urgent ''See a GP''; angina.txt says ''Urgent advice: Get help from NHS 111'' for ''chest pain
  or other symptoms of angina that come and go''; and the opening of angina.txt says ''it''s important
  to see a GP as soon as possible if you think you may have it''. Judgement: her story matches the angina
  page''s own description (brought on by exercise, stops after resting for a few minutes), she has risk
  factors both heart pages list, and she thinks she may have angina, so the angina page is followed. Expected
  is its NHS 111 advice; the minimum safe acuity is ''soon'', the reading given to ''see a GP as soon
  as possible''; routine with no fixed time is judged too slow. The sources give no different instruction
  because of risk factors or family history: they say only that such people are more likely to have heart
  problems, so the background supports the judgement but does not by itself raise the outcome to emergency.
  She describes an ache, so cp_tight_or_squeezing and cp_heavy are no; there is no pain now.'
