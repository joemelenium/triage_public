id: wz_h01
status: "AI-drafted, not clinically approved"
authored_by: "AI, in a session separate from the knowledge base"

presenting: [wheezing]

summary: "A 22-year-old man with a known nut allergy who, ten minutes after eating a curry at a restaurant, became wheezy. His throat feels tight, his lips are swelling and his voice is hoarse. He has no rash. He has not used his adrenaline auto-injector."

opening_statement: "I've gone really wheezy since I ate, my lips feel big and my throat's going tight."

findings:
  present: [wheezing, after_allergy_trigger, has_allergies, throat_tight, lips_tongue_throat_swelling, hoarse_voice, short_of_breath]
  absent: [raised_itchy_rash, too_breathless_to_talk, severe_breathing_difficulty, lips_or_skin_blue_grey, sudden_confusion, passed_out, fainted, light_headed, unable_to_swallow, drooling, choked_on_something, has_asthma, chest_pain, very_high_temperature]
  unknown: []

context:
  none: {}
  basic: {age: 22, sex: male}
  full:
    age: 22
    sex: male
    findings: {has_allergies: "yes"}

expected:
  acuity: emergency
  level_of_care: emergency_ambulance
  timeframe: now

minimum_safe_acuity: emergency

red_flags:
  - description: "Lips suddenly swelling after eating, with wheeze"
    findings: [lips_tongue_throat_swelling]
    minimum_acuity: emergency
    source: {page: anaphylaxis.txt, quote: "your lips, mouth, throat or tongue suddenly become swollen"}
  - description: "Throat feels tight"
    findings: [throat_tight]
    minimum_acuity: emergency
    source: {page: anaphylaxis.txt, quote: "your throat feels tight or you're struggling to swallow"}

safety_netting_should_cover:
  - point: "Use an adrenaline auto-injector now if he has one"
    any_of: ["adrenaline", "auto-injector", "EpiPen"]
  - point: "Call 999 and say anaphylaxis"
    any_of: ["999"]
  - point: "Lie down (or sit up if struggling to breathe); do not stand or walk"
    any_of: ["lie down", "do not stand", "sit up"]

source:
  expected_outcome: {page: anaphylaxis.txt, quote: "Call 999 if you think you or someone else is having an anaphylactic reaction."}
  minimum_safe_acuity: {page: anaphylaxis.txt, quote: "your lips, mouth, throat or tongue suddenly become swollen"}

variants:
