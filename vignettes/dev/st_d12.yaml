presenting: [sore_throat]

summary: "A 16-year-old girl with a sore throat for two days. She looked in the mirror and saw pus-filled spots on her tonsils. She is eating soft food and drinking normally, does not feel hot or shivery and is not especially worried."

opening_statement: "I've had a sore throat for two days and when I looked in the mirror there were white spots with pus on my tonsils. What should I do?"

