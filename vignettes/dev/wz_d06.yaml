notes: "asthma.txt: 'Call 999 if' an asthma attack and no better after the maximum reliever dose. The grass-cutting trigger is pollen, so triggered_by_allergy is present; after_allergy_trigger (food, medicine or insect sting) is absent, to separate this from anaphylaxis. cp_tight_or_squeezing is present because his chest feels tight (an asthma symptom); this question also appears in chest pain advice, and shortness_of_breath.txt makes 'your chest feels tight or heavy' a 999 sign, which agrees with the expected outcome."
