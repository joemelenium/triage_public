atypical: false
notes: "The course is the point: an illness that was settling and then became much worse on one side. tonsillitis.txt lists difficulty opening the mouth, swelling inside the mouth and throat and a severe sore throat that quickly gets worse under call 999 or go to A&E ('These are signs of quinsy'). sore_throat.txt has only 'have severe symptoms and are getting worse quickly' among these; it does not mention mouth opening or swelling. Waiting for the GP appointment, or 111 advice on the strength of the painful swallowing alone, would be under-triage. The page offers either 999 or A&E, so emergency_department is used as the level of care, together with the page's advice not to drive there."
