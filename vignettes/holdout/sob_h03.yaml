notes: "Possible pneumonia. pneumonia.txt urgent list includes 'you're coughing up yellow or green mucus (phlegm)' and 'you're feeling short of breath'; bronchitis.txt agrees (urgent). chest_infection.txt is less urgent ('Non-urgent advice: See a GP if' symptoms get worse) but notes 'You may have pneumonia if your symptoms are severe.' Judgement: urgent, following pneumonia.txt. Level of care: the source says 'urgent GP appointment or NHS 111'; general_practice/today chosen, urgent_care is equally acceptable. very_high_temperature is answered yes because she feels hot and shivery (question wording: 'or do you feel hot, cold or shivery'). This could also trigger the sepsis page's 'very high or very low temperature, feels hot or cold to the touch, or is shivery' for adults (999); judged not to apply because she has no other sepsis signs and the pneumonia page is more specific. Reviewers should note this tension."
