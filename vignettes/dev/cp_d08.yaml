atypical: true
notes: 'Source difference, and the reason expected and minimum safe acuity differ. chest_pain.txt says
  call 999 for chest pain with feeling sick (''you have chest pain and you feel sweaty, sick, light headed
  or short of breath'') and angina.txt has the same line. heart_attack_symptoms.txt puts ''you have chest
  pain and you feel sick or are being sick'' under ''Urgent advice: Call NHS 111''. Judgement: the expected
  outcome follows the two pages that say 999, including the page for the presenting symptom; the minimum
  safe acuity is urgent because NHS 111 is the explicit advice of the third page. Sickness is the only
  associated sign: the pain came on slowly (so it is not ''sudden pain that does not go away''), it does
  not spread, and he is not sweaty, light-headed or short of breath. Marked atypical and easy to miss
  because he presents it as a stomach bug and mentions the chest ache as an aside. angina_pain_not_settling
  is answered yes because the pain is still there at rest, which is the honest answer to that question
  as worded; the patient has no angina diagnosis. For the questions added to the list later: he smokes
  (heart_risk_factors yes). cp_after_eating is no: the ache came on slowly through the morning, not after
  a meal.'
