conversion_notes: 'Fever and chills are mapped to very_high_temperature. Rash, joint pain and headache have no matching question. The spelling ''athralgias'' is in the published text. Rule used for very_high_temperature in this set: present when the text states a fever (not described as low-grade), chills, rigors or feeling hot; left out when the fever is described as low-grade or measured below 38.0 C; absent when fever is explicitly ruled out. Text is from the ''Vignette'' column of Supplemental Table 2 in the web appendix (vignette 13 of 45, in the published order); the ''Simplified (added symptoms)'' column is not copied. The publication gives this vignette''s source as: Plantz SH, Adler JN, eds. NMS Emergency Medicine. Williams & Wilkins, 1998.'
