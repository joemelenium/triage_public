  absent: [short_of_breath, sob_sudden, sob_at_rest, too_breathless_to_talk, severe_breathing_difficulty, difficulty_breathing, lips_or_skin_blue_grey, sudden_confusion, chest_pain, cp_tight_or_squeezing, cp_heavy, coughing_up_blood, phlegm_yellow_or_green, cough_mucus_or_temperature, very_high_temperature, feels_very_unwell, breathing_very_fast, weight_loss, swollen_ankles, has_asthma, known_heart_condition, weakened_immune_system, after_allergy_trigger, sob_more_than_usual]
  unknown: [has_copd, long_term_condition]

