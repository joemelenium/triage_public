notes: 'Urgent but not an emergency: each attack still settles with the spray and there is no pain now,
  so the 999 advice for angina pain that does not stop does not apply. Giving 999 here would be over-triage;
  giving routine GP advice (chest_pain.txt, ''chest pain that comes and goes'') would be under-triage
  because angina.txt gives specific NHS 111 advice for diagnosed angina that is worse than before. For
  the questions added to the list later: cp_on_exertion is yes because his attacks have always come on
  with effort and ease with rest or his spray, although two recent ones came on at rest; he has high cholesterol
  (heart_risk_factors yes).'
