# Entry symptom: hiccups.
# NOT FOR CLINICAL USE. AI-drafted, not clinically reviewed.
#
# Each rule says: WHEN these findings are present, the outcome is at least THIS.
# The engine takes the most urgent rule that fires. If none fires, it uses the
# default at the bottom.
#
# Source: the NHS Hiccups page. It names no emergency or urgent sign, so there
# is no red-flag checklist here beyond the one asked of everyone. A "yes" to
# chest pain brings in the chest pain red flags.

id: hiccups
name: "Hiccups"
presenting_finding: hiccups
status: "AI-drafted, not clinically reviewed"

outcome_rules:
  - id: or_hi_over_48_hours
    description: "Hiccups lasting longer than 48 hours"
    when: hiccups_over_48_hours
    outcome: {acuity: routine, level_of_care: general_practice, timeframe: no_fixed_time, timeframe_detail: "See a GP. The source gives no fixed time."}
    advice: advice_hiccups_gp
    source: nhs_hiccups

  - id: or_hi_keep_coming_back
    description: "Hiccups that come back very often and affect daily life"
    when: hiccups_keep_coming_back
    outcome: {acuity: routine, level_of_care: general_practice, timeframe: no_fixed_time, timeframe_detail: "See a GP. The source gives no fixed time."}
    advice: advice_hiccups_gp
    source: nhs_hiccups

default:
  description: "Hiccups with nothing that needs more help: they usually stop within a few minutes"
  outcome: {acuity: self_manageable, level_of_care: self_care, timeframe: not_needed, timeframe_detail: "Hiccups should only last a few minutes"}
  advice: advice_hiccups_self_care
  source: nhs_hiccups
