summary: "A 24-year-old man with diagnosed panic attacks had an episode an hour ago on a crowded train: sudden fear, heart pounding, a sharp chest pain, feeling he could not get enough breath and tingling fingers. It lasted about 15 minutes and has completely stopped. He has had similar episodes before when stressed."

opening_statement: "I had one of my panic attacks on the train. My heart was pounding, my chest hurt and I couldn't get my breath. It's all stopped now but it really scared me."

