conversion_notes: '''Shortness of breath'' is mapped to short_of_breath only. difficulty_breathing and severe_breathing_difficulty are left out: the text does not use those words or describe gasping, choking or being unable to speak. ''Progressive worsening ... over 3 days'' is not mapped to severe_and_worsening_quickly. Text is from the ''Vignette'' column of Supplemental Table 2 in the web appendix (vignette 3 of 45, in the published order); the ''Simplified (added symptoms)'' column is not copied. The publication gives this vignette''s source as: Epocrates (online.epocrates.com), 2014.'
