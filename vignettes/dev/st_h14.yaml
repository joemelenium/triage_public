presenting: [sore_throat, chest_pain]

summary: "A 66-year-old woman with a sore throat and a runny nose for three days who wants something for her throat. She also mentions that for two weeks she has had a dull ache across her chest when she walks up the hill to the shops, mostly on cold mornings, which goes within a couple of minutes of stopping. It is not there now, is not tight or heavy, does not spread, and comes with no sweating, sickness, light-headedness or breathlessness. She takes tablets for high blood pressure, her father had a heart attack at 54, and she has never been told she has angina."

opening_statement: "I've had a sore throat and a runny nose for three days and I'd like something for my throat. The other thing is I've been getting an ache in my chest when I walk up the hill, which goes off when I stop for a minute."

