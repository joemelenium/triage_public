id: cp_h15
status: AI-drafted, not clinically approved
authored_by: AI, in a session separate from the knowledge base
presenting: [chest_pain]
summary: 54-year-old woman who smokes and takes tablets for high blood pressure; her mother had a heart
  attack at 56. For three weeks she has had an ache in the centre of her chest when carrying shopping
  or climbing stairs, easing a minute or two after she stops. About ten episodes. No pain at rest or now.
  She has no heart diagnosis and is worried it could be angina.
opening_statement: For about three weeks I've been getting an ache in the middle of my chest when I carry
  the shopping home or climb the stairs at work. It eases off a minute or two after I stop. I'm fine sitting
  here now. I smoke, I'm on tablets for my blood pressure and my mum had a heart attack at 56, so I'm
  worried it might be angina.
