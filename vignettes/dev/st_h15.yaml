notes: "Ordinary cold-type sore throat in a child aged 5 or over whose parent wants help: 'Non-urgent advice: See a pharmacist if'. Swollen neck glands are an ordinary symptom on sore_throat.txt ('swollen neck glands'). tonsillitis.txt lists swollen, painful glands among 'more severe' symptoms and says they can feel 'like a lump on the side of your neck', and sore_throat.txt says to see a GP for 'a lump in your mouth or neck'; neither page says how to tell the two apart. Here the mother describes small glands on both sides, so swollen_neck_glands is present and lump_in_mouth_or_neck is absent. Urgent or emergency advice would be over-triage; self-care would be safe."
