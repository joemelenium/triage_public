id: cp_h17
status: "AI-drafted, not clinically approved"
authored_by: "AI, in a session separate from the knowledge base"

presenting: [chest_pain]

summary: "A 63-year-old man with high blood pressure, sitting at home, gets sudden severe chest pain that feels like something tearing and goes straight through to between his shoulder blades. He is sweaty and short of breath."

opening_statement: "I was just sat watching telly and this horrendous pain hit me in the chest, like something ripping inside, and it's gone right through to my back."

findings:
  present: [chest_pain, cp_tearing_to_back, upper_back_pain, cp_spreads, cp_sudden_not_going_away, cp_present_now, short_of_breath, sweating, heart_risk_factors]
  absent: [cp_after_injury_or_exercise, cp_tender_to_press, cp_worse_breathing_in, cp_comes_and_goes, cp_after_eating, cp_on_exertion, cp_better_leaning_forward, cough, coughing_up_blood, leg_pain_or_swelling, fainted, passed_out, stroke_signs, sudden_confusion, nausea_or_vomiting, light_headed, palpitations, heart_beating_very_fast, rash_one_side_of_body, recent_surgery_or_immobile, recent_long_journey, previous_blood_clot, has_angina, known_heart_condition, cough_mucus_or_temperature, feeling_of_panic, severe_breathing_difficulty, lips_or_skin_blue_grey]
  unknown: []

context:
  none: {}
  basic: {age: 63, sex: male}
  full:
    age: 63
    sex: male
    findings: {heart_risk_factors: "yes"}

expected:
  acuity: emergency
  level_of_care: emergency_ambulance
  timeframe: now

minimum_safe_acuity: emergency

red_flags:
  - description: "Sudden severe chest pain going to the back that feels like something tearing inside"
    findings: [cp_tearing_to_back]
    minimum_acuity: emergency
    source: {page: costochondritis.txt, quote: "sudden chest or back pain that can feel like something being torn inside"}
  - description: "Chest pain spreading to the back"
    findings: [cp_spreads]
    minimum_acuity: emergency
    source: {page: chest_pain.txt, quote: "you get pain that spreads to your left or right arm, or your neck, jaw, stomach or back"}
  - description: "Chest pain with sweating and shortness of breath"
    findings: [short_of_breath, sweating]
    minimum_acuity: emergency
    source: {page: chest_pain.txt, quote: "you have chest pain and you feel sweaty, sick, light headed or short of breath"}
  - description: "Pain in the chest and upper back"
    findings: [upper_back_pain]
    minimum_acuity: emergency
    source: {page: pulmonary_embolism.txt, quote: "you feel pain in your chest or upper back"}

safety_netting_should_cover:
  - point: "Call 999 now"
    any_of: ["999"]
  - point: "Do not drive to hospital"
    any_of: ["do not drive", "don't drive"]

source:
  expected_outcome: {page: costochondritis.txt, quote: "sudden chest or back pain that can feel like something being torn inside, and causes shortness of breath"}
  minimum_safe_acuity: {page: chest_pain.txt, quote: "Call 999 straight away as you need immediate treatment in hospital."}

variants:
  - id: cp_h17_v1
    style: "brief, in a lot of pain"
    opening_statement: "Chest. Tearing. Into my back. Can't get my breath."
    volunteered: [chest_pain, cp_tearing_to_back, short_of_breath]
  - id: cp_h17_v2
    style: "calm and understated, mentions the back first"
    opening_statement: "I've got a really bad pain between my shoulder blades that came on all of a sudden, and my chest's sore too. I'm sweating a bit."
    volunteered: [upper_back_pain, chest_pain, sweating]

atypical: false
notes: "Aortic dissection is not named in any source page. The only source describing tearing pain is the 999 list on costochondritis.txt, which adds shortness of breath and problems with walking, vision and speaking; those last three map only loosely to stroke_signs, which is absent here. The case reaches 999 on several other routes as well (pain spreading to the back, sweating and breathlessness on chest_pain.txt; chest or upper back pain on pulmonary_embolism.txt)."
