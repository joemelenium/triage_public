notes: 'Low-urgency case: over-triage would be the mistake. The chest_pain.txt table gives this exact
  pattern (''Starts after chest injury or chest exercise, may get worse when you breathe in, feels better
  when resting the muscle'') as chest sprain or strain, and adds ''Do not self-diagnose''. Source differences:
  pulmonary_embolism.txt lists ''chest pain that''s worse when you breathe in'' as a symptom of pulmonary
  embolism and puts ''pain in your chest or upper back'' under ''Call 999 or go to A&E''; angina.txt puts
  chest pain that comes and goes under NHS 111. Judgement: there is a clear exercise trigger, the pain
  is brought on by using the muscle, and none of the other pulmonary embolism features are present (no
  breathing difficulty, no blood, no leg symptoms), so chest_pain.txt is followed. A reviewer who weighs
  the pulmonary embolism page more heavily could reasonably disagree. The sources give no self-care advice
  for a chest strain, so routine (not self_manageable) is the expected and minimum level. The exercise
  trigger and the relief on resting the muscle are expressed with cp_after_injury_or_exercise, a question
  added after this case was first written.'
