notes: "Two presenting symptoms. Atypical: the throat discomfort is what she leads with and she reads the illness as a throat infection, but the chest pain spreading to the neck and jaw with sweating and nausea meets the 'Call 999' criteria on chest_pain.txt, angina.txt and heart_attack_symptoms.txt. None of the sore throat warning signs is present, so the sore throat questions alone give no reason for concern. Source difference: heart_attack_symptoms.txt lists 'you have chest pain and you feel sick or are being sick' under 'Call NHS 111', whereas chest_pain.txt and angina.txt list chest pain with feeling sick under 'Call 999'. That difference does not change this case because other 'Call 999' signs are present. The story does not give her medical history; heart_risk_factors is recorded as present (high blood pressure) as the answer that best fits her, and the other new chest pain questions as absent. chest_pain.txt says heart problems are more likely with such risk factors but attaches no action to them, so the outcome does not depend on this answer."
