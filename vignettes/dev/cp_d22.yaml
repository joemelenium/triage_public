id: cp_d22
status: AI-drafted, not clinically approved
authored_by: AI, in a session separate from the knowledge base
presenting: [chest_pain]
summary: 51-year-old man who smokes and has high cholesterol; his father had a heart attack at 54. For
  a month he has had an ache across his chest in tense work meetings and also when hurrying for the train,
  going off after a few minutes once he sits quietly. He puts it down to stress; his partner thinks it
  could be angina. No pain now.
opening_statement: I've been under a lot of pressure at work, and for the last month I get an ache across
  my chest in tense meetings and also when I'm rushing for the train. Either way it goes off after a few
  minutes once I sit quietly. I put it down to stress. But I smoke, my cholesterol's high and my dad had
  a heart attack at 54, so my partner thinks it could be angina and told me to ask.
