id: st_d06
status: "AI-drafted, not clinically approved"
authored_by: "AI, in a session separate from the knowledge base"

presenting: [sore_throat]

summary: "A 61-year-old man with a sore throat and a cold for two days who wants something to ease it. He has no temperature and is eating and drinking normally. A few months ago he was told his sugar was high and he takes a tablet for it, but he does not think of himself as having a weakened immune system. His GP record lists type 2 diabetes."

opening_statement: "I've had a sore throat for two days with a cold. Can you suggest something for it?"

findings:
  present: [sore_throat, wants_help_with_sore_throat, cough_or_runny_nose]
  absent: [difficulty_breathing, unable_to_swallow, drooling, stridor, severe_and_worsening_quickly,
      swelling_in_mouth_and_throat, difficulty_speaking, difficulty_opening_mouth,
      very_high_temperature, dehydration_signs, pus_on_tonsils, too_painful_to_eat_or_drink,
      worried_about_symptoms, sore_throat_over_a_week, frequent_sore_throats,
      lump_in_mouth_or_neck, mouth_ulcer_over_3_weeks, swollen_neck_glands, very_tired,
      stroke_signs, severe_breathing_difficulty, lips_or_skin_blue_grey, passed_out,
      sudden_confusion, heavy_bleeding, serious_self_harm, chest_pain, short_of_breath, cold_or_shivery]
  unknown: [weakened_immune_system]

context:
  none: {}
  basic: {age: 61, sex: male}
  full:
    age: 61
    sex: male
    findings: {weakened_immune_system: "yes"}

expected:
  acuity: urgent
  level_of_care: urgent_care
  timeframe: today

minimum_safe_acuity: urgent

red_flags:
