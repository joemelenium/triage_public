notes: 'The red flag is not specific to chest pain and is easy to miss: the signs have stopped, he calls
  it ''a funny turn'', and he is asking about his chest. stroke_symptoms.txt says to call 999 for signs
  of a stroke in the last 24 hours even if they have stopped. On the chest pain alone the advice would
  be far less urgent: ''See a GP'' for chest pain that comes and goes (chest_pain.txt) or NHS 111 (angina.txt).
  difficulty_speaking is no because his speech is normal again. For the questions added to the list later:
  he has high blood pressure (heart_risk_factors yes); the ache has no clear trigger, so the pattern questions
  are no.'
