# Observations: stomach and bowel (stomach ache, diarrhoea and being sick, bleeding,
# constipation, bloating, the bottom, worms, and babies who bring up milk).
# NOT FOR CLINICAL USE. A demonstration and proof of concept only.
#
# Shared observations used here that live in other files, and are reused rather
# than repeated:
#   chest_and_heart.yaml  sweating, light_headed, fainted, short_of_breath, chest_pain,
#                         cp_tight_or_squeezing, cp_heavy, cp_spreads, heartburn_or_sour_taste,
#                         heart_beating_very_fast, heart_risk_factors, has_heart_rhythm_problem,
#                         pregnant_or_recently_given_birth, has_cancer, recent_viral_illness,
#                         upper_back_pain
#   breathing.yaml        breathing_very_fast, feels_very_unwell, seriously_unwell_getting_worse,
#                         baby_high_temperature, skin_blotchy, rash_does_not_fade, not_peed_12_hours,
#                         cold_or_shivery, child_floppy_or_hard_to_wake, feeding_much_less,
#                         weight_loss, night_sweats, smoker, long_term_condition, has_allergies,
#                         raised_itchy_rash, had_a_fit
#   ear_nose_throat.yaml  very_high_temperature, dehydration_signs, weakened_immune_system,
#                         difficulty_breathing, very_tired, worried_about_symptoms
#   general.yaml          sudden_confusion, lips_or_skin_blue_grey, passed_out, severe_breathing_difficulty,
#                         age bands, sex_female, sex_male
#
# Fields: as in general.yaml.

