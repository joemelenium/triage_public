notes: "Over-triage test. covid_19.txt gives self-help for breathlessness and only escalates if symptoms get worse or do not improve. SOURCE DIFFERENCE: shortness_of_breath.txt ('Contact NHS 111 if you have difficulty breathing – you may be more short of breath than usual'; 'always see a GP') and flu.txt ('you feel short of breath' with flu: urgent) are more cautious. Judgement: self-care, because she is improving and covid_19.txt is the specific page; reviewers may wish to relax the minimum safe acuity. sore_throat is a secondary finding, not a presenting symptom."
