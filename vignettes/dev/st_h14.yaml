notes: "Two presenting symptoms; the chest pain should decide the outcome, not the cold-type sore throat, which alone would lead to a pharmacist. The pattern matches the description on angina.txt (brought on by exercise or cold, stopping after a few minutes' rest). The pages give three different levels for it. angina.txt action box: 'Urgent advice: Get help from NHS 111 if: you have chest pain or other symptoms of angina that come and go'. angina.txt opening paragraph: 'see a GP as soon as possible if you think you may have it'. chest_pain.txt: 'Non-urgent advice: See a GP if: you have chest pain that comes and goes'. Judgement: the expected outcome follows the angina.txt action box (urgent); the minimum safe acuity is 'soon', from the angina.txt opening paragraph, because the story fits that page closely; the routine GP advice on chest_pain.txt is treated as too slow here. chest_pain.txt says heart problems are more likely with high blood pressure or a family history, but attaches no action to them. The pain is not present now, is not tight and does not spread, so no 'Call 999' criterion is met. angina.txt gives no time, so 'today' is used to match the urgent level."
