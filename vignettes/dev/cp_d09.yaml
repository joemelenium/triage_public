notes: 'The patient genuinely cannot answer cp_spreads: her shoulder ached before the chest pain started.
  Pain that spreads to the shoulder is a 999 sign on angina.txt (''your neck, jaw, shoulder, stomach or
  back''). It can be neither confirmed nor ruled out, so red_flags is left empty and the expected outcome
  uses when_to_call_999.txt: ''Get help from NHS 111 if you''re not sure if you need to call 999''. Minimum
  safe acuity is also urgent: with a possible 999 sign unresolved, the routine ''See a GP'' advice of
  chest_pain.txt for pain that comes and goes is judged not enough, and angina.txt independently gives
  NHS 111 for chest pain that comes and goes. Source difference recorded: chest_pain.txt (non-urgent GP)
  against angina.txt (NHS 111) for chest pain that comes and goes. The sources say nothing directly about
  how to act when a patient cannot answer a question; this is a judgement. For the questions added to
  the list later: the ache has no link to effort, meals, strain or worry and she has none of the listed
  risk factors, so all are no.'
