notes: "The pages say little about glandular fever: sore_throat.txt names it as a possible cause, and tonsillitis.txt says a GP may arrange 'a blood test for glandular fever if symptoms are severe or will not go away'. Neither page describes its symptoms; tiredness and swollen glands appear only as symptoms of tonsillitis. The outcome therefore rests on the one-week rule, which both pages give (sore_throat.txt 'does not improve after a week'; tonsillitis.txt 'do not go away within 1 week'), not on recognising glandular fever. No timescale is given, so the acuity is routine. She also wants help, which meets the pharmacist criterion; the GP criterion should take priority, and pharmacy or self-care advice alone would fall short. Contact with someone who has glandular fever cannot be expressed with the question list."
