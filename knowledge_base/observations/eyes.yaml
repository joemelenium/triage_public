  phrases: ["lump on my eyelid", "swollen eyelid", "droopy eyelid", "sore eyelid"]
  source: nhs_eyelid_problems

- id: bulging_eyes
  label: "Bulging eyes"
  question: "Do your eyes look like they are bulging or sticking out more than usual? You may see more of the whites of your eyes."
