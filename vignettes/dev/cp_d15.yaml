atypical: false
notes: 'Context test, and an easy red flag to miss: the pain is mild, came on gradually, and has no spread
  or other symptoms. He cannot say whether a doctor has told him he has angina (he remembers tests and
  tablets, not the name), so has_angina is ''not sure''; the record says yes. With the record, angina.txt
  applies directly: diagnosed angina with pain that does not stop after resting for a few minutes means
  call 999. Without it, no 999 sign on chest_pain.txt is met (the pain is not sudden, does not spread,
  and has no associated symptoms), so the supported advice is less urgent: ''get medical advice'' (chest_pain.txt),
  or NHS 111 because he cannot be sure whether 999 is needed (when_to_call_999.txt). Hence more_urgent.
  Source difference: pulmonary_embolism.txt lists ''pain in your chest or upper back'' under ''Call 999
  or go to A&E'', which read literally would make this an emergency even without the record. angina_worse_than_usual
  is no because, not knowing he has angina, he reports no change in it. No question asks whether he has
  angina medicine or has used it. For the questions added to the list later: cp_on_exertion is no, because
  although the ache came on while he was walking it has not eased with rest, which is the point of the
  case; he has high blood pressure (heart_risk_factors yes).'
