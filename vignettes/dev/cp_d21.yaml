safety_netting_should_cover:
- point: Get help from NHS 111 today
  any_of: ['111']
- point: Call 999 if the pain comes on suddenly and does not go away, spreads to the arm, neck, jaw, stomach
    or back, or comes with feeling sweaty, sick, light-headed or short of breath
  any_of: ['999']
source:
  expected_outcome: {page: angina.txt, quote: you have chest pain or other symptoms of angina that come
      and go}
  minimum_safe_acuity: {page: chest_pain.txt, quote: you have chest pain that comes and goes}
atypical: false
notes: 'The pattern points one way and the background the other, and the pages disagree, which is why
  expected and minimum safe acuity differ. His pain matches angina.txt''s description (brought on by exercise
  or cold, stops after resting for a few minutes), and that page says ''Get help from NHS 111'' for ''chest
  pain or other symptoms of angina that come and go''. chest_pain.txt puts chest pain that comes and goes
  under non-urgent ''See a GP''. His background makes a heart cause less likely on the sources'' own terms:
  angina.txt lists men aged 45 or over, smokers and people with other conditions as more likely to get
  angina, and chest_pain.txt says heart problems are more likely in older people and those at risk. But
  no page gives different advice for a young person. Judgement: expected follows the angina page because
  the pattern is the one it describes; the minimum safe acuity is routine, the explicit advice of chest_pain.txt,
  because nothing in his background adds weight and he does not himself think he has angina (compare the
  cases where the same pattern comes with risk factors, where ''see a GP as soon as possible'' is used
  as the minimum). red_flags is left empty for the same reason. family_heart_history is ''not sure'':
  he does not know his father''s family. cp_after_injury_or_exercise is no: the pain comes during each
  run and goes on stopping; it did not start after one bout of exercise and there is no sore muscle to
  rest. That question and cp_on_exertion both mention exercise and rest, and a patient could easily answer
  yes to both.'
