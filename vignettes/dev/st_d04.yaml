id: st_d04
status: "AI-drafted, not clinically approved"
authored_by: "AI, in a session separate from the knowledge base"

presenting: [sore_throat]

summary: "A 3-year-old boy who has complained of a sore throat since yesterday. This evening he makes a high-pitched noise every time he breathes in, and his tummy pulls in under his ribs with each breath. He is sitting quietly watching television, is drinking, and does not seem distressed, so his parent is not sure whether he is finding it hard to breathe. He will not open his mouth for his parent to look at his throat. His parent is answering."

opening_statement: "My three-year-old has had a sore throat since yesterday and tonight he's making a squeaky, high-pitched noise when he breathes in. His tummy sort of pulls in under his ribs as well. He seems happy enough otherwise."

findings:
  present: [sore_throat, stridor, difficulty_breathing, short_of_breath, worried_about_symptoms,
      wants_help_with_sore_throat, symptoms_worse_or_not_better]
  absent: [unable_to_swallow, drooling, severe_and_worsening_quickly, swelling_in_mouth_and_throat,
      difficulty_speaking, difficulty_opening_mouth, very_high_temperature, dehydration_signs,
      weakened_immune_system, too_painful_to_eat_or_drink, sore_throat_over_a_week,
      frequent_sore_throats, lump_in_mouth_or_neck, mouth_ulcer_over_3_weeks,
      cough_or_runny_nose, swollen_neck_glands, very_tired, stroke_signs,
      severe_breathing_difficulty, lips_or_skin_blue_grey, passed_out, sudden_confusion,
      heavy_bleeding, serious_self_harm, chest_pain, cold_or_shivery]
  unknown: [pus_on_tonsils]

context:
  none: {}
  basic: {age: 3, sex: male}
  full: {age: 3, sex: male}

expected:
  acuity: emergency
  level_of_care: emergency_department
  timeframe: now

minimum_safe_acuity: emergency

red_flags:
  - description: "High-pitched sound when breathing in (stridor)"
    findings: [stridor]
    minimum_acuity: emergency
    source: {page: sore_throat.txt, quote: "are making a high-pitched sound as you breathe (called stridor)"}
  - description: "Stomach pulling in under the ribcage with each breath, which the source gives as a sign of difficulty breathing in a child"
    findings: [difficulty_breathing]
    minimum_acuity: emergency
    source: {page: shortness_of_breath.txt, quote: "has difficulty breathing – they may make grunting noises or suck their stomach in under their ribcage"}

safety_netting_should_cover:
  - point: "Call 999 or go to A&E now"
    any_of: ["999", "A&E"]
  - point: "Not to drive themselves to A&E"
    any_of: ["do not drive", "don't drive", "not drive"]

source:
  expected_outcome: {page: sore_throat.txt, quote: "Immediate action required: Call 999 or go to A&E now if:"}
  minimum_safe_acuity: {page: sore_throat.txt, quote: "are making a high-pitched sound as you breathe (called stridor)"}

atypical: false
notes: "Easy to miss because the child looks comfortable and the parent does not think of him as struggling. The emergency box on sore_throat.txt applies to 'You or your child', and stridor alone is enough for the expected outcome. shortness_of_breath.txt also says to call 999 or go to A&E if a child 'has difficulty breathing' and describes what a parent may see (grunting noises, the stomach sucking in under the ribcage). Mapping updated after the question list changed: the difficulty-breathing question now describes those signs in a child, so the tummy pulling in under his ribs is recorded as difficulty_breathing present and the second red flag uses that id. Under the earlier wording the parent answered 'not sure' and that red flag had no finding ids. difficulty_breathing is now part_of short_of_breath, so short_of_breath has moved from absent to present; the summary's remark that the parent is not sure describes the parent's own impression, not the answer to the question as now worded. The two pages do not conflict. If only the parent's worry were acted on, the result would be urgent, which is not enough. The parent cannot see his tonsils, so pus is unknown; the outcome does not depend on it. The page offers either 999 or A&E, so emergency_department is used as the level of care, together with the page's advice not to drive there."
