# Entry symptom: teeth grinding (bruxism).
# NOT FOR CLINICAL USE. AI-drafted, not clinically reviewed.
#
# Each rule says: WHEN these findings are present, the outcome is at least THIS.
# The engine takes the most urgent rule that fires. If none fires, it uses the
# default at the bottom.
#
# Sources: the NHS Teeth grinding page, with the Temporomandibular disorder
# (jaw joint) and Sleep apnoea pages.

id: teeth_grinding
name: "Teeth grinding"
presenting_finding: teeth_grinding
status: "AI-drafted, not clinically reviewed"

screens:
  - id: teeth_grinding_urgent_screen
    level: urgent
    question: "Do any of these apply? Choose all that apply."
    findings:
      - jaw_locked_or_cannot_eat
      - vision_change_sudden

red_flags:
  - id: rf_tg_jaw_locked
    description: "Jaw locking, or so painful you cannot eat or drink"
    when: jaw_locked_or_cannot_eat
    outcome: {acuity: urgent, level_of_care: urgent_care, timeframe: today, timeframe_detail: "Ask for an urgent GP appointment or get help from NHS 111"}
    advice: advice_jaw_urgent
    source: nhs_tmd

  - id: rf_tg_vision
    description: "Jaw pain with problems with eyesight, such as double vision or loss of vision"
    when: vision_change_sudden
    outcome: {acuity: urgent, level_of_care: urgent_care, timeframe: today, timeframe_detail: "Ask for an urgent GP appointment or get help from NHS 111 now"}
    advice: advice_jaw_urgent
    source: nhs_tmd
    note: "The jaw joint (TMD) page lists these as signs of a serious problem that needs urgent treatment. The same page also lists clicking and difficulty opening the mouth fully as urgent; those are left to the conditions here, as they are the usual signs of a jaw joint problem from grinding. Needs clinical review."

outcome_rules:
  - id: or_tg_breathing_stops
    description: "Teeth grinding with breathing that stops and starts during sleep"
    when: breathing_stops_in_sleep
    outcome: {acuity: routine, level_of_care: general_practice, timeframe: no_fixed_time, timeframe_detail: "See a GP. The source gives no fixed time."}
    advice: advice_snoring_gp
    source: nhs_sleep_apnoea
    note: "The Teeth grinding page lists sleep apnoea as a cause. The Sleep apnoea page says see a GP for breathing that stops and starts while you sleep."

default:
  description: "Teeth grinding: see a dentist"
  outcome: {acuity: routine, level_of_care: dental, timeframe: no_fixed_time, timeframe_detail: "See a dentist. The source gives no fixed time."}
  advice: advice_teeth_grinding_dentist
  source: nhs_teeth_grinding
  # A floor: the Teeth grinding page says see a dentist if you grind your teeth and
  # have damage or pain, if your partner says you grind them in your sleep, or if
  # you are worried about your child grinding their teeth.
  floor: true
  note: "AI reading: the reasons the page gives for seeing a dentist cover almost everyone who would ask about teeth grinding."
