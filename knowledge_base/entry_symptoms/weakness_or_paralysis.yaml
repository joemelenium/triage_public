# Entry symptom: weakness or paralysis (not being able to move part of the body).
# NOT FOR CLINICAL USE. AI-drafted, not clinically reviewed.
#
# Each rule says: WHEN these findings are present, the outcome is at least THIS.
# A rule marked "soft: true" is the exception: the conditions that look likely
# may lower its outcome, if something the patient said points to a milder cause.
# The engine takes the most urgent rule that fires. If none fires, it uses the
# default at the bottom.
#
# Must-not-miss causes: stroke and mini-stroke (TIA), bleeding on the brain,
# Guillain-Barre syndrome, and pressure on the spinal cord or the nerves at the
# bottom of the spine (cauda equina syndrome). The spinal condition cards belong
# to the bones, joints and muscles batch; a red flag rule here catches them.

id: weakness_or_paralysis
name: "Weakness or paralysis"
presenting_finding: weakness_or_paralysis
also_covers: [nhs_paralysis]
status: "AI-drafted, not clinically reviewed"

screens:
  - id: weakness_emergency_screen
    level: emergency
    question: "Do any of these apply? Choose all that apply."
    findings:
      - weakness_sudden
      - weakness_one_side
      - face_droop_one_side
      - weakness_after_injury
      - difficulty_speaking
      - difficulty_breathing
      - unable_to_swallow
      - face_numbness
      - pins_and_needles
      - weakness_spreading_up
      - legs_weak_or_numb
      - bladder_bowel_change
      - saddle_numbness
      - headache_sudden_severe

red_flags:
  # ---- Emergency ---------------------------------------------------------
  - id: rf_wk_sudden
    description: "Weakness or paralysis that happened suddenly"
    when: weakness_sudden
    outcome: {acuity: emergency, level_of_care: emergency_ambulance, timeframe: now, timeframe_detail: "Call 999"}
    advice: advice_stroke
    source: nhs_paralysis

  - id: rf_wk_one_side
    description: "Weakness that affects one side of the face or body, or one arm"
    when: {any: [weakness_one_side, face_droop_one_side]}
    outcome: {acuity: emergency, level_of_care: emergency_ambulance, timeframe: now, timeframe_detail: "Call 999"}
    advice: advice_stroke
    source: nhs_paralysis
    note: "The Bell's palsy page also says call 999 for a face drooping on one side, because it can be a stroke."

  - id: rf_wk_after_injury
    description: "Weakness or paralysis after an injury to the head, neck or back"
    when: weakness_after_injury
    outcome: {acuity: emergency, level_of_care: emergency_ambulance, timeframe: now, timeframe_detail: "Call 999. Do not move the person if they have hurt their neck or back, unless they are in danger."}
    advice: advice_weakness_999
    source: nhs_paralysis

  - id: rf_wk_speech_breathing_swallowing
    description: "Weakness that causes problems with speech, breathing or swallowing"
    when: {any: [difficulty_speaking, difficulty_breathing, unable_to_swallow]}
    outcome: {acuity: emergency, level_of_care: emergency_ambulance, timeframe: now, timeframe_detail: "Call 999"}
    advice: advice_weakness_999
    source: nhs_paralysis

  - id: rf_wk_numb_and_tingling
    description: "Weakness, and cannot feel part of the face or body, with tingling"
    when: {any: [face_numbness, pins_and_needles]}
    outcome: {acuity: emergency, level_of_care: emergency_ambulance, timeframe: now, timeframe_detail: "Call 999"}
    advice: advice_weakness_999
    source: nhs_paralysis
    soft: true    # likely conditions may lower this: slow nerve conditions also cause numbness with weakness
    note: "Taken from the Paralysis page. Marked soft because numbness and tingling with weakness that has come on slowly, for example from nerve damage in diabetes or multiple sclerosis, is common and is sent to a GP by the same page. Sudden weakness is sent to 999 by a firm rule above."

  - id: rf_wk_headache_sudden
    description: "Weakness with a headache that came on suddenly and is extremely painful"
    when: headache_sudden_severe
    outcome: {acuity: emergency, level_of_care: emergency_ambulance, timeframe: now, timeframe_detail: "Call 999"}
    advice: advice_headache_999
    source: nhs_subarachnoid_haemorrhage

  - id: rf_wk_legs_bladder_bowel
    description: "Numbness or weakness in both legs with problems controlling pee or poo, or numbness around the bottom"
    when: {all: [legs_weak_or_numb, {any: [bladder_bowel_change, saddle_numbness]}]}
    outcome: {acuity: emergency, level_of_care: emergency_department, timeframe: now, timeframe_detail: "Go to A&E now, or call 999"}
    advice: advice_weakness_ae
    source: ai_judgement
    note: "Clinical knowledge: these are signs of pressure on the spinal cord or on the nerves at the bottom of the spine (cauda equina syndrome), which needs an emergency operation. The NHS page for cauda equina syndrome belongs to the bones, joints and muscles batch."

  - id: rf_wk_spreading_ae
    description: "Tingling or weakness that started in the feet or hands and is spreading up the body: possible Guillain-Barre syndrome"
    when: weakness_spreading_up
    outcome: {acuity: emergency, level_of_care: emergency_department, timeframe: now, timeframe_detail: "Go to A&E now"}
    advice: advice_weakness_ae
    source: ai_judgement
    soft: true    # likely conditions may lower this: the source page gives a lower urgency
    note: "Source difference: the Guillain-Barre syndrome page says an urgent GP appointment or 111 if you think you have it. A&E is AI judgement because the weakness can spread to the breathing muscles within hours. Soft, with the urgent rule below as its floor."

  # ---- Urgent --------------------------------------------------------------
  - id: rf_wk_spreading
    description: "Tingling or weakness spreading up from the feet or hands"
    when: weakness_spreading_up
    outcome: {acuity: urgent, level_of_care: urgent_care, timeframe: today, timeframe_detail: "Ask for an urgent GP appointment or get help from NHS 111"}
    advice: advice_weakness_urgent
    source: nhs_guillain_barre_syndrome

outcome_rules:
  - id: or_wk_gradual
    description: "Weakness that started gradually or is getting slowly worse"
    when: weakness_gradual
    outcome: {acuity: routine, level_of_care: general_practice, timeframe: no_fixed_time, timeframe_detail: "See a GP. The source gives no fixed time."}
    advice: advice_weakness_gp
    source: nhs_paralysis

  - id: or_wk_comes_and_goes
    description: "Weakness that comes and goes"
    when: weakness_comes_and_goes
    outcome: {acuity: routine, level_of_care: general_practice, timeframe: no_fixed_time, timeframe_detail: "See a GP. The source gives no fixed time."}
    advice: advice_weakness_gp
    source: nhs_paralysis

default:
  description: "Weakness with nothing that needs more urgent help: see a GP to find the cause"
  outcome: {acuity: routine, level_of_care: general_practice, timeframe: no_fixed_time, timeframe_detail: "See a GP. The source gives no fixed time."}
  advice: advice_weakness_gp
  source: nhs_paralysis
  floor: true
  note: "The page sends weakness that started gradually, is getting worse or comes and goes to a GP, and sudden weakness to 999. A GP as the floor for everyone with weakness is a reading of that."
