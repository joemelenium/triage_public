conversion_notes: '''Pain and redness of the skin of his lower extremity'', with a pretibial area that is ''erythematous, edematous, and tender'', is mapped to leg_pain_or_swelling. ''Low-grade fever is present'' (no temperature given) is not mapped to very_high_temperature: left out rather than marked absent. Rule used for very_high_temperature in this set: present when the text states a fever (not described as low-grade), chills, rigors or feeling hot; left out when the fever is described as low-grade or measured below 38.0 C; absent when fever is explicitly ruled out. Text is from the ''Vignette'' column of Supplemental Table 2 in the web appendix (vignette 21 of 45, in the published order); the ''Simplified (added symptoms)'' column is not copied. The publication gives this vignette''s source as: Epocrates (online.epocrates.com), 2014.'
