# Observations: general, checked for everyone, and patient context.
# NOT FOR CLINICAL USE. A demonstration and proof of concept only.
#
# An observation is anything the engine can know about a patient: a symptom, a
# feature of a symptom, a risk factor (history, lifestyle, an event) or context
# such as age. Each is answered "yes", "no" or "not sure". Observations are kept
# in one file per body system. All files together form one shared network.
#
# Fields:
#   id             used by rules and condition cards to refer to it
#   label          short name used in reports
#   question       what the patient is asked
#   question_carer optional: the question when someone answers for another person
#   checklist_text optional: a short form, used as one line of a checklist
#   kind           presenting (a main symptom), symptom, history, or context
#   parent         optional: a more general observation this one belongs to. A "yes"
#                  here means "yes" to the parent too; a "no" to the parent means
#                  "no" here, so it is not asked.
#   relation       with a parent: duration, severity, character, exacerbating_factor,
#                  diminishing_factor, location or radiation
#   sex            optional: female or male, if it only applies to one
#   asked_only_if  optional: only asked after a "yes" (or "not sure") to that observation
#   seriousness    optional: serious, emergency or emergency_ambulance, where a source
#                  names it as an alarming sign (used in the five-level output)
#   group          related observations share a group so evidence is not counted twice
#   age_range      the answer is worked out from the patient's age, when the age is known
#   snomed         SNOMED CT code, only where checked and listed in sources/snomed_codes.yaml
#   source         id in sources/source_log.yaml

- id: stroke_signs
  label: "Signs of a stroke"
  question: "Do you think you are having a stroke, or have you had signs of a stroke in the last 24 hours, even if they have now stopped? The main signs are: one side of the face drooping, not being able to lift both arms and keep them up, or slurred or confused speech. Other signs include weakness or numbness down one side of the body, and blurred vision or loss of sight."
  checklist_text: "Signs of a stroke now or in the last 24 hours: face drooping on one side, cannot lift both arms, or slurred speech"
  kind: symptom
  phrases: ["face drooping", "can't lift my arm", "slurred speech"]
  source: nhs_stroke_symptoms

- id: severe_breathing_difficulty
  label: "Severe difficulty breathing"
  question: "Are you having severe difficulty breathing? This means gasping, choking or not being able to get words out."
  checklist_text: "Severe difficulty breathing. Gasping, choking or cannot get words out."
  kind: symptom
  parent: difficulty_breathing
  relation: severity
  group: breathing
  phrases: ["can't breathe", "gasping", "choking", "can't get my words out"]
  source: nhs_heart_attack

- id: lips_or_skin_blue_grey
  label: "Lips or skin pale, blue or grey"
  question: "Are your lips or skin pale, blue or grey? On brown or black skin this may be easier to see on the palms of the hands."
  checklist_text: "Lips or skin pale, blue or grey"
  kind: symptom
  phrases: ["blue lips", "grey skin", "gone very pale"]
  source: nhs_heart_attack

- id: passed_out
  label: "Passed out and not responding normally"
  question: "Has the person who is unwell passed out and is not responding as normal?"
  checklist_text: "Passed out and not responding as usual"
  kind: symptom
  snomed: "422768004"
  group: consciousness
  phrases: ["passed out", "collapsed", "not responding", "unconscious"]
  source: nhs_heart_attack

- id: sudden_confusion
  label: "Suddenly confused"
  question: "Do you feel suddenly confused?"
  checklist_text: "Suddenly confused"
  kind: symptom
