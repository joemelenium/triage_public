notes: "Over-triage test. Brief asthma symptoms with a known animal trigger, relieved fully by a normal reliever dose; no attack, not needing the reliever more often than usual, no signs of allergic reaction beyond the asthma. asthma.txt self-help: 'always have your inhaler with you' and avoid triggers such as animals. asthma.txt gives no explicit 'self-care' box, so this is a judgement: the GP advice applies only when 'treatments are not helping' or symptoms are not improving, which is not the case. after_allergy_trigger (food, medicine or sting) is absent, separating this from anaphylaxis."
