# Entry symptom: fainting (passing out for a short time).
# NOT FOR CLINICAL USE. AI-drafted, not clinically reviewed.
#
# Each rule says: WHEN these findings are present, the outcome is at least THIS.
# A rule marked "soft: true" is the exception: the conditions that look likely
# may lower its outcome, if something the patient said points to a milder cause.
# The engine takes the most urgent rule that fires. If none fires, it uses the
# default at the bottom.
#
# The main symptom reuses "fainted" from chest_and_heart.yaml, so a "yes" to
# fainting during a chest pain or palpitations session brings these rules in too.
# The universal red flag for someone who has passed out and is not responding
# normally is checked first, for everyone.
#
# Must-not-miss causes: a heart rhythm problem or other heart cause, a blood clot
# in the lung, bleeding on the brain, low blood sugar. Bleeding inside the body
# (for example from the stomach, or an ectopic pregnancy) belongs to other body
# systems and is not covered here.

id: fainting
name: "Fainting"
presenting_finding: fainted
also_covers: [nhs_fainting]
status: "AI-drafted, not clinically reviewed"

screens:
  - id: fainting_emergency_screen
    level: emergency
    question: "Do any of these apply? Choose all that apply."
    findings:
      - not_recovered_after_faint
      - slow_to_wake_after_faint
      - chest_pain
      - palpitations
      - seriously_injured_in_collapse
      - had_a_fit
      - fainted_during_exercise
      - fainted_lying_down
      - headache_sudden_severe
      - short_of_breath

  - id: fainting_urgent_screen
    level: urgent
    question: "Do any of these apply? Choose all that apply."
    findings:
      - fainted_without_warning
      - known_heart_condition
      - family_sudden_death

red_flags:
  # ---- Emergency ---------------------------------------------------------
  - id: rf_fa_not_recovered
    description: "Has not fully recovered after fainting, or has difficulty speaking or moving"
    when: not_recovered_after_faint
    outcome: {acuity: emergency, level_of_care: emergency_ambulance, timeframe: now, timeframe_detail: "Call 999"}
    advice: advice_fainting_999
    source: nhs_fainting

  - id: rf_fa_slow_to_wake
    description: "Could not be woken up within 1 minute"
    when: slow_to_wake_after_faint
    outcome: {acuity: emergency, level_of_care: emergency_ambulance, timeframe: now, timeframe_detail: "Call 999"}
    advice: advice_fainting_999
    source: nhs_fainting

  - id: rf_fa_chest_pain_or_palpitations
    description: "Fainted with chest pain, or a pounding, fluttering or irregular heartbeat"
    when: {any: [chest_pain, palpitations]}
    outcome: {acuity: emergency, level_of_care: emergency_ambulance, timeframe: now, timeframe_detail: "Call 999"}
    advice: advice_fainting_999
    source: nhs_fainting
    note: "Source difference: the Heart palpitations page says an urgent GP appointment or 111 for palpitations with fainting that have stopped. The Fainting page says call 999. The more urgent is used."

  - id: rf_fa_injured
    description: "Seriously hurt before or after fainting"
    when: seriously_injured_in_collapse
    outcome: {acuity: emergency, level_of_care: emergency_ambulance, timeframe: now, timeframe_detail: "Call 999"}
    advice: advice_fainting_999
    source: nhs_fainting

  - id: rf_fa_shaking
    description: "Shaking or jerking (a seizure or fit) with the faint"
    when: had_a_fit
    outcome: {acuity: emergency, level_of_care: emergency_ambulance, timeframe: now, timeframe_detail: "Call 999"}
    advice: advice_fainting_999
    source: nhs_fainting
    note: "A few jerks during a common faint are usual and can look like a seizure. The source still says call 999, so this is kept firm."

  - id: rf_fa_exercise
    description: "Fainted while exercising"
    when: fainted_during_exercise
    outcome: {acuity: emergency, level_of_care: emergency_ambulance, timeframe: now, timeframe_detail: "Call 999"}
    advice: advice_fainting_999
    source: nhs_fainting

  - id: rf_fa_lying_down
    description: "Fainted while lying down"
    when: fainted_lying_down
    outcome: {acuity: emergency, level_of_care: emergency_ambulance, timeframe: now, timeframe_detail: "Call 999"}
    advice: advice_fainting_999
    source: nhs_fainting

  - id: rf_fa_headache_sudden
    description: "Fainted with a headache that came on suddenly and is extremely painful"
    when: headache_sudden_severe
    outcome: {acuity: emergency, level_of_care: emergency_ambulance, timeframe: now, timeframe_detail: "Call 999"}
    advice: advice_headache_999
    source: nhs_subarachnoid_haemorrhage
    note: "The Subarachnoid haemorrhage page lists fainting as a symptom."

  - id: rf_fa_short_of_breath
    description: "Fainted and short of breath"
    when: short_of_breath
    outcome: {acuity: emergency, level_of_care: emergency_department, timeframe: now, timeframe_detail: "Go to A&E now, or call 999"}
    advice: advice_fainting_ae
    source: ai_judgement
    note: "Clinical knowledge: fainting with breathlessness can be a blood clot in the lung or a heart problem. The breathlessness entry symptom also applies once this is reported."

  # ---- Urgent --------------------------------------------------------------
  - id: rf_fa_no_warning
    description: "Fainted with no warning at all"
    when: fainted_without_warning
    outcome: {acuity: urgent, level_of_care: urgent_care, timeframe: today, timeframe_detail: "Get help from NHS 111 or an urgent GP appointment today"}
    advice: advice_fainting_urgent
    source: ai_judgement
    soft: true    # likely conditions may lower this: it is AI judgement
    note: "Clinical knowledge: fainting with no warning is more likely to have a heart cause. The Fainting page gives no urgency for this."

  - id: rf_fa_heart_condition
    description: "Fainted, and has a heart condition"
    when: known_heart_condition
    outcome: {acuity: urgent, level_of_care: urgent_care, timeframe: today, timeframe_detail: "Get help from NHS 111 or an urgent GP appointment today"}
    advice: advice_fainting_urgent
    source: ai_judgement
    note: "Clinical knowledge: fainting in someone with a heart condition needs checking the same day. The Fainting page lists heart problems as a cause."

  - id: rf_fa_family_sudden_death
    description: "Fainted, and a family member died suddenly under 40 or has an inherited heart condition"
    when: family_sudden_death
    outcome: {acuity: urgent, level_of_care: urgent_care, timeframe: today, timeframe_detail: "Get help from NHS 111 or an urgent GP appointment today"}
    advice: advice_fainting_urgent
    source: ai_judgement
    soft: true    # likely conditions may lower this: it is AI judgement
    note: "Clinical knowledge: some heart rhythm problems run in families and first show as fainting."

  - id: rf_fa_low_sugar
    description: "Diabetes and signs of low blood sugar (a hypo)"
    when: {all: [has_diabetes, diabetes_low_sugar_signs]}
    outcome: {acuity: urgent, level_of_care: urgent_care, timeframe: today, timeframe_detail: "Treat the low blood sugar now. If it does not improve, get help from NHS 111, or call 999 if the person becomes drowsy or confused."}
    advice: advice_low_blood_sugar
    source: nhs_low_blood_sugar

outcome_rules:
  - id: or_fa_more_than_once
    description: "Fainted more than once recently"
    when: fainted_more_than_once
    outcome: {acuity: routine, level_of_care: general_practice, timeframe: no_fixed_time, timeframe_detail: "See a GP. You must tell the DVLA if you faint regularly and you drive."}
    advice: advice_fainting_gp
    source: nhs_fainting

default:
  description: "Fainted, with nothing that needs more urgent help: see a GP to find the cause"
  outcome: {acuity: routine, level_of_care: general_practice, timeframe: no_fixed_time, timeframe_detail: "See a GP. The source gives no fixed time."}
  advice: advice_fainting_gp
  source: nhs_fainting
  # A floor: the source says to see a GP if you have fainted.
  floor: true
