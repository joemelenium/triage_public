notes: "Over-triage trap. Pain on swallowing is an ordinary symptom (sore_throat.txt 'a painful throat, especially when swallowing'; tonsillitis.txt 'problems swallowing'), whereas being unable to swallow is an emergency sign on both pages. She can swallow food and drink, so unable_to_swallow and too_painful_to_eat_or_drink are absent. A croaky voice is not a warning sign on either page (sore_throat.txt lists laryngitis as a cause). tonsillitis.txt lists 'you have difficulty speaking' as an emergency sign, but she can speak normally. The pages do not say where painful swallowing ends and 'unable to swallow' begins."
