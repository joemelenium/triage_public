atypical: false
notes: 'Several emergency signs together. pulmonary_embolism.txt gives ''Call 999 or go to A&E'' for difficulty
  breathing that comes on suddenly, pain in the chest and a very fast heartbeat; chest_pain.txt gives
  ''Call 999'' for sudden chest pain that does not go away and for chest pain with shortness of breath.
  emergency_ambulance is recorded because chest_pain.txt says 999; emergency_department is also supported
  by the pulmonary embolism page. leg_pain_or_swelling is ''not sure'': his leg is swollen from the operation
  and he cannot tell whether it is worse. Source difference: heart_attack_symptoms.txt puts chest pain
  with a ''racing'' heart under NHS 111, pulmonary_embolism.txt puts a very fast heartbeat under 999 or
  A&E; the other signs here settle it. severe_breathing_difficulty is no because he can speak in sentences.
  angina_pain_not_settling is answered yes because the pain is still there at rest, which is the honest
  answer to that question as worded; the patient has no angina diagnosis. cp_after_injury_or_exercise
  is no: the operation was on his knee, not his chest. The question list cannot say that the breathlessness
  came on suddenly, nor that he has just been in hospital (which pulmonary_embolism.txt mentions as a
  time of higher risk).'
