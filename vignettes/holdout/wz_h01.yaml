atypical: true
notes: "Anaphylaxis with wheeze as the main complaint and NO rash (anaphylaxis.txt: 'You may also have a rash' — a rash is not required). Marked atypical because the missing rash may falsely reassure. Universal emergency signs: sudden lip swelling and a tight throat. Breathing is not yet severe, so severe_breathing_difficulty is absent."
