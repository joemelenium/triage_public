conversion_notes: 'Sore throat is one of the two main complaints. ''He feels hot and sweaty'' is mapped to very_high_temperature present (that question includes feeling hot) and to sweating present, although on examination he is afebrile. A 2-day history means sore_throat_over_a_week is absent. ''He would like antibiotics'' is mapped to wants_help_with_sore_throat present. ''Coughing up clear sputum'': blood is not mentioned either way, so coughing_up_blood is left out. ''A slightly inflamed pharynx'': pus on the tonsils is not mentioned either way, so pus_on_tonsils is left out. ''Nontender cervical lymphadenopathy'' is not mapped to lump_in_mouth_or_neck. One similar illness ''last year'' is not enough for frequent_sore_throats. In the PDF the diagnosis label overlaps the start of this row; the opening words were read as ''A 30-year-old man presents''. Rule used for very_high_temperature in this set: present when the text states a fever (not described as low-grade), chills, rigors or feeling
  hot; left out when the fever is described as low-grade or measured below 38.0 C; absent when fever is explicitly ruled out. Text is from the ''Vignette'' column of Supplemental Table 2 in the web appendix (vignette 44 of 45, in the published order); the ''Simplified (added symptoms)'' column is not copied. The publication gives this vignette''s source as: Epocrates (online.epocrates.com), 2014.'
