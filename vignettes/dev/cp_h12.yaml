atypical: true
notes: 'Atypical and easy to miss: the chest discomfort is mild, she plays it down, and tiredness leads.
  The one clear danger sign is her colour, which she reports second-hand. heart_attack_symptoms.txt lists
  ''your lips or skin are pale, blue or grey'' under ''Call 999'' (and pale, blue or grey skin among heart
  attack symptoms); shortness_of_breath.txt lists it under ''Call 999 or go to A&E''. cp_sudden_not_going_away
  is ''not sure'': she woke with the feeling, so she cannot say whether it came on suddenly, only that
  it has not gone; if it did that would be a second 999 sign, and the outcome does not depend on it. very_tired
  is yes, but tiredness is not a danger sign for chest pain anywhere in the sources (the question comes
  from the sore throat pages) and should not by itself change the outcome. angina_pain_not_settling is
  answered yes because the pain is still there at rest, which is the honest answer to that question as
  worded; the patient has no angina diagnosis. worried_about_symptoms is no: it is her daughter who is
  concerned.'
