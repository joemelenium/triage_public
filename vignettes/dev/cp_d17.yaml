notes: 'The pattern points to a common, minor cause, but an explicit urgent sign is present. The chest_pain.txt
  table gives ''An often sharp, continuous pain triggered by worries or a stressful situation, heartbeat
  gets faster, sweating, dizziness'' as anxiety, depression or a panic attack, and adds ''Do not self-diagnose''.
  heart_attack_symptoms.txt gives ''Call NHS 111'' for chest pain with a heart that is racing, and shortness_of_breath.txt
  lists palpitations under NHS 111. Judgement: advice attached to a stated sign is followed over a possible
  cause in a table, so expected and minimum are urgent; routine ''See a GP'' for pain that comes and goes
  (chest_pain.txt) is judged too low while the racing heart is present. palpitations is yes because her
  heart races with each episode; heart_beating_very_fast is no because it is not fast now (pulmonary_embolism.txt
  puts a very fast heartbeat under 999 or A&E). She is not sweaty, light-headed or sick with it; if she
  were, chest_pain.txt''s 999 line for chest pain with those feelings would apply even though its own
  table lists sweating and dizziness under anxiety, a tension inside that page. cp_on_exertion is no:
  the pain comes with stress but not with effort and does not depend on resting.'
