atypical: false
notes: "Over-triage trap: several features the pages list for tonsillitis (swollen, painful glands, which tonsillitis.txt calls 'more severe'; headache; earache; tiredness), but none of the criteria in the urgent or emergency boxes: no pus-filled spots, able to eat and drink, not hot or shivery. Neither page uses the absence of a cough as a reason to do more. tonsillitis.txt says 'Speak to a pharmacist about tonsillitis'. The pages differ in emphasis on antibiotics: sore_throat.txt says 'A pharmacist can give the same antibiotic treatment as a GP for a sore throat, if you need it', while tonsillitis.txt says that for bacterial tonsillitis 'a GP may prescribe antibiotics' and describes a swab at the GP. Both routes are routine; the pharmacist is used because both pages point there first. She describes glands, not a lump, so lump_in_mouth_or_neck is absent. Headache and earache cannot be expressed with the question list."
