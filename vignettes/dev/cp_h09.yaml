- id: cp_h09_v2
  style: detailed, gives the background and some negatives
  opening_statement: I had a knee operation and came home five days ago. About two hours ago, quite suddenly,
    I got short of breath and a sharp pain came on in my left chest, worse when I breathe in. Neither
    has gone away. My heart is beating very fast. I haven't coughed up any blood and I haven't passed
    out.
  volunteered: [cp_sudden_not_going_away, short_of_breath, cp_worse_breathing_in, heart_beating_very_fast,
