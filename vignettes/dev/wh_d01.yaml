summary: A 27-year-old woman whose period is two weeks late has had sudden, sharp pain low on the right side of
  her tummy for two hours that is getting worse, with pain in the tip of her right shoulder, a little brown bleeding,
  feeling sick and nearly fainting. She has not done a pregnancy test.
