atypical: false
notes: 'Two things the patient genuinely cannot say: whether he passed out (fainted: he was on the floor
  and does not know how he got there) and whether his lips or skin are pale, blue or grey (he is alone
  and has not looked). Both would be emergency signs if present (pulmonary_embolism.txt: ''someone has
  passed out''; heart_attack_symptoms.txt: lips or skin pale, blue or grey), but the outcome is already
  emergency on what he can say, so the unknowns must not delay or lower it. passed_out is no: that question
  is about someone who is not responding now, and he is talking. severe_breathing_difficulty is no because
  he can speak in full sentences. cp_heavy is no: his word for the feeling is tight, and he does not describe
  heaviness. angina_pain_not_settling is answered yes because the pain is still there at rest, which is
  the honest answer to that question as worded; the patient has no angina diagnosis. No question asks
  whether the breathlessness came on suddenly, which is the wording of the 999 sign on pulmonary_embolism.txt.
  For the questions added to the list later: he has high blood pressure (heart_risk_factors yes).'
