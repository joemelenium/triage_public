notes: 'Two presenting symptoms, both low-urgency: over-triage would be the mistake. The sore throat on
  its own is pharmacist advice (sore_throat.txt: ''See a pharmacist if you need help for a sore throat'');
  none of its GP, urgent or emergency signs is present, and worried_about_symptoms is no. The chest pain
  comes and goes with coughing, which chest_pain.txt puts under non-urgent ''See a GP''; the more intensive
  of the two outcomes is recorded. The sources give no self-care or pharmacist route for chest pain (''get
  medical advice just in case''), so routine is also the minimum. Source differences: angina.txt puts
  chest pain that comes and goes under NHS 111, and pulmonary_embolism.txt lists pain in the chest under
  ''Call 999 or go to A&E''; her soreness only on coughing during a cold has no feature of either condition.
  The link between the pain and coughing cannot be expressed with any question on the list. For the questions
  added to the list later: cough_or_runny_nose is yes; she has no coloured mucus, high temperature, swollen
  glands or marked tiredness.'
