- id: eyelid_problem
  label: "Eyelid problem"
  question: "Do you have a problem with your eyelid? For example, a lump, swelling, drooping, or an itchy, sticky or sore eyelid."
  question_carer: "Does your child have a problem with their eyelid? For example, a lump, swelling, or an itchy, sticky or sore eyelid."
  checklist_text: "A problem with an eyelid, such as a lump, swelling or drooping"
