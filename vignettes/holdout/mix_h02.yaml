notes: "Sources differ widely on coughing up blood. coughing_up_blood.txt, bronchitis.txt, lung_cancer.txt and cough.txt give an urgent GP appointment or 111 for small streaks; chest_infection.txt lists blood-stained mucus under non-urgent 'See a GP'; pneumonia.txt, flu.txt and covid_19.txt list coughing up blood under 999 or A&E without grading the amount. The dedicated coughing_up_blood.txt page was followed because it grades by amount and by accompanying symptoms (all absent here). Temperature is unknown."
