id: cp_d06
status: AI-drafted, not clinically approved
authored_by: AI, in a session separate from the knowledge base
presenting: [chest_pain]
summary: 78-year-old woman who for two years has had chest pain when walking uphill that goes when she
  stops for a minute or uses the spray the hospital gave her. Nothing has changed recently. It happened
  this morning and went as usual. She cannot remember the name of her diagnosis; her record shows angina.
opening_statement: I get a pain across my chest when I walk up the hill to the shops. It goes when I stop
  for a minute or use the little spray the hospital gave me. It's been like that for a couple of years
  and it's no different lately. It happened this morning and went like it always does. My granddaughter
  said I ought to check.
findings:
  present: [chest_pain, cp_comes_and_goes, cp_on_exertion]
  absent: [stroke_signs, severe_breathing_difficulty, lips_or_skin_blue_grey, passed_out, sudden_confusion,
    heavy_bleeding, serious_self_harm, cp_present_now, cp_sudden_not_going_away, cp_tight_or_squeezing,
    cp_heavy, cp_spreads, sweating, nausea_or_vomiting, light_headed, short_of_breath, heart_beating_very_fast,
    fainted, palpitations, angina_pain_not_settling, angina_worse_than_usual, coughing_up_blood, cp_worse_breathing_in,
    leg_pain_or_swelling, difficulty_breathing, worried_about_symptoms, cp_after_eating, cp_after_injury_or_exercise,
    cp_with_worry, cough_mucus_or_temperature, heart_risk_factors, family_heart_history, cough_or_runny_nose,
    sore_throat, very_high_temperature, cp_lasted_15_minutes]
  unknown: [has_angina]
context:
  none: {}
