# Entry symptom: feeling anxious or panicky.
# NOT FOR CLINICAL USE. AI-drafted, not clinically reviewed.
#
# Each rule says: WHEN these findings are present, the outcome is at least THIS.
# A rule marked "soft: true" is the exception: the conditions that look likely
# may lower its outcome, if something the patient said points to a milder cause.
# The engine takes the most urgent rule that fires. If none fires, it uses the
# default at the bottom.
#
# Anxiety and panic cause physical symptoms that can also be signs of heart or
# lung problems. Chest pain is asked about first: a "yes" brings in the chest pain
# entry symptom with its own red flags, and the anxiety or panic card there can
# lower its soft rules. Crisis needs use the emergency department or urgent care,
# with advice naming crisis lines (no mental health crisis level of care exists).

id: feeling_anxious
name: "Feeling anxious or panicky"
presenting_finding: feeling_anxious
status: "AI-drafted, not clinically reviewed"

screens:
  - id: feeling_anxious_emergency_screen
    level: emergency
    question: "Do any of these apply right now? Choose all that apply."
    findings:
      - cannot_keep_safe
      - chest_pain
      - fainted
      - taken_overdose

  - id: feeling_anxious_urgent_screen
    level: urgent
    question: "Do any of these apply? Choose all that apply."
    findings:
      - suicidal_thoughts_or_self_harm
      - thoughts_of_harming_others
      - hearing_or_seeing_things
      - believes_things_not_true
      - alcohol_or_drug_stopped_recently

  # Not a red-flag screen: signs that each lead to a GP. Asked as one checklist
  # after the red flags, and only if the outcome so far is lower than this.
  - id: feeling_anxious_gp_checklist
    level: routine
    question: "Do any of these apply? Choose all that apply."
    findings:
      - anxiety_struggling_to_cope
      - anxiety_most_days_6_months
      - panic_attacks_keep_happening
      - trauma_flashbacks
      - low_mood_over_2_weeks

red_flags:
  # ---- Emergency ---------------------------------------------------------
  - id: rf_ax_cannot_keep_safe
    description: "Anxious and cannot keep themselves or someone else safe right now"
    when: cannot_keep_safe
    outcome: {acuity: emergency, level_of_care: emergency_department, timeframe: now, timeframe_detail: "Call 999 or go to A&E now"}
    advice: advice_mh_cannot_keep_safe
    source: nhs_urgent_mental_health

  - id: rf_ax_overdose
    description: "Anxious and has taken an overdose or swallowed something harmful"
    when: taken_overdose
    outcome: {acuity: emergency, level_of_care: emergency_department, timeframe: now, timeframe_detail: "Call 999 for an ambulance or go straight to A&E"}
    advice: advice_mh_overdose_or_injury
    source: nhs_urgent_mental_health

  - id: rf_ax_fainted
    description: "Anxious or panicky and has passed out (fainted)"
    when: fainted
    outcome: {acuity: emergency, level_of_care: emergency_department, timeframe: now, timeframe_detail: "Call 999 or go to A&E now"}
    advice: advice_mh_physical_cause_ae
    source: ai_judgement
    soft: true    # likely conditions may lower this: it is AI judgement
    note: "Clinical knowledge: a panic attack can make you feel faint, but rarely makes you pass out. Passing out can mean a heart rhythm problem or a blood clot in the lung. The Panic disorder page warns that its symptoms can also be signs of other conditions."

  # ---- Urgent --------------------------------------------------------------
  - id: rf_ax_harm_others
    description: "Anxious with thoughts of harming someone else"
    when: thoughts_of_harming_others
    outcome: {acuity: urgent, level_of_care: urgent_care, timeframe: today, timeframe_detail: "Call NHS 111 and choose the mental health option (option 2), or ask your GP surgery for an urgent appointment today"}
    advice: advice_mh_urgent
    source: ai_judgement
    note: "Clinical knowledge. If they feel they cannot keep someone safe, the emergency rule applies."

  - id: rf_ax_believes_untrue
    description: "Anxious and believing things that others say are not true, such as being watched or followed"
    when: believes_things_not_true
    outcome: {acuity: urgent, level_of_care: urgent_care, timeframe: today, timeframe_detail: "Call NHS 111 and choose the mental health option (option 2), or ask your GP surgery for an urgent appointment today"}
    advice: advice_mh_urgent
    source: nhs_psychosis
    note: "The Psychosis page says people with delusions often feel frightened and distressed. Making it urgent is AI judgement."

  - id: rf_ax_withdrawal
    description: "Anxious after stopping or cutting down alcohol, or a drug or medicine they rely on, in the last few days"
    when: alcohol_or_drug_stopped_recently
    outcome: {acuity: urgent, level_of_care: urgent_care, timeframe: today, timeframe_detail: "Ask your GP surgery for an urgent appointment, or call NHS 111, today"}
    advice: advice_withdrawal_urgent
    source: ai_judgement
    soft: true    # likely conditions may lower this: the source pages give a lower urgency
    note: "Source difference: the Alcohol misuse page says see a GP (non-urgent) for withdrawal symptoms such as anxiety, but also that it can be very dangerous to stop drinking suddenly if you are dependent, and to get medical help. Clinical knowledge: fits and severe withdrawal usually start 1 to 3 days after stopping, so same-day advice is used. Soft."

outcome_rules:
  - id: or_ax_struggling
    description: "Struggling to cope with anxiety, fear or panic"
    when: anxiety_struggling_to_cope
    outcome: {acuity: routine, level_of_care: general_practice, timeframe: no_fixed_time, timeframe_detail: "See a GP. The source gives no fixed time."}
    advice: advice_anxiety_gp
    source: nhs_anxiety_fear_panic

  - id: or_ax_gad
    description: "Worried or anxious about lots of things, most days, for 6 months or more (possible generalised anxiety)"
    when: anxiety_most_days_6_months
    outcome: {acuity: routine, level_of_care: general_practice, timeframe: no_fixed_time, timeframe_detail: "See a GP. The source gives no fixed time."}
    advice: advice_anxiety_gp
    source: nhs_gad

  - id: or_ax_panic
    description: "Sudden attacks of panic or fear that keep happening (possible panic disorder)"
    when: panic_attacks_keep_happening
    outcome: {acuity: routine, level_of_care: general_practice, timeframe: no_fixed_time, timeframe_detail: "See a GP. The source gives no fixed time."}
    advice: advice_anxiety_gp
    source: nhs_panic_disorder

  - id: or_ax_ptsd
    description: "Reliving a frightening event in flashbacks or nightmares (possible post-traumatic stress)"
    when: trauma_flashbacks
    outcome: {acuity: routine, level_of_care: general_practice, timeframe: no_fixed_time, timeframe_detail: "See a GP. The source gives no fixed time."}
    advice: advice_anxiety_gp
    source: nhs_ptsd

  - id: or_ax_low_mood
    description: "Anxious, with a low mood for more than 2 weeks"
    when: low_mood_over_2_weeks
    outcome: {acuity: routine, level_of_care: general_practice, timeframe: no_fixed_time, timeframe_detail: "See a GP. The source gives no fixed time."}
    advice: advice_anxiety_gp
    source: nhs_depression

default:
  description: "Feeling anxious, with nothing that needs more help: self-help first"
  outcome: {acuity: self_manageable, level_of_care: self_care, timeframe: not_needed, timeframe_detail: "Anxiety often gets better with self-help. See a GP if you are struggling to cope."}
  advice: advice_anxiety_self_care
  source: nhs_anxiety_fear_panic
  note: "The Anxiety, fear and panic page gives self-help and says to see a GP if you are struggling to cope or self-help is not working. Self-care as the default is a reading of that."
