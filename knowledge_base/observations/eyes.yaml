# Observations: eyes.
# NOT FOR CLINICAL USE. A demonstration and proof of concept only.
#
# An observation is anything the engine can know about a patient: a symptom, a
# feature of a symptom, a risk factor (history, lifestyle, an event) or context
# such as age. Each is answered "yes", "no" or "not sure". Observations are kept
# in one file per body system. All files together form one shared network.
#
# Fields: as in observations/general.yaml.
#

# ---------------------------------------------------------------------------
# Main symptoms (one per eye entry symptom)
# ---------------------------------------------------------------------------
- id: red_eye
  label: "Red or bloodshot eye"
  question: "Is the white of your eye red or bloodshot, in 1 or both eyes?"
  question_carer: "Is the white of your child's eye red or bloodshot, in 1 or both eyes?"
  checklist_text: "Red or bloodshot eye"
  kind: presenting   # the main symptom for the red eye entry symptom
  snomed: "703630003"
  phrases: ["red eye", "bloodshot eye", "pink eye", "my eye has gone red"]
  source: nhs_red_eye

- id: eye_pain
  label: "Eye pain"
  question: "Do you have pain in or around your eye? It may be felt behind, inside or around the eye."
  question_carer: "Does your child have pain in or around their eye?"
  checklist_text: "Pain in or around the eye"
  kind: presenting   # the main symptom for the eye pain entry symptom
  snomed: "41652007"
  phrases: ["my eye hurts", "pain behind my eye", "sore eye", "aching eye"]
  source: nhs_eye_pain

- id: vision_change
  label: "Change in sight or loss of vision"
  question: "Has your sight changed or got worse, in a way that does not clear when you blink? For example, it is blurred, cloudy or wavy, you see flashing lights, or you cannot see part of what you usually see."
  question_carer: "Has your child's sight changed? For example, they cannot see as well, or they squint, cover 1 eye or tilt their head to see."
  checklist_text: "Any change to your sight, like blurring, wavy lines or loss of vision"
  kind: presenting   # the main symptom for the vision loss entry symptom
  snomed: "63102001"
  seriousness: serious
  phrases: ["blurry vision", "can't see properly", "losing my sight", "vision has gone funny"]
  source: nhs_vision_loss

- id: double_vision
  label: "Double vision"
  question: "Do you see 2 of things when you look at 1 object (double vision), even if it comes and goes?"
  question_carer: "Does your child seem to see double? Signs include squinting, closing or covering 1 eye, or tilting their head to see."
  checklist_text: "Double vision"
  kind: presenting   # the main symptom for the double vision entry symptom
  # Not under vision_change on purpose: that would bring in the vision loss entry
  # symptom, whose "double vision is urgent" rule would override the Double vision
  # page's "see a GP" for double vision on its own. Rules elsewhere that mean "any
  # problem with sight" name double_vision as well (headache, vertigo, head injury).
  snomed: "24982008"
  phrases: ["seeing double", "two of everything", "double vision"]
  source: nhs_double_vision

- id: dry_eyes
  label: "Dry eyes"
  question: "Do your eyes feel dry?"
  question_carer: "Does your child say their eyes feel dry?"
  checklist_text: "Dry eyes"
  kind: presenting   # the main symptom for the dry eyes entry symptom
  snomed: "162290004"
  phrases: ["dry eyes", "eyes feel dry", "tired, dry eyes"]
  source: nhs_dry_eyes

- id: watering_eyes
  label: "Watering eyes"
  question: "Do your eyes keep watering?"
