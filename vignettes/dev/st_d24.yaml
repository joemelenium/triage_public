notes: "The course over months is the point. Both pages advise a GP for repeated episodes (tonsillitis.txt 'you keep getting throat infections'; sore_throat.txt 'you often get a sore throat'), and tonsillitis.txt adds that removing the tonsils is 'usually only done if you have severe tonsillitis that keeps coming back'. For this episode alone, a child aged 5 or over who needs help would see a pharmacist; the GP criterion should take priority, and pharmacy or self-care advice alone would fall short. Nothing in this episode meets an urgent or emergency criterion. Neither page says how many sore throats count as often. Headache cannot be expressed with the question list."
