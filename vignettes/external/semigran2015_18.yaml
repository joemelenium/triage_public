conversion_notes: '''Fever to 102.2'' is mapped to very_high_temperature and ''tonsillar exudates'' to pus_on_tonsils. Symptoms ''started 2 days ago'', so sore_throat_over_a_week is absent. ''Otherwise in good health, and is on no medications except for ibuprofen'' is mapped to weakened_immune_system absent. ''Tender anterior cervical lymphadenopathy'' is not mapped to lump_in_mouth_or_neck. The closing bracket about the Centor score is part of the published text (a remark by the study authors, not part of the patient''s story). Rule used for very_high_temperature in this set: present when the text states a fever (not described as low-grade), chills, rigors or feeling hot; left out when the fever is described as low-grade or measured below 38.0 C; absent when fever is explicitly ruled out. Text is from the ''Vignette'' column of Supplemental Table 2 in the web appendix (vignette 18 of 45, in the published order); the ''Simplified (added symptoms)'' column is not copied. The publication gives
  this vignette''s source as: Gidengil CA et al. Using clinical vignettes to predict antibiotic prescribing for acute respiratory infections (listed as ''In review'').'
