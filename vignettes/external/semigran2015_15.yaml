conversion_notes: 'Trismus (''lock jaw'') is mapped to difficulty_opening_mouth. ''Apneic periods'' and ''Apnea results during some of the spasms'' are mapped to difficulty_breathing; severe_breathing_difficulty is left out (gasping, choking or inability to speak are not stated). ''He retains consciousness'' during spasms is mapped to passed_out and fainted absent. ''Dysphagia'' is not mapped to unable_to_swallow (difficulty, not inability). ''Tachycardia'' is not mapped to heart_beating_very_fast. ''Hyperpyrexia'' is described as something that ''may'' appear days later, so very_high_temperature is left out. Much of the published text is a general description of tetanus rather than one patient''s account. The appendix''s simplified version gives the age as 65; the vignette text says 63, which is used here. Rule used for very_high_temperature in this set: present when the text states a fever (not described as low-grade), chills, rigors or feeling hot; left out when the fever is described
  as low-grade or measured below 38.0 C; absent when fever is explicitly ruled out. Text is from the ''Vignette'' column of Supplemental Table 2 in the web appendix (vignette 15 of 45, in the published order); the ''Simplified (added symptoms)'' column is not copied. The publication gives this vignette''s source as: Epocrates (online.epocrates.com), 2014.'
