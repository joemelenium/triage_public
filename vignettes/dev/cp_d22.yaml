atypical: false
notes: 'The pattern is open to two readings and the background decides between them. The chest_pain.txt
  table gives pain ''triggered by worries or a stressful situation'' as anxiety, depression or a panic
  attack, which is the patient''s own explanation. angina.txt says angina attacks are ''often brought
  on by exercise, stress, emotion or cold temperatures'' and ''should stop after resting for a few minutes'';
  his pain also comes with effort, and he has risk factors that chest_pain.txt, heart_attack_symptoms.txt
  and angina.txt all list (smoking, high cholesterol, a close relative with a heart attack under 60).
  Judgement: the angina page is followed. Source difference, and the reason expected and minimum differ:
  chest_pain.txt says non-urgent ''See a GP'' for chest pain that comes and goes; angina.txt says ''Get
  help from NHS 111'' for ''chest pain or other symptoms of angina that come and go'', and also ''it''s
  important to see a GP as soon as possible if you think you may have it''. Expected is the NHS 111 advice;
  the minimum is ''soon'', the reading given to ''as soon as possible''; routine with no fixed time is
  judged too slow. The risk factors support the judgement but no page gives a more urgent instruction
  because of them, so there is no ground for emergency. worried_about_symptoms is no: he thinks it is
  stress and it is his partner who is concerned.'
