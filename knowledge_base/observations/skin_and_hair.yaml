# Observations: skin and hair (rashes, itching, lumps, hair, nails, sweating,
# bites and stings, burns, cuts and wounds, yellow skin).
# NOT FOR CLINICAL USE. A demonstration and proof of concept only.
#
# Shared observations used here that live in other files, and are reused rather
# than repeated:
#   breathing.yaml        raised_itchy_rash (now also the main symptom for hives),
#                         rash_does_not_fade, skin_blotchy, feels_very_unwell,
#                         seriously_unwell_getting_worse, child_floppy_or_hard_to_wake,
#                         breathing_very_fast, child_struggling_to_breathe,
#                         lips_tongue_throat_swelling, throat_tight, after_allergy_trigger,
#                         baby_high_temperature, cold_or_shivery, not_peed_12_hours,
#                         feeding_much_less, had_a_fit, has_allergies, aching_body,
#                         weight_loss, night_sweats, finger_clubbing,
#                         symptoms_worse_or_not_better
#   ear_nose_throat.yaml  very_high_temperature, difficulty_breathing, unable_to_swallow,
#                         dehydration_signs, weakened_immune_system, swollen_neck_glands,
#                         cough_or_runny_nose, worried_about_symptoms, very_tired
#   chest_and_heart.yaml  rash_one_side_of_body, light_headed, sweating, nausea_or_vomiting,
#                         heart_beating_very_fast, fainted, chest_pain, paler_than_usual,
#                         heavy_periods, has_cancer, pregnant_or_recently_given_birth
#   general.yaml          lips_or_skin_blue_grey, passed_out, sudden_confusion,
#                         heavy_bleeding, age bands, sex
#
# Fields: see observations/general.yaml.

