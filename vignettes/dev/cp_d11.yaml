notes: 'Low-urgency case with pain that is present now: over-triage would be the mistake. The chest_pain.txt
  table gives ''Tingling feeling on skin, skin rash appears that turns into blisters'' as shingles, and
  the page says ''Do not self-diagnose'' and to see a GP if worried. The page gives no timeframe for this,
  so routine with no fixed time is recorded. The pain built up gradually from a tingle, so it is not ''sudden
  pain that does not go away'' and cp_sudden_not_going_away is no, even though the engine''s question
  mentions burning. It stays in one patch, so cp_spreads is no. angina_pain_not_settling is answered yes
  because the pain is still there at rest, which is the honest answer to that question as worded; the
  patient has no angina diagnosis. angina.txt''s 999 advice for pain that does not stop applies only to
  people diagnosed with angina. Source difference: pulmonary_embolism.txt lists ''pain in your chest or
  upper back'' under ''Call 999 or go to A&E''; she has no feature of a pulmonary embolism, so chest_pain.txt
  is followed. The rash, blisters and skin tingling cannot be expressed with any question on the list.'
