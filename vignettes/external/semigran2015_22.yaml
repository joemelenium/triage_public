conversion_notes: '''She denies hemoptysis'' is mapped to coughing_up_blood absent. She denies chills, but fever is not mentioned either way, so very_high_temperature is left out. difficulty_breathing is left out (the text says shortness of breath only). Rule used for very_high_temperature in this set: present when the text states a fever (not described as low-grade), chills, rigors or feeling hot; left out when the fever is described as low-grade or measured below 38.0 C; absent when fever is explicitly ruled out. Text is from the ''Vignette'' column of Supplemental Table 2 in the web appendix (vignette 22 of 45, in the published order); the ''Simplified (added symptoms)'' column is not copied. The publication gives this vignette''s source as: Epocrates (online.epocrates.com), 2014.'
