conversion_notes: '''Fevers as high as 101 for 2 days, but those have now resolved'', with normal vital signs, is mapped to very_high_temperature absent (no fever now). ''Otherwise healthy except for high cholesterol'' is mapped to weakened_immune_system absent. Rule used for very_high_temperature in this set: present when the text states a fever (not described as low-grade), chills, rigors or feeling hot; left out when the fever is described as low-grade or measured below 38.0 C; absent when fever is explicitly ruled out. Text is from the ''Vignette'' column of Supplemental Table 2 in the web appendix (vignette 32 of 45, in the published order); the ''Simplified (added symptoms)'' column is not copied. The publication gives this vignette''s source as: Gidengil CA et al. Using clinical vignettes to predict antibiotic prescribing for acute respiratory infections (listed as ''In review'').'
