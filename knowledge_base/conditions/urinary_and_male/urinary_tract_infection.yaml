# Merged with the stomach_and_bowel card for this condition. Its notes: A pharmacist can
# treat most UTIs in women aged 16 to 64. The rules send children, men, older people and
# those with a high temperature for urgent help. Merged with the urinary_and_male card
# for this condition. Its notes: A bladder infection (cystitis) or infection of the tube
# that carries pee out of the body. The UTI page sends women aged 16 to 64 who are not pregnant to a pharmacist,
# and everyone else (men, children, people 65 or over, pregnant) for an urgent GP
# appointment or 111. The entry-symptom rules give the urgent cases; the card itself
# needs a pharmacist. Danger moderate: it can spread to the kidneys. What tells it apart
# from a kidney infection: no high temperature or pain in the side. From an STI: no
# discharge. From an overactive bladder: pain, cloudy pee, and it started in the last
# few days.
