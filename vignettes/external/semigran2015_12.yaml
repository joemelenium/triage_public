conversion_notes: 'The main complaints are shortness of breath and chest pain, so chest_pain is listed as presenting. ''He is complaining of left-sided chest pain'' is taken as pain present now. ''He felt faint but did not lose consciousness'' is mapped to light_headed present (stated for the start of the episode) and to fainted and passed_out absent. ''Swelling in his left calf, which is tender'' is mapped to leg_pain_or_swelling. ''Fever of 100.4 F (38.0 C)'' is mapped to very_high_temperature (stated as fever, though only at 38 C). ''No history of cardiopulmonary disease'' is mapped to has_angina absent. Heart rate 112 bpm is an examination value and is not mapped to heart_beating_very_fast. The onset of the chest pain itself is not described, so cp_sudden_not_going_away is left out. Rule used for very_high_temperature in this set: present when the text states a fever (not described as low-grade), chills, rigors or feeling hot; left out when the fever is described as low-grade or measured
  below 38.0 C; absent when fever is explicitly ruled out. Text is from the ''Vignette'' column of Supplemental Table 2 in the web appendix (vignette 12 of 45, in the published order); the ''Simplified (added symptoms)'' column is not copied. The publication gives this vignette''s source as: Epocrates (online.epocrates.com), 2014.'
