conversion_notes: 'Temperature of 104 F (40 C) is mapped to very_high_temperature. Abdominal pain and diarrhoea have no matching question. The pain is ''sudden-onset'' and ''severe'' but the text does not say it is getting worse, so severe_and_worsening_quickly is left out. Rule used for very_high_temperature in this set: present when the text states a fever (not described as low-grade), chills, rigors or feeling hot; left out when the fever is described as low-grade or measured below 38.0 C; absent when fever is explicitly ruled out. Text is from the ''Vignette'' column of Supplemental Table 2 in the web appendix (vignette 2 of 45, in the published order); the ''Simplified (added symptoms)'' column is not copied. The publication gives this vignette''s source as: Epocrates (online.epocrates.com), 2014.'
