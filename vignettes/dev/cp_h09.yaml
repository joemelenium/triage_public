id: cp_h09
status: AI-drafted, not clinically approved
authored_by: AI, in a session separate from the knowledge base
presenting: [chest_pain]
summary: 41-year-old man who came home from hospital five days ago after a knee operation. This afternoon
  he suddenly became short of breath, with a sharp pain in the left side of his chest when he breathes
  in and a very fast heartbeat. It has not eased. His operated leg is swollen and he cannot tell whether
  that is anything new.
opening_statement: I came out of hospital five days ago after an operation on my knee. This afternoon
  I suddenly couldn't get my breath properly, and I've got a sharp pain in the left side of my chest when
  I breathe in. My heart is going really fast. It's not settling down.
