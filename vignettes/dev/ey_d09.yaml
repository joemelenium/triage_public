notes: "Likely cataracts (vision_loss.txt: 'Blurred or cloudy vision, seeing a glowing ring (halo) around lights, colours looking less bright'). The source advises an optician, which is not on the level-of-care scale; general_practice is the nearest non-urgent level. Halos here are a look-alike for acute glaucoma, but there is no pain, redness, headache or sickness."
