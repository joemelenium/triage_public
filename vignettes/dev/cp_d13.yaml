atypical: false
notes: 'Source difference, and the reason expected and minimum safe acuity differ. For chest pain that
  comes and goes: chest_pain.txt says non-urgent ''See a GP''; angina.txt says ''Urgent advice: Get help
  from NHS 111'' for ''chest pain or other symptoms of angina that come and go''; and the opening of angina.txt
  says ''it''s important to see a GP as soon as possible if you think you may have it''. Judgement: his
  story matches the angina page''s own description (brought on by exercise, stops after resting for a
  few minutes) and he thinks he may have angina, so the angina page is followed rather than the general
  page. Expected is its NHS 111 advice; the minimum safe acuity is ''soon'', the reading given to ''see
  a GP as soon as possible''; routine with no fixed time is judged too slow. The red flag lists cp_on_exertion,
  a question added after this case was first written, together with cp_comes_and_goes; before that the
  effort pattern could not be expressed. For the other questions added later: he smokes (heart_risk_factors
  yes), and his brother''s angina was diagnosed in his fifties (family_heart_history yes). He describes
  a dull ache, so cp_tight_or_squeezing is no. Had he called it tight, heart_attack_symptoms.txt''s 999
  advice for chest pain that ''feels tight'' would also come into play, even though angina.txt describes
  angina itself as ''tightness''.'
