id: cp_d04
status: AI-drafted, not clinically approved
authored_by: AI, in a session separate from the knowledge base
presenting: [chest_pain]
summary: 29-year-old woman with a sharp pain on the right side of her chest every time she breathes in,
  building up since this morning. She returned from a long-haul flight three days ago and has had a sore,
  swollen calf since. She thinks she pulled a muscle carrying her suitcase.
opening_statement: I've got a sharp pain on the right side of my chest that catches every time I breathe
  in. It's been building up since this morning. I think I pulled something lugging my suitcase about,
  I got back from a long flight three days ago.
findings:
  present: [chest_pain, cp_present_now, cp_worse_breathing_in, leg_pain_or_swelling, angina_pain_not_settling]
  absent: [stroke_signs, severe_breathing_difficulty, lips_or_skin_blue_grey, passed_out, sudden_confusion,
