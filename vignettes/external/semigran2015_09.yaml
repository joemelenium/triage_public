conversion_notes: 'Fever with chills and rigors (100.4 F / 38 C on examination) is mapped to very_high_temperature. Nausea is mentioned only as a past side effect of malaria prophylaxis, so nausea_or_vomiting is left out. ''Mildly tachycardic'' on examination is not mapped to heart_beating_very_fast. Rule used for very_high_temperature in this set: present when the text states a fever (not described as low-grade), chills, rigors or feeling hot; left out when the fever is described as low-grade or measured below 38.0 C; absent when fever is explicitly ruled out. Text is from the ''Vignette'' column of Supplemental Table 2 in the web appendix (vignette 9 of 45, in the published order); the ''Simplified (added symptoms)'' column is not copied. The publication gives this vignette''s source as: Epocrates (online.epocrates.com), 2014.'
