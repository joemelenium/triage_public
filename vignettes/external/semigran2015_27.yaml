conversion_notes: '''Low-grade fever'' with a temperature of 100.1 F (37.8 C) is not mapped to very_high_temperature: left out rather than marked absent. ''Mildly tachycardic (heart rate 105 bpm)'' is not mapped to heart_beating_very_fast. He ''is able to take oral fluids''; signs of dehydration are not described either way, so dehydration_signs is left out. The stools are ''nonbloody''. Rule used for very_high_temperature in this set: present when the text states a fever (not described as low-grade), chills, rigors or feeling hot; left out when the fever is described as low-grade or measured below 38.0 C; absent when fever is explicitly ruled out. Text is from the ''Vignette'' column of Supplemental Table 2 in the web appendix (vignette 27 of 45, in the published order); the ''Simplified (added symptoms)'' column is not copied. The publication gives this vignette''s source as: Epocrates (online.epocrates.com), 2014.'
