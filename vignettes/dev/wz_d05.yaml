notes: "Context test. Without the record this looks like a mild chest infection in an adult, which chest_infection.txt treats as self-care. With COPD known, this is a flare-up (copd.txt: 'You may have times when your symptoms get worse. These are known as COPD flare-ups.'). copd.txt's urgent advice is specifically 'more short of breath than usual', which he denies. SOURCE DIFFERENCE for chest infections with a long-term lung condition: bronchitis.txt gives 'Urgent advice', chest_infection.txt gives 'Non-urgent advice: See a GP'. Judgement: expected urgent, minimum safe routine. copd_flare_up is present (more phlegm than usual) but is only asked if has_copd is yes."
