conversion_notes: 'A fever that ''continues to be elevated'', with a temperature of 101.6 F (38.7 C), is mapped to very_high_temperature. ''He appears in no respiratory distress'' is mapped to severe_breathing_difficulty absent; difficulty_breathing and short_of_breath are left out because the text does not address them in those words. Mild persistent asthma is not mapped to weakened_immune_system. The history is given by the mother. Rule used for very_high_temperature in this set: present when the text states a fever (not described as low-grade), chills, rigors or feeling hot; left out when the fever is described as low-grade or measured below 38.0 C; absent when fever is explicitly ruled out. Text is from the ''Vignette'' column of Supplemental Table 2 in the web appendix (vignette 26 of 45, in the published order); the ''Simplified (added symptoms)'' column is not copied. The publication gives this vignette''s source as: Epocrates (online.epocrates.com), 2014.'
