# Must not be missed. Level soon: a GP should refer to a breast clinic quickly.
# Breast pain on its own is rarely cancer, so a "no" to a lump lowers it. Less
# common signs (a change in shape, a lump in the armpit) are asked about but not
# linked, so a "no" to them does not count against it too much.
acuity_needed: soon
danger: serious
prevalence: uncommon
