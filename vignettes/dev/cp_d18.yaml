summary: 62-year-old man who smokes and takes tablets for high blood pressure. He spent Saturday lifting
  furniture; since Sunday the right side of his chest has been sore when he twists, reaches up or presses
  on it, and fine when he sits still. Walking and stairs do not bring it on. His wife wants him to check
  because of his risk factors.
opening_statement: I helped my daughter move house on Saturday, lots of lifting. Since Sunday the right
  side of my chest has been sore. It hurts when I twist or reach up or press on it, and it's fine when
  I sit still. Walking and stairs don't bring it on. I smoke and I'm on tablets for blood pressure, so
  my wife wants me to check.
