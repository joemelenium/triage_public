id: cp_h19
status: "AI-drafted, not clinically approved"
authored_by: "AI, in a session separate from the knowledge base"

presenting: [chest_pain]

summary: "A 79-year-old woman with type 2 diabetes has had a burning discomfort in the middle of her chest for about an hour that she thinks is indigestion. She feels sick, clammy, breathless and very tired. No crushing pain and nothing going into her arm or jaw. An indigestion remedy has not helped."

opening_statement: "I've had this indigestion for about an hour and it just won't shift. I feel a bit sick and washed out. I don't want to make a fuss."

findings:
  present: [chest_pain, cp_sudden_not_going_away, cp_present_now, heartburn_or_sour_taste, nausea_or_vomiting, sweating, short_of_breath, very_tired, heart_risk_factors, long_term_condition, cp_lasted_15_minutes]
  absent: [cp_spreads, cp_tight_or_squeezing, cp_heavy, cp_after_eating, cp_worse_breathing_in, cp_tender_to_press, cp_sharp_or_stabbing, cp_after_injury_or_exercise, cp_with_worry, cp_comes_and_goes, cp_tearing_to_back, upper_back_pain, cough, cough_mucus_or_temperature, fainted, passed_out, palpitations, leg_pain_or_swelling, coughing_up_blood, has_angina, known_heart_condition, severe_breathing_difficulty, lips_or_skin_blue_grey, sudden_confusion, rash_one_side_of_body, light_headed, has_heart_failure]
  unknown: [family_heart_history]

context:
  none: {}
  basic: {age: 79, sex: female}
  full:
    age: 79
    sex: female
    findings: {heart_risk_factors: "yes", long_term_condition: "yes"}

expected:
  acuity: emergency
  level_of_care: emergency_ambulance
  timeframe: now

minimum_safe_acuity: emergency

red_flags:
  - description: "Sudden chest discomfort that does not go away, felt as burning or indigestion"
    findings: [cp_sudden_not_going_away]
    minimum_acuity: emergency
    source: {page: chest_pain.txt, quote: "the pain can feel like squeezing or pressure inside your chest, burning or indigestion"}
  - description: "Chest discomfort with feeling sick, sweaty and short of breath"
    findings: [nausea_or_vomiting, sweating, short_of_breath]
    minimum_acuity: emergency
    source: {page: chest_pain.txt, quote: "you have chest pain and you feel sweaty, sick, light headed or short of breath"}
  - description: "Heart attack felt as indigestion"
    findings: [heartburn_or_sour_taste]
    minimum_acuity: emergency
    source: {page: heart_attack_symptoms.txt, quote: "you may have a burning feeling in your chest and feel full or bloated"}

safety_netting_should_cover:
  - point: "Call 999 now"
    any_of: ["999"]
  - point: "Do not drive to hospital"
    any_of: ["do not drive", "don't drive"]

source:
  expected_outcome: {page: chest_pain.txt, quote: "you have chest pain and you feel sweaty, sick, light headed or short of breath"}
  minimum_safe_acuity: {page: chest_pain.txt, quote: "You could be having a heart attack. Call 999 straight away"}

variants:
  - id: cp_h19_v1
    style: "daughter calling on her behalf, worried"
    opening_statement: "My mum's 79 and she says it's just indigestion but she's gone grey and clammy and she's puffing. She's had it about an hour."
    volunteered: [chest_pain, sweating, short_of_breath]
  - id: cp_h19_v2
    style: "very understated, keeps apologising"
    opening_statement: "Sorry to bother you, love. It's only heartburn, I think. Just a bit of burning in the middle."
    volunteered: [heartburn_or_sour_taste]

atypical: true
notes: "Atypical heart attack in an older woman: no crushing pain and no spread, presented as indigestion. heartburn_or_sour_taste is present as a deliberate trap; the onset was not after eating (cp_after_eating absent). heart_attack_symptoms.txt also puts chest pain with feeling sick at 111 (urgent), but chest_pain.txt and angina.txt put chest pain with feeling sick, sweaty or short of breath at 999, and the combination here is stronger, so emergency is expected."
