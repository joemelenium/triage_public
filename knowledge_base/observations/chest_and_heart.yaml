  question: "Is the rash or painful patch on or near your eye or nose? Or have you noticed any changes to your vision?"
  checklist_text: "A rash on or near your eye or nose, or changes to your vision"
  kind: symptom
  asked_only_if: rash_one_side_of_body
  seriousness: serious
  phrases: ["rash by my eye", "blisters on my nose", "my eye is red and sore", "blurry vision with the rash"]
  source: nhs_shingles

- id: family_sudden_death
  label: "Family member died suddenly under 40, or has an inherited heart condition"
  question: "Has anyone in your family died suddenly when they were under 40? Or been told they have a heart problem that runs in the family?"
  question_carer: "Has anyone in the person's family died suddenly when they were under 40? Or been told they have a heart problem that runs in the family?"
  kind: history
  phrases: ["my uncle died suddenly at 30", "heart condition runs in the family"]
  source: ai_judgement
