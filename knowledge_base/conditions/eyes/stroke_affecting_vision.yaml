# says call 999 even if the signs go away.
entry_symptoms: [vision_change, double_vision]
name: "Stroke or mini-stroke (TIA) affecting the sight"
medical_name: "Stroke or transient ischaemic attack with visual symptoms"
acuity_needed: emergency
