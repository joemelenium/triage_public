notes: 'The pattern points to a common, minor cause in someone whose background raises concern: over-triage
  on the background alone would be the mistake. The chest_pain.txt table gives pain that ''Starts after
  chest injury or chest exercise ... feels better when resting the muscle'' as a chest sprain or strain,
  adds ''Do not self-diagnose'', and puts chest pain that comes and goes under non-urgent ''See a GP''.
  The same page says people who smoke or have high blood pressure are more likely to have heart problems,
  but no page gives different advice because of a risk factor, so the outcome stays routine. The sources
  give no self-care route for a chest strain, so routine is also the minimum. Source differences: angina.txt
  puts chest pain that comes and goes under NHS 111 and pulmonary_embolism.txt lists pain in the chest
  under ''Call 999 or go to A&E''; his pain is brought on by particular movements and pressure, not by
  effort, and is not worse on breathing in, so it has no feature of either. cp_on_exertion is no for that
  reason (walking and stairs do not bring it on). worried_about_symptoms is no: his wife is the one asking.'
