notes: 'Straightforward case with several 999 signs together. cp_heavy is no: he describes the pain as
  crushing and squeezing, which cp_tight_or_squeezing covers, and does not describe heaviness. angina_pain_not_settling
  is answered yes because the pain is still there at rest, which is the honest answer to that question
  as worded; the patient has no angina diagnosis. heart_attack_symptoms.txt lists chest pain with feeling
  sick under NHS 111, but the other signs here are under 999 on all three heart pages. For the questions
  added to the list later: he smokes (heart_risk_factors yes); the pain has not eased with rest, so cp_on_exertion
  is no.'
