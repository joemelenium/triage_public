presenting: [sore_throat]

summary: "A 45-year-old woman with three days of sore throat, tender swollen glands on both sides of her neck, a headache, earache and marked tiredness, and no cough or runny nose. Swallowing is uncomfortable but she is eating and drinking. She looked with a torch: her tonsils are red and swollen with no spots or patches. She does not feel hot, cold or shivery and is not worried. She asks whether she needs antibiotics."

opening_statement: "I think I've got tonsillitis. Three days of sore throat, my glands are up and tender, I've got earache and a headache and I'm wiped out. No cough or cold with it. Do I need antibiotics?"

