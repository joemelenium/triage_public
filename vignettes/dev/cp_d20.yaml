notes: 'The pattern points to a common cause named on the chest pain page. The chest_pain.txt table gives
  pain that ''Gets worse when you breathe in, coughing up yellow or green mucus, high temperature'' as
  chest infection, pneumonia or pleurisy, and the page''s advice is ''Do not self-diagnose'' and to see
  a GP if worried. It gives no timeframe, so routine with no fixed time is recorded as both expected and
  minimum. Source differences: pulmonary_embolism.txt lists ''chest pain that''s worse when you breathe
  in'' as a symptom of pulmonary embolism, says anyone with such symptoms needs urgent medical help, and
  puts ''pain in your chest or upper back'' under ''Call 999 or go to A&E''; angina.txt puts chest pain
  that comes and goes under NHS 111. Judgement: the green mucus and temperature are named for chest infection
  and not for pulmonary embolism, and she has no difficulty breathing, no blood and no leg symptoms, so
  chest_pain.txt is followed. This is the most arguable outcome in the set: a reviewer who weighs the
  pulmonary embolism page more heavily, or who thinks a feverish illness with pain on breathing deserves
  same-day review, could reasonably expect urgent, and an urgent answer should be read as cautious rather
  than wrong. The sources contain no page on chest infection itself.'
