atypical: false
notes: "Age boundary: at 5 the page sends her to a pharmacist ('Non-urgent advice: See a pharmacist if'); under 5 it would be a GP. Feeling sick is an ordinary symptom on tonsillitis.txt ('feeling and being sick'). It is a reason to contact 111 only on shortness_of_breath.txt, for someone who is short of breath, and a reason to call 999 only together with chest pain. Neither applies, so it should not raise the outcome."
