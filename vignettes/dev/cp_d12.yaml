id: cp_d12
status: AI-drafted, not clinically approved
authored_by: AI, in a session separate from the knowledge base
presenting: [chest_pain]
summary: 80-year-old man who lives alone. A tight feeling in his chest came on suddenly an hour ago and
  is still there, and he is short of breath sitting still. He then found himself on the kitchen floor
  and does not know whether he tripped or blacked out. He has not seen his own colour.
opening_statement: About an hour ago I suddenly got a tight feeling in my chest while I was making tea,
  and it's still there. I'm puffed just sitting here. Next thing I knew I was on the kitchen floor, and
  I don't know if I tripped or blacked out.
