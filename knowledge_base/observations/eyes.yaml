  checklist_text: "Watering eyes"
  kind: presenting   # the main symptom for the watering eyes entry symptom
  phrases: ["watery eyes", "eyes keep streaming", "tears running down my face"]
  source: nhs_watering_eyes

- id: floaters_or_flashes
  label: "Floaters or flashes in the eyes"
  question: "Are you seeing floaters or flashes? Floaters are small dark dots, lines, rings or cobwebs that drift across your sight. Flashes are sudden flashes of light."
  checklist_text: "Floaters (dark dots or lines) or flashes of light in your sight"
  kind: presenting   # the main symptom for the floaters and flashes entry symptom
  phrases: ["floaters", "flashing lights in my eye", "cobwebs in my vision", "black dots"]
