id: cp_h14
status: AI-drafted, not clinically approved
authored_by: AI, in a session separate from the knowledge base
presenting: [chest_pain]
summary: 62-year-old woman with high blood pressure. An ache built up gradually in her chest during a
  heated argument twenty minutes ago and is still there although she has sat quietly since. It is mild
  and she puts it down to being upset. She had a heart scan two years ago and takes tablets but does not
  recall being told she has angina; her record shows angina.
opening_statement: I had a blazing row with my son about twenty minutes ago and an ache came on in my
  chest while we were shouting. It built up gradually. I've been sitting quietly since and it's still
  there. It's not severe. I expect it's just the upset.
