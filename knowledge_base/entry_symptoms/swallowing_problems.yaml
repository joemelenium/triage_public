# Entry symptom: swallowing problems (dysphagia).
# NOT FOR CLINICAL USE. AI-drafted, not clinically reviewed.
#
# Each rule says: WHEN these findings are present, the outcome is at least THIS.
# A rule marked "soft: true" may be lowered by the conditions that look likely.
# The engine takes the most urgent rule that fires. If none fires, it uses the
# default at the bottom.
#
# Sources: the NHS Dysphagia (swallowing problems) page, which says everyone
# with difficulty swallowing should get an urgent GP appointment or help from
# 111, with the Sore throat, Glandular fever, Anaphylaxis and Dental abscess
# pages, and clinical knowledge where marked ai_judgement.

id: swallowing_problems
name: "Swallowing problems"
presenting_finding: difficulty_swallowing
status: "AI-drafted, not clinically reviewed"

screens:
  - id: swallowing_emergency_screen
    level: emergency
    question: "Do any of these apply right now? Choose all that apply."
    findings:
      - unable_to_swallow
      - drooling
      - stridor
      - difficulty_breathing
      - lips_tongue_throat_swelling
      - swallowed_battery_magnet_or_sharp
      - swelling_in_neck_or_under_tongue

red_flags:
  # ---- Emergency ---------------------------------------------------------
  - id: rf_sw_allergic_swelling
    description: "Lips, mouth, tongue or throat suddenly swollen"
    when: lips_tongue_throat_swelling
    outcome: {acuity: emergency, level_of_care: emergency_ambulance, timeframe: now, timeframe_detail: "Call 999"}
    advice: advice_anaphylaxis_999
    source: nhs_anaphylaxis

  - id: rf_sw_cannot_swallow
    description: "Cannot swallow at all, even your own spit"
    when: unable_to_swallow
    outcome: {acuity: emergency, level_of_care: emergency_department, timeframe: now, timeframe_detail: "Call 999 or go to A&E now"}
    advice: advice_swallowing_ae
    source: nhs_glandular_fever
    note: "The Glandular fever page says call 999 if you cannot swallow, including your own spit. The Sore throat page says call 999 or go to A&E. Food stuck in the food pipe needs removing in hospital."

  - id: rf_sw_stridor
    description: "Problems swallowing with a high-pitched sound when breathing"
    when: stridor
    outcome: {acuity: emergency, level_of_care: emergency_department, timeframe: now, timeframe_detail: "Call 999 or go to A&E now"}
    advice: advice_swallowing_ae
    source: nhs_sore_throat

  - id: rf_sw_battery_or_sharp
    description: "Swallowed a button battery, a magnet, or something sharp"
    when: swallowed_battery_magnet_or_sharp
    outcome: {acuity: emergency, level_of_care: emergency_department, timeframe: now, timeframe_detail: "Go to A&E now, or call 999"}
    advice: advice_swallowing_ae
    source: ai_judgement
    note: "Clinical knowledge: a swallowed button battery can burn through the food pipe within hours, and magnets and sharp objects can cause serious damage. They need checking in hospital straight away."

  - id: rf_sw_neck_swelling
    description: "Swelling in the neck or under the tongue, or a lot of swelling in the mouth"
    when: swelling_in_neck_or_under_tongue
    outcome: {acuity: emergency, level_of_care: emergency_department, timeframe: now, timeframe_detail: "Call 999 or go to A&E now"}
    advice: advice_mouth_throat_ae
    source: nhs_dental_abscess

  - id: rf_sw_drooling
    description: "Problems swallowing with drooling"
    when: drooling
    outcome: {acuity: emergency, level_of_care: emergency_department, timeframe: now, timeframe_detail: "Call 999 or go to A&E now"}
    advice: advice_swallowing_ae
    source: nhs_sore_throat
    soft: true    # likely conditions may lower this: the source pages disagree on its urgency
    note: "The Sore throat page says call 999 or go to A&E for drooling. The Dysphagia page lists drooling as a sign of long-term swallowing problems, which need an urgent GP appointment. Marked soft, so that a likely long-term cause, such as a past stroke, can lower it to urgent."

  - id: rf_sw_breathing
    description: "Problems swallowing with difficulty breathing"
    when: difficulty_breathing
    outcome: {acuity: emergency, level_of_care: emergency_department, timeframe: now, timeframe_detail: "Call 999 or go to A&E now"}
    advice: advice_swallowing_ae
    source: nhs_sore_throat
    soft: true    # likely conditions may lower this: the source pages disagree on its urgency
    note: "The Sore throat page says call 999 or go to A&E for difficulty breathing. The Dysphagia page says an urgent GP appointment or 111 for being short of breath after eating or drinking, and the Laryngeal cancer page says contact 111 for difficulty breathing. The more urgent is used, marked soft."

default:
  description: "Problems swallowing: get checked today"
  outcome: {acuity: urgent, level_of_care: urgent_care, timeframe: today, timeframe_detail: "Ask for an urgent GP appointment or get help from NHS 111"}
  advice: advice_swallowing_urgent
  source: nhs_swallowing_problems_dysphagia
  # A floor: the Dysphagia page says ask for an urgent GP appointment or get help
  # from 111 for anyone with difficulty swallowing.
  floor: true
