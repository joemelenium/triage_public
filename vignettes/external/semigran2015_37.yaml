conversion_notes: '''No drooling'' and ''no stridor'' are mapped to absent. ''A swollen tender upper lip but no tongue swelling'': swelling_in_mouth_and_throat is left out, because the lip swelling is not inside the mouth and the throat is not mentioned specifically. ''No other complaints'' is a general statement and was not used to mark other questions absent. Text is from the ''Vignette'' column of Supplemental Table 2 in the web appendix (vignette 37 of 45, in the published order); the ''Simplified (added symptoms)'' column is not copied. The publication gives this vignette''s source as: Epocrates (online.epocrates.com), 2014.'
