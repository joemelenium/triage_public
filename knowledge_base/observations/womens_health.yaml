# Observations: women's health (periods, pelvic pain, the vagina, breasts and pregnancy).
# NOT FOR CLINICAL USE. A demonstration and proof of concept only.
#
# Same fields as observations/general.yaml. Observations that only apply to
# women carry "sex: female", so they are never asked of a man. Breast lumps,
# breast pain, nipple discharge and pelvic pain can affect anyone, so those main
# symptoms carry no sex.
#

# ===========================================================================
# Main symptoms (one per entry symptom)
# ===========================================================================
- id: pelvic_pain
  label: "Pelvic pain (pain low down in the tummy)"
  question: "Do you have pain low down in your tummy, between your hips (your pelvis)?"
  question_carer: "Do they have pain low down in their tummy, between their hips (the pelvis)?"
  checklist_text: "Pain low down in your tummy, between your hips"
  kind: presenting
  phrases: ["pelvic pain", "pain low down in my tummy", "lower tummy pain", "pain in my pelvis"]
  source: nhs_pelvic_pain

- id: period_pain
  label: "Period pain"
  snomed: "266599000"
  question: "Do you have pain or cramps in your tummy just before or during your period?"
  checklist_text: "Pain or cramps just before or during your period"
  kind: presenting
  sex: female
  phrases: ["period pain", "period cramps", "painful periods"]
  source: nhs_period_pain

- id: ovulation_pain
