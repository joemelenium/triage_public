notes: "Ordinary cold-type sore throat in someone who wants help: 'Non-urgent advice: See a pharmacist if: you need help for a sore throat'. Coughing and feeling tired are ordinary symptoms on tonsillitis.txt, and sore_throat.txt lists 'a mild cough'. Five days is inside the week both pages allow. shortness_of_breath.txt advises a GP for a cough of 3 weeks or more, which does not apply. Tiredness should not raise the outcome."
