notes: "Probable pleurisy after a cold. pleurisy.txt: 'Urgent advice: Ask for an urgent GP appointment or get help from NHS 111 if' sharp chest pain 'only happens when breathing or coughing'; bronchitis.txt and pneumonia.txt agree (urgent for chest pain when breathing or coughing). SOURCE DIFFERENCE: pulmonary_embolism.txt gives 999 for 'you feel pain in your chest or upper back' and lists 'chest pain that's worse when you breathe in' as a PE symptom; lung_cancer.txt also gives 999 for chest pain. Judgement: urgent, because onset was gradual over a day after a cold, he has no sudden breathlessness, no leg swelling, no blood, no fast heartbeat and no clot risk factors, and pleurisy.txt is the page written for this exact pain. An engine giving emergency is over-cautious but would not be unsafe. This is a hard case and reviewers may disagree."
