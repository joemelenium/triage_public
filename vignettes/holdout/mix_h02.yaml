summary: "A 38-year-old man had a cold two weeks ago that turned into a chesty cough with yellow phlegm. This morning he noticed a few streaks of blood in his phlegm. He is not short of breath, has no chest pain and his heart is not racing. He felt a bit hot and cold last night but did not take his temperature."

opening_statement: "I've had a chesty cough for a week or so and this morning there were little streaks of blood in what I coughed up. It gave me a fright."

