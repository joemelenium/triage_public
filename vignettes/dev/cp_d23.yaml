notes: The pattern points to a minor cause but two emergency signs are present, so the pattern must not
  lower the outcome. The chest_pain.txt table links pain after eating with heartburn or indigestion, and
  the story is told as his usual heartburn. But chest_pain.txt says 'Call 999' for pain that spreads to
  the back (angina.txt adds the shoulder) and for chest pain with feeling light headed, and heart_attack_symptoms.txt
  lists an indigestion-like burning and feeling full or bloated among heart attack symptoms. Marked atypical
  for that reason. The burning built up gradually after the meal, so cp_sudden_not_going_away is no and
  the outcome rests on the spread and the light-headedness. angina_pain_not_settling is answered yes because
  the pain is still there at rest, which is the honest answer to that question as worded; the patient
  has no angina diagnosis. He has none of the listed risk factors.
