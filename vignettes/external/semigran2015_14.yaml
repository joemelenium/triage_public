conversion_notes: 'Right-sided weakness, slurred speech, aphasia and right arm paralysis are mapped to stroke_signs; ''difficulty speaking'' to difficulty_speaking. ''Started with only mild slurred speech before progressing over several minutes to severe aphasia and right arm paralysis'' is mapped to severe_and_worsening_quickly. Difficulty comprehending language is not mapped to sudden_confusion. Atrial fibrillation is past history and is not mapped to palpitations. The symptoms are reported by a family member. Text is from the ''Vignette'' column of Supplemental Table 2 in the web appendix (vignette 14 of 45, in the published order); the ''Simplified (added symptoms)'' column is not copied. The publication gives this vignette''s source as: Epocrates (online.epocrates.com), 2014.'
