id: eye_nerve_palsy
body_system: eyes
# A nerve to the eye muscles stops working for a while, usually from poor blood
# supply with diabetes or high blood pressure. Usually gets better over months,
# but needs checking the same day to rule out a more serious cause.
entry_symptoms: [double_vision, eyelid_problem]
name: "A weak nerve to the eye muscles, often linked to diabetes or high blood pressure"
medical_name: "Cranial nerve palsy (third, fourth or sixth nerve)"
