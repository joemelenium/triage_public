conversion_notes: '''He has been afebrile'' is mapped to very_high_temperature absent; the published text is inconsistent here, as it later says he takes acetaminophen ''for his sore throat and fever''. Symptoms ''started 2 days ago'', so sore_throat_over_a_week is absent. ''His physical examination is normal, except for some pharyngeal erythema'' is mapped to pus_on_tonsils absent; other examination-based questions (lump, swelling, stridor, drooling) were not inferred from that general statement. ''Otherwise in good health, and is on no medications except for acetaminophen'' is mapped to weakened_immune_system absent. Rule used for very_high_temperature in this set: present when the text states a fever (not described as low-grade), chills, rigors or feeling hot; left out when the fever is described as low-grade or measured below 38.0 C; absent when fever is explicitly ruled out. Text is from the ''Vignette'' column of Supplemental Table 2 in the web appendix (vignette 34 of 45, in the published
  order); the ''Simplified (added symptoms)'' column is not copied. The publication gives this vignette''s source as: Gidengil CA et al. Using clinical vignettes to predict antibiotic prescribing for acute respiratory infections (listed as ''In review'').'
