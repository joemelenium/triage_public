notes: "The course is the point: tonsillitis.txt says symptoms 'usually go away after 3 to 4 days', and his are getting steadily worse at day four. The only criterion met is on tonsillitis.txt: 'Get help from NHS 111 now if: you have a sore throat so painful it's difficult to eat or drink'. sore_throat.txt has no equivalent line; on that page alone he would see a pharmacist. tonsillitis.txt is followed because it names the situation. He can swallow and the worsening has been gradual over days, so 'unable to swallow' and 'severe and getting worse quickly' are absent and emergency advice would be over-triage. He is not yet showing signs of dehydration. Timeframe: the page says 'now' for contacting 111 or the GP; 'today' is used because it is the timeframe that goes with the urgent level on the scale."
