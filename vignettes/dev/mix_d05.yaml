atypical: false
notes: "Sources differ. heart_palpitations.txt: palpitations with chest pain or breathlessness that have stopped mean an urgent GP appointment or 111. panic_disorder.txt says panic attacks are not dangerous and to see a GP, but also that most of the symptoms can come from other conditions. chest_pain.txt: chest pain that has gone away quickly but you are still worried means see a GP (routine). The palpitations page was followed as the most specific to this combination. All symptoms have stopped, so the present-tense questions (palpitations_now, cp_present_now, heart_beating_very_fast) are absent. The breathlessness built up with the panic rather than coming on suddenly. Reassurance alone, without advice to be seen, would be too little. For the questions added to the list later: palpitations_came_with_symptoms is yes (chest pain and breathlessness came with the pounding heart). cp_lasted_15_minutes is 'not sure': the whole episode lasted about 15 minutes and he cannot say how long the chest pain itself went on."
