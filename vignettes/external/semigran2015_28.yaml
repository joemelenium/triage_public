conversion_notes: 'The main complaint is pain on the right side of the chest, so chest_pain is listed as presenting, although the published diagnosis is a skin condition and the pain comes with a rash in the same area. The text gives a ''5-day history'' but does not say in so many words whether the pain is there now, whether it spreads or whether breathing changes it, so the follow-up chest pain questions are left out. Rash, headache and malaise have no matching question. Text is from the ''Vignette'' column of Supplemental Table 2 in the web appendix (vignette 28 of 45, in the published order); the ''Simplified (added symptoms)'' column is not copied. The publication gives this vignette''s source as: Epocrates (online.epocrates.com), 2014.'
