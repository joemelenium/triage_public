id: sob_d07
status: "AI-drafted, not clinically approved"
authored_by: "AI, in a session separate from the knowledge base"

presenting: [short_of_breath, cough]

summary: "A 79-year-old man (his daughter answering) with four days of a cough bringing up green phlegm, a temperature and breathlessness. Today he seems 'a bit muddled', and did not know what day it was or recognise his own kitchen, which is new."

opening_statement: "Dad's had a chesty cough and been breathless for a few days. He's a bit muddled today too, but I think he's just tired."

findings:
  present: [short_of_breath, sob_everyday_activity, cough, cough_phlegm, phlegm_yellow_or_green, cough_mucus_or_temperature, very_high_temperature, sudden_confusion, very_tired, symptoms_worse_or_not_better]
  absent: [too_breathless_to_talk, severe_breathing_difficulty, lips_or_skin_blue_grey, skin_blotchy, passed_out, fainted, chest_pain, coughing_up_blood, rash_does_not_fade, had_a_fit, sob_sudden, leg_pain_or_swelling, stroke_signs, has_copd, has_asthma, known_heart_condition, weakened_immune_system, not_peed_12_hours, wheezing, sob_more_than_usual, has_heart_failure]
  unknown: [breathing_very_fast]

context:
  none: {}
  basic: {age: 79, sex: male}
  full:
    age: 79
    sex: male
    findings: {has_copd: "no", known_heart_condition: "no"}

expected:
  acuity: emergency
  level_of_care: emergency_ambulance
  timeframe: now

minimum_safe_acuity: emergency

red_flags:
  - description: "New confusion with a chest infection (easy to miss: his daughter puts it down to tiredness)"
    findings: [sudden_confusion]
    minimum_acuity: emergency
    source: {page: pneumonia.txt, quote: "you suddenly feel confused – for example, you do not know where you are"}
  - description: "Confusion with an infection in an adult: possible sepsis"
    findings: [sudden_confusion, very_high_temperature]
    minimum_acuity: emergency
    source: {page: sepsis.txt, quote: "is confused, has slurred speech, or is not making sense"}

safety_netting_should_cover:
  - point: "Call 999 or go to A&E now"
    any_of: ["999", "A&E"]
  - point: "Bring his medicines"
    any_of: ["medicines", "medication"]

source:
  expected_outcome: {page: pneumonia.txt, quote: "you suddenly feel confused – for example, you do not know where you are"}
  minimum_safe_acuity: {page: sepsis.txt, quote: "is confused, has slurred speech, or is not making sense"}

variants:
  - id: sob_d07_v1
    style: "daughter mentions the chest symptoms only"
    opening_statement: "My dad's 79 and he's had a bad chest for a few days, coughing up green stuff and short of breath."
    volunteered: [cough, phlegm_yellow_or_green, short_of_breath]

atypical: false
notes: "Probable pneumonia in an older adult with new confusion (pneumonia.txt: 'feeling confused – this is common in older people'). pneumonia.txt and sepsis.txt both give 999/A&E for sudden confusion. Without the confusion the case would be 'urgent' (pneumonia.txt: 'you're feeling short of breath'), so the confusion is what makes it an emergency. The daughter is not sure whether he is breathing very fast (unknown). Ambulance chosen because he is confused and elderly; pneumonia.txt says 'Call 999 or go to A&E'."
