id: cp_h13
status: AI-drafted, not clinically approved
authored_by: AI, in a session separate from the knowledge base
presenting: [chest_pain]
summary: 71-year-old woman with angina diagnosed six years ago and high cholesterol. Last night, walking
  home in the cold after a large meal, she had her usual chest pain. She stood still, used her spray and
  it went within two minutes. Large meals and cold air are her usual triggers and attacks come every few
  weeks, no more often than before. No pain since.
opening_statement: I've had angina for six years. Last night I walked home in the cold after a big roast
  dinner and got my usual chest pain. I stood still and used my spray and it was gone in two minutes.
  A big meal and cold air always set it off. It's every few weeks, same as ever. Is there anything I should
  do?
