expected: {acuity: self_manageable, level_of_care: self_care, timeframe: not_needed}
minimum_safe_acuity: self_manageable
red_flags: []
safety_netting_should_cover:
- point: Rest and use the angina medicine as instructed when an attack comes on
  any_of: [angina medicine, GTN, glyceryl trinitrate, spray]
- point: Call 999 if the pain does not stop after resting for a few minutes or after the angina medicine
  any_of: ['999']
- point: Get help from NHS 111 if the angina gets worse, more frequent, longer or comes on at rest
  any_of: ['111']
source:
  expected_outcome: {page: angina.txt, quote: 'If you''ve been diagnosed with angina and get chest pain,
      follow the instructions you''ve been given for treating your angina'}
  minimum_safe_acuity: {page: angina.txt, quote: Angina attacks usually last less than 10 minutes and
      should stop after resting for a few minutes or taking your angina medicine.}
context_test: {what_context_adds: The record shows a diagnosis of angina. The patient remembers heart
    tests and being given a spray but cannot say what her condition is called., expected_direction: less_urgent}
atypical: false
notes: 'Context test and a low-urgency case. She cannot say whether a doctor has told her she has angina
  (she remembers tests and being given a spray, not the name), so has_angina is ''not sure''; the record
  says yes. With the record known this is diagnosed angina behaving as it always has, settling with rest
  or her medicine: angina.txt tells diagnosed patients to follow the instructions they have been given,
  and reserves 999 for pain that does not stop and NHS 111 for angina that is worse than before. Neither
  applies. Without the record, the only supported advice is for undiagnosed chest pain that comes and
  goes: ''See a GP'' (chest_pain.txt) or NHS 111 (angina.txt), which is why full context should make the
  outcome less urgent. The expected outcome and minimum safe acuity are for the full-context run; a more
  cautious answer without the record is not an error. Source difference: the first NHS 111 bullet on angina.txt
  (''chest pain or other symptoms of angina that come and go'') read literally would also cover stable
  diagnosed angina; judgement is that it is aimed at people without a diagnosis, because the next bullet
  deals separately with diagnosed angina and only when it is worse. For the questions added to the list
  later: cp_on_exertion is yes: the pain comes on walking uphill and goes when she stops. Without the
  record that pattern matches angina.txt''s description and its NHS 111 advice, so the direction of the
  context test is unchanged.'
