summary: "A 78-year-old woman whose illness began four days ago with sneezing and a runny nose, followed the next day by a scratchy sore throat and now a mild, tickly cough. The throat is already easing. She is eating and drinking normally, has no temperature, is no more tired than usual and is not worried. Her daughter asked her to check; she does not want treatment advice."

opening_statement: "It started with sneezing and a runny nose four days ago, then my throat went sore, and now I've a tickly cough. The throat's easing off already. My daughter said I ought to check it's nothing."

