notes: "Pages differ: paralysis.txt gives non-urgent GP advice for weakness that 'started gradually' or 'is getting slowly worse', while guillain_barre_syndrome.txt gives urgent GP or 111 advice. The story (spreading over days after a stomach bug) fits Guillain-Barré better, so urgent is chosen. weakness_gradual is marked absent because it is getting worse over days, not slowly. The 999 signs on the GBS page (face drooping, trouble swallowing or speaking, cannot lift arms) are absent."
