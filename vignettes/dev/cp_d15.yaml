presenting: [chest_pain]
summary: 70-year-old man with a dull ache in his chest that came on gradually while walking the dog. He
  has been sitting for ten minutes and it is still there, though mild. He had heart tests last year and
  takes tablets but cannot say what was diagnosed; his record shows angina.
opening_statement: I got a dull ache in my chest while I was walking the dog. It came on gradually. I've
  been sat down for a good ten minutes now and it's still there, though it's not bad.
