presenting: [chest_pain]
summary: 23-year-old woman in the middle of final exams. When she panics about them she gets a sharp pain
  in her chest and her heart races. Each episode lasts about ten minutes and settles by itself; the last
  was this morning. No pain now. She still goes running with no trouble.
opening_statement: I'm in the middle of my finals and I keep getting a sharp pain in my chest when I'm
  panicking about them. My heart races when it happens. It lasts ten minutes or so and then settles. I
  had one this morning. It's not there now, and I can still go for my runs without any trouble.
