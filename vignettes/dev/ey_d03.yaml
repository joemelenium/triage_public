  absent: [chemical_in_eye, contact_lens_wearer, both_eyes_affected, headache, nausea_or_vomiting]
  unknown: [eye_pierced]

context:
  none: {}
  basic: {age: 42, sex: male}
  full:
    age: 42
    sex: male
    findings: {}

expected:
  acuity: emergency
  level_of_care: emergency_department
  timeframe: now

minimum_safe_acuity: emergency

