# Entry symptom: itchy bottom (itchy anus).
# NOT FOR CLINICAL USE. AI-drafted, not clinically reviewed.
#
# Each rule says: WHEN these findings are present, the outcome is at least THIS.
# The engine takes the most urgent rule that fires. If none fires, it uses the
# default at the bottom.

id: itchy_bottom
name: "Itchy bottom"
presenting_finding: itchy_bottom
status: "AI-drafted, not clinically reviewed"

screens:
  - id: itchy_bottom_urgent_screen
    level: urgent
    question: "Do any of these apply? Choose all that apply."
    findings:
      - black_or_dark_red_poo
      - bleeding_from_bottom
      - anal_pain

red_flags:
  - id: rf_ib_black_poo
    description: "Itchy bottom with black or dark red poo"
    when: black_or_dark_red_poo
    outcome: {acuity: urgent, level_of_care: urgent_care, timeframe: today, timeframe_detail: "Ask for an urgent GP appointment or get help from NHS 111"}
    advice: advice_rectal_bleeding_urgent
    source: nhs_bleeding_from_the_bottom_rectal_bleeding
    note: "Source difference: the Itchy bottom page says see a GP (non-urgent) for blood in poo that might be dark red or black. The Bleeding from the bottom page says an urgent GP appointment or 111 for black or dark red poo. The more urgent is used."

outcome_rules:
  - id: or_ib_worms_young_or_pregnant
    description: "Possible threadworms in a child under 2, or in someone pregnant or breastfeeding: see a GP, midwife or health visitor instead of a pharmacist"
    when: {all: [{any: [threadlike_worms, itchy_bottom_worse_at_night]}, {any: [age_under_2, pregnant_or_recently_given_birth]}]}
    outcome: {acuity: routine, level_of_care: general_practice, timeframe: no_fixed_time, timeframe_detail: "See a GP, midwife or health visitor. The source gives no fixed time."}
    advice: advice_itchy_bottom_gp
    source: nhs_itchy_anus
    note: "The page says children under 2 and pregnant or breastfeeding women need to see a GP, midwife or health visitor for threadworms. 'Gave birth in the last 6 weeks' stands in for breastfeeding."

  - id: or_ib_gp
    description: "Itchy bottom that is not going away or keeps coming back, with pain, bleeding, leaking, changes in pooing, itching elsewhere, or a change around the bottom"
    when: {any: [itch_not_going_away, anal_pain, bleeding_from_bottom, bowel_incontinence, bowel_habit_change_3_weeks, itchy_elsewhere, lump_at_bottom]}
    outcome: {acuity: routine, level_of_care: general_practice, timeframe: no_fixed_time, timeframe_detail: "See a GP. The source gives no fixed time."}
    advice: advice_itchy_bottom_gp
    source: nhs_itchy_anus

  - id: or_ib_threadworms
    description: "Itchy bottom that is worse at night, or tiny white worms like thread: possible threadworms"
    when: {any: [threadlike_worms, itchy_bottom_worse_at_night]}
    outcome: {acuity: routine, level_of_care: community_pharmacy, timeframe: no_fixed_time, timeframe_detail: "See a pharmacist. The source gives no fixed time."}
    advice: advice_itchy_bottom_pharmacy
    source: nhs_threadworms

default:
  description: "Itchy bottom with nothing that needs more help: things you can do to ease it, and a pharmacist can help"
  outcome: {acuity: self_manageable, level_of_care: self_care, timeframe: not_needed, timeframe_detail: "Get medical help if the itching does not stop"}
  advice: advice_itchy_bottom_self_care
  source: nhs_itchy_anus
