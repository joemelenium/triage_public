conversion_notes: '''She has no abdominal pain or fever'' is mapped to very_high_temperature absent. The closing bracket (''in study 50% recommended physician visit'') is part of the published text (a remark by the study authors, not part of the patient''s story). The patient ''calls to report'' her symptoms. Rule used for very_high_temperature in this set: present when the text states a fever (not described as low-grade), chills, rigors or feeling hot; left out when the fever is described as low-grade or measured below 38.0 C; absent when fever is explicitly ruled out. Text is from the ''Vignette'' column of Supplemental Table 2 in the web appendix (vignette 39 of 45, in the published order); the ''Simplified (added symptoms)'' column is not copied. The publication gives this vignette''s source as: Sirovich BE et al. Variation in the tendency of primary care physicians to intervene. Arch Intern Med 2005;165:2252-2256.'
