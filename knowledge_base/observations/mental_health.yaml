  question: "Have you hurt yourself and the injury is deep, gaping open or bleeding a lot? Or have you burned yourself badly?"
  question_carer: "Has the person hurt themselves and the injury is deep, gaping open or bleeding a lot? Or have they burned themselves badly?"
  checklist_text: "An injury that is deep, gaping or bleeding a lot, or a bad burn"
