notes: "Two presenting symptoms; the chest pain should decide the outcome, not the sore throat, which alone would lead to a pharmacist. Source difference on chest pain that comes and goes. chest_pain.txt: 'Non-urgent advice: See a GP if: you have chest pain that comes and goes'. angina.txt: 'Urgent advice: Get help from NHS 111 if: you have chest pain or other symptoms of angina that come and go'. pulmonary_embolism.txt lists 'you feel pain in your chest or upper back' under call 999 or go to A&E, but that page is about people with symptoms of a pulmonary embolism, and he has none of the others (no sudden difficulty breathing, no pain on breathing in, no coughing up blood, no leg pain or swelling). Judgement: the expected outcome follows angina.txt (urgent, the more cautious of the two pages that describe this pattern), and the minimum safe acuity follows chest_pain.txt (routine, GP). angina.txt gives no time, so 'today' is used to match the urgent level."
