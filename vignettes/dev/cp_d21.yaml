id: cp_d21
status: AI-drafted, not clinically approved
authored_by: AI, in a session separate from the knowledge base
presenting: [chest_pain]
summary: 19-year-old man with no risk factors. On his last five or six runs on cold mornings he has had
  an ache in the centre of his chest after about ten minutes, which goes within a couple of minutes if
  he stops and walks. He is otherwise well and has no pain now. He does not know his father's side of
  the family.
opening_statement: When I go running on cold mornings I get an ache in the middle of my chest after about
  ten minutes. If I stop and walk it goes within a couple of minutes. It's happened on the last five or
  six runs. I'm fine otherwise and it's not there now. Is it just the cold air?
