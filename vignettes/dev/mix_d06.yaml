notes: "Sources differ. pneumonia.txt gives an urgent GP appointment or 111 for green phlegm, chest pain on breathing or coughing and feeling short of breath, and 999 only for struggling to breathe, blue or blotchy skin, coughing up blood or sudden confusion (all absent). chest_pain.txt says 999 for chest pain with shortness of breath, which read literally would make this an emergency; its own table links pain worse on breathing in with yellow or green mucus and a high temperature to a chest infection, pneumonia or pleurisy. The pneumonia page was followed. An emergency outcome would be over-triage but not unsafe. cp_comes_and_goes is present because the pain comes with each breath or cough."
