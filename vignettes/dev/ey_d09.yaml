summary: "A 74-year-old man has noticed over the past year that his sight in both eyes is slowly getting misty, colours look faded, and car headlights at night have glowing rings around them. There is no pain or redness."

opening_statement: "My eyesight's been getting cloudier over the last year or so, like looking through a dirty window. Headlights at night have got halos round them."

