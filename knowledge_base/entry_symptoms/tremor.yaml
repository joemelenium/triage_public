# Entry symptom: tremor or shaking hands.
# NOT FOR CLINICAL USE. AI-drafted, not clinically reviewed.
#
# Each rule says: WHEN these findings are present, the outcome is at least THIS.
# A rule marked "soft: true" is the exception: the conditions that look likely
# may lower its outcome, if something the patient said points to a milder cause.
# The engine takes the most urgent rule that fires. If none fires, it uses the
# default at the bottom.
#
# The Tremor page has no urgent advice. Two must-not-miss causes of sudden
# shaking come from other pages: low blood sugar in someone with diabetes, and
# shivering or shaking from a serious infection (sepsis). An overactive thyroid
# and alcohol withdrawal belong to other batches.

id: tremor
name: "Tremor or shaking hands"
presenting_finding: tremor
also_covers: [nhs_tremor_or_shaking_hands]
status: "AI-drafted, not clinically reviewed"

screens:
  - id: tremor_emergency_screen
    level: emergency
    question: "Do any of these apply? Choose all that apply."
    findings:
      - cold_or_shivery
      - feels_very_unwell
      - breathing_very_fast

red_flags:
  - id: rf_tr_sepsis
    description: "Shivering or shaking, with feeling very unwell or breathing very fast: possible sepsis"
    when: {all: [cold_or_shivery, {any: [feels_very_unwell, breathing_very_fast]}]}
    outcome: {acuity: emergency, level_of_care: emergency_department, timeframe: now, timeframe_detail: "Call 999 or go to A&E"}
    advice: advice_sepsis_emergency
    source: nhs_sepsis
    soft: true    # likely conditions may lower this: flu also makes people shivery and very unwell
    note: "Same reading as the breathlessness rule. Someone may describe the shivering of a high temperature as shaking. The Sepsis page says call 999 or go to A&E for an adult who is shivery. Requiring feeling very unwell or breathing very fast is AI judgement."

  - id: rf_tr_low_sugar
    description: "Diabetes and signs of low blood sugar (a hypo)"
    when: {all: [has_diabetes, diabetes_low_sugar_signs]}
    outcome: {acuity: urgent, level_of_care: urgent_care, timeframe: today, timeframe_detail: "Treat the low blood sugar now. If it does not improve, get help from NHS 111, or call 999 if the person becomes drowsy or confused."}
    advice: advice_low_blood_sugar
    source: nhs_low_blood_sugar

outcome_rules:
  - id: or_tr_getting_worse
    description: "A tremor that is getting worse over time"
    when: tremor_getting_worse
    outcome: {acuity: routine, level_of_care: general_practice, timeframe: no_fixed_time, timeframe_detail: "See a GP. The source gives no fixed time."}
    advice: advice_tremor_gp
    source: nhs_tremor_or_shaking_hands

  - id: or_tr_daily_life
    description: "A tremor that is affecting daily activities"
    when: tremor_affecting_daily_life
    outcome: {acuity: routine, level_of_care: general_practice, timeframe: no_fixed_time, timeframe_detail: "See a GP. The source gives no fixed time."}
    advice: advice_tremor_gp
    source: nhs_tremor_or_shaking_hands

  - id: or_tr_slow_or_stiff
    description: "A tremor with movements becoming slower or stiffer"
    when: stiff_or_slow_movements
    outcome: {acuity: routine, level_of_care: general_practice, timeframe: no_fixed_time, timeframe_detail: "See a GP. The source gives no fixed time."}
    advice: advice_tremor_gp
    source: nhs_parkinsons_disease

  - id: or_tr_new_medicine
    description: "A tremor that started after a new medicine"
    when: new_medicine_recently
    outcome: {acuity: routine, level_of_care: general_practice, timeframe: no_fixed_time, timeframe_detail: "See a GP. Do not stop a prescribed medicine without advice."}
    advice: advice_tremor_gp
    source: nhs_tremor_or_shaking_hands

default:
  description: "A mild tremor with nothing that needs more help: often more noticeable with stress, tiredness or caffeine"
  outcome: {acuity: self_manageable, level_of_care: self_care, timeframe: not_needed, timeframe_detail: "A slight tremor is normal. See a GP if it gets worse or affects your daily life."}
  advice: advice_tremor_self_care
  source: nhs_tremor_or_shaking_hands
