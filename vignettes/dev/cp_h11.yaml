notes: 'Two presenting symptoms. The outcome comes from sore_throat.txt: a sore throat with a very high
  temperature, or feeling hot, cold or shivery, means ''Ask for an urgent GP appointment or get advice
  from 111 now''. The chest pain alone is less urgent: it comes and goes with coughing (''See a GP'',
  chest_pain.txt), and green mucus with a high temperature fits the chest infection row of that page''s
  table, for which the advice is to see a GP if worried. The more urgent of the two is recorded. None
  of the 999 or A&E signs for sore throat or chest pain is present; the pain is not worse on breathing
  in. worried_about_symptoms is no, so the temperature is the only urgent sign. lump_in_mouth_or_neck
  is no: she describes swollen glands, which sore_throat.txt lists as an ordinary symptom, not a lump.
  Level of care: the source offers an urgent GP appointment or NHS 111; general_practice is recorded and
  urgent_care is equally supported. Source differences: angina.txt puts chest pain that comes and goes
  under NHS 111, and pulmonary_embolism.txt lists pain in the chest under ''Call 999 or go to A&E''; soreness
  only on coughing during a feverish illness has no feature of either condition.'
