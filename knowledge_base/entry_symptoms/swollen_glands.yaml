# Entry symptom: swollen glands.
# NOT FOR CLINICAL USE. AI-drafted, not clinically reviewed.
#
# Each rule says: WHEN these findings are present, the outcome is at least THIS.
# The engine takes the most urgent rule that fires. If none fires, it uses the
# default at the bottom.
#
# Sources: the NHS Swollen glands page, with the Glandular fever, Sore throat,
# Dental abscess and Acute lymphoblastic leukaemia pages.

id: swollen_glands
name: "Swollen glands"
presenting_finding: swollen_glands
status: "AI-drafted, not clinically reviewed"

screens:
  - id: swollen_glands_emergency_screen
    level: emergency
    question: "Do any of these apply right now? Choose all that apply."
    findings:
      - unable_to_swallow
      - drooling
      - stridor
      - swelling_in_neck_or_under_tongue

  - id: swollen_glands_urgent_screen
    level: urgent
    question: "Do any of these apply? Choose all that apply."
    findings:
      - difficulty_swallowing
      - difficulty_breathing
      - bruising_or_bleeding_easily

red_flags:
  # ---- Emergency ---------------------------------------------------------
  - id: rf_sg_cannot_swallow
    description: "Swollen glands and cannot swallow, even your own spit"
    when: unable_to_swallow
    outcome: {acuity: emergency, level_of_care: emergency_department, timeframe: now, timeframe_detail: "Call 999 or go to A&E now"}
    advice: advice_mouth_throat_ae
    source: nhs_glandular_fever
    note: "The Glandular fever page says call 999. The Sore throat page says call 999 or go to A&E."

  - id: rf_sg_drooling
    description: "Swollen glands with drooling, which can be a sign of not being able to swallow"
    when: drooling
    outcome: {acuity: emergency, level_of_care: emergency_department, timeframe: now, timeframe_detail: "Call 999 or go to A&E now"}
    advice: advice_mouth_throat_ae
    source: nhs_sore_throat

  - id: rf_sg_stridor
    description: "Swollen glands with a high-pitched sound when breathing"
    when: stridor
    outcome: {acuity: emergency, level_of_care: emergency_department, timeframe: now, timeframe_detail: "Call 999 or go to A&E now"}
    advice: advice_mouth_throat_ae
    source: nhs_sore_throat

  - id: rf_sg_neck_swelling_spreading
    description: "Swelling in the neck or under the tongue, or a lot of swelling in the mouth"
    when: swelling_in_neck_or_under_tongue
    outcome: {acuity: emergency, level_of_care: emergency_department, timeframe: now, timeframe_detail: "Call 999 or go to A&E now"}
    advice: advice_mouth_throat_ae
    source: nhs_dental_abscess

  # ---- Urgent --------------------------------------------------------------
  - id: rf_sg_swallowing_or_breathing
    description: "Swollen glands and finding it very difficult to swallow, or difficulty breathing"
    when: {any: [difficulty_swallowing, difficulty_breathing]}
    outcome: {acuity: urgent, level_of_care: urgent_care, timeframe: today, timeframe_detail: "Ask for an urgent GP appointment or get help from NHS 111"}
    advice: advice_glands_urgent
    source: nhs_swollen_glands

  - id: rf_sg_child_bruising
    description: "A child with swollen glands who is bruising or bleeding easily, or for no reason"
    when: {all: [age_under_16, bruising_or_bleeding_easily]}
    outcome: {acuity: urgent, level_of_care: urgent_care, timeframe: today, timeframe_detail: "Ask for an urgent GP appointment or call 111"}
    advice: advice_glands_urgent
    source: nhs_acute_lymphoblastic_leukaemia

outcome_rules:
  - id: or_sg_over_a_week
    description: "Swollen glands getting bigger, or not gone down within 1 week"
    when: glands_over_a_week
    outcome: {acuity: routine, level_of_care: general_practice, timeframe: no_fixed_time, timeframe_detail: "See a GP. The source gives no fixed time."}
    advice: advice_glands_gp
    source: nhs_swollen_glands

  - id: or_sg_hard_or_fixed
    description: "Swollen glands that feel hard or do not move when pressed"
    when: glands_hard_or_fixed
    outcome: {acuity: routine, level_of_care: general_practice, timeframe: no_fixed_time, timeframe_detail: "See a GP. The source gives no fixed time."}
    advice: advice_glands_gp
    source: nhs_swollen_glands

  - id: or_sg_sweats_or_temperature
    description: "Swollen glands with night sweats or a very high temperature"
    when: {any: [night_sweats, very_high_temperature]}
    outcome: {acuity: routine, level_of_care: general_practice, timeframe: no_fixed_time, timeframe_detail: "See a GP. The source gives no fixed time."}
    advice: advice_glands_gp
    source: nhs_swollen_glands

  - id: or_sg_no_other_illness
    description: "Swollen glands with no other signs of illness or infection"
    when: glands_no_other_illness
    outcome: {acuity: routine, level_of_care: general_practice, timeframe: no_fixed_time, timeframe_detail: "See a GP. The source gives no fixed time."}
    advice: advice_glands_gp
    source: nhs_swollen_glands

  - id: or_sg_collarbone
    description: "Swollen glands just above or below the collarbone"
    when: glands_near_collarbone
    outcome: {acuity: routine, level_of_care: general_practice, timeframe: no_fixed_time, timeframe_detail: "See a GP. The source gives no fixed time."}
    advice: advice_glands_gp
    source: nhs_swollen_glands

  - id: or_sg_bruising
    description: "Swollen glands and bruising or bleeding easily"
    when: bruising_or_bleeding_easily
    outcome: {acuity: routine, level_of_care: general_practice, timeframe: no_fixed_time, timeframe_detail: "See a GP. The source gives no fixed time."}
    advice: advice_glands_gp
    source: nhs_acute_lymphoblastic_leukaemia

default:
  description: "Swollen glands with nothing that needs more help: they usually go down by themselves within 1 to 2 weeks"
  outcome: {acuity: self_manageable, level_of_care: self_care, timeframe: not_needed, timeframe_detail: "Swollen glands from an infection usually get better by themselves within 1 to 2 weeks"}
  advice: advice_glands_self_care
  source: nhs_swollen_glands
