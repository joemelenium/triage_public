notes: "Source difference. tonsillitis.txt lists pus-filled spots on the tonsils under 'Urgent advice: Get help from NHS 111 now'. sore_throat.txt does not mention pus at all; on that page someone who needs help for a sore throat sees a pharmacist, and 'A pharmacist can give the same antibiotic treatment as a GP for a sore throat, if you need it.' tonsillitis.txt is followed because it is the only page that names this sign, so both the expected and the minimum safe acuity are urgent. A reviewer may prefer to accept the pharmacist route as safe. Timeframe: the page says 'now' for contacting 111 or the GP; 'today' is used because it is the timeframe that goes with the urgent level on the scale."
