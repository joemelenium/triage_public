# Merged with the general card for this condition. Its notes: Must not be missed in
# pregnancy or soon after birth. The page says get urgent medical help. Danger critical
# with an urgent level: it can lead to fits. Pregnancy is linked as a finding, so a "no"
# (or being male) all but rules it out. What tells it apart from ordinary swelling in
# pregnancy: a severe headache, vision problems, pain below the ribs, or sudden swelling
# of the face and hands.
