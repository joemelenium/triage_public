notes: 'Possible infected hip joint. Source difference: hip_pain_children_irritable_hip.txt puts sudden hip pain and not bearing weight under ''Ask for an urgent GP appointment or get help from NHS 111'', while limp_in_children.txt puts the same signs, and fever with feeling unwell, under ''Call 999 or go to A&E''. With fever and an unwell child the A&E advice fits better; the irritable hip page itself lists ''an infected hip joint (septic arthritis)'' as a serious cause.'
