notes: "Sources differ. chest_pain.txt says see a GP for chest pain that comes and goes, and its table links pain after eating with bitter fluids and bloating to heartburn. heartburn.txt says a pharmacist can help if you keep getting heartburn, and a GP only if it is most days, pharmacy medicines do not help, or there are other symptoms such as weight loss. angina.txt says 111 for chest pain that comes and goes, but this pain is tied to meals, not activity, so expected is a GP (routine) and pharmacy self-care is accepted as the minimum safe level. Over-triage to 999 or urgent would be the mistake here."
