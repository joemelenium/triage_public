conversion_notes: 'Fever with a temperature of 38.3 C (101 F) is mapped to very_high_temperature. Respiratory rate 22 and oxygen saturation 92% are examination values; the text does not say he feels short of breath, so short_of_breath is left out. The cough is productive; blood is not mentioned either way. Rule used for very_high_temperature in this set: present when the text states a fever (not described as low-grade), chills, rigors or feeling hot; left out when the fever is described as low-grade or measured below 38.0 C; absent when fever is explicitly ruled out. Text is from the ''Vignette'' column of Supplemental Table 2 in the web appendix (vignette 11 of 45, in the published order); the ''Simplified (added symptoms)'' column is not copied. The publication gives this vignette''s source as: Halm EA, Teirstein AS. Management of community-acquired pneumonia. N Engl J Med 2002;347:2039-2045.'
