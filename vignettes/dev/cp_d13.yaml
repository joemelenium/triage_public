  style: brief, does not mention angina or what brings it on
  opening_statement: I keep getting an ache in my chest that comes and goes. It's not there now. Should
    I get it looked at?
  volunteered: [cp_comes_and_goes, cp_present_now]
- id: cp_d13_v2
  style: worried, gives the pattern and negatives
  opening_statement: I'm a bit worried. Every morning for two weeks, walking up the hill to work, I get
    a dull ache right across my chest. If I stop for a couple of minutes it goes. I never get it sitting
    down. I've never been told I have angina but my brother has it. It doesn't go into my arms and I don't
    feel sick or sweaty with it.
  volunteered: [cp_comes_and_goes, worried_about_symptoms, has_angina, cp_spreads, nausea_or_vomiting,
