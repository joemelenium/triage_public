presenting: [sore_throat]

summary: "A 7-year-old boy with a sore throat for three days. Today he is refusing food and drink because it hurts too much and has had only a few sips of water. He has passed urine once today and it was dark and strong-smelling. He can swallow his saliva, is not drooling, and is breathing and talking normally. He will not open wide enough for his parent to see his tonsils. His parent is answering."

opening_statement: "My son's seven and his throat is so sore he won't eat or drink anything today. He's hardly had a wee all day either."

