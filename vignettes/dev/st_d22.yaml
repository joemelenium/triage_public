id: st_d22
status: "AI-drafted, not clinically approved"
authored_by: "AI, in a session separate from the knowledge base"

presenting: [sore_throat]

summary: "A 19-year-old man six days into an illness with a sore throat, swollen glands and tiredness that seemed to be settling by day four. Over the last day the right side has become much worse: he cannot open his mouth more than a finger's width, his flatmate can see a swelling at the back of his throat on the right, and he is managing only sips. He is breathing normally and can speak. He has a GP appointment in three days and asks whether to wait for it."

opening_statement: "I've had tonsillitis for nearly a week and thought it was on the way out. Since yesterday the right side has got much worse, I can hardly open my mouth, and my flatmate says the back of my throat looks swollen on that side. I've got a GP appointment in three days. Is it OK to wait?"

