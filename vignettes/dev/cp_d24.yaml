id: cp_d24
status: AI-drafted, not clinically approved
authored_by: AI, in a session separate from the knowledge base
presenting: [chest_pain]
summary: 84-year-old man with angina for about ten years, high blood pressure and high cholesterol. This
  morning he had his usual chest pain pushing the wheelie bin up the drive; he stood still for a couple
  of minutes and it went without the spray. He gets it a couple of times a month with that sort of effort
  and it has not changed. His son thinks he should report every attack.
opening_statement: I'm 84 and I've had angina for about ten years. This morning I got my usual chest pain
  pushing the wheelie bin up the drive. I stood still for a couple of minutes and it went, I didn't even
  need the spray. I get it a couple of times a month doing that sort of thing and it hasn't changed. My
  son thinks I should report it every time. Do I need to?
