summary: "A 68-year-old man who smoked for 40 years. For four days his chest has been wheezier and he has been coughing up more white phlegm than normal. He says he is no more breathless than his usual. His record shows COPD, but he says only that the doctor 'mentioned something about my lungs' and is not sure if he has a lung condition."

opening_statement: "My chest has been wheezier this week and I'm coughing up more phlegm. Nothing dramatic, I'm not more puffed than normal."

