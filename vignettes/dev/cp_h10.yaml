presenting: [chest_pain]
summary: 31-year-old man who for the past month has had a sharp pain in the left side of his chest during
  stressful moments at work. It lasts a minute or so and goes by itself whatever he is doing. He never
  gets it during exercise and plays five-a-side football without trouble. No pain now and no other symptoms.
opening_statement: For the last month, whenever work gets really stressful, I get a sharp pain in the
  left side of my chest. It lasts a minute or so and goes by itself, whatever I'm doing. I never get it
  when I play five-a-side. It's not there now.
