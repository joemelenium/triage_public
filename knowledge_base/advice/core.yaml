  source: ai_judgement

- id: advice_condition_routine
  what_to_do: "See a GP. Your answers suggest a problem that should be checked, but it is not urgent."
  look_out_for:
    - "Symptoms that get worse or do not improve"
    - "New symptoms"
  get_more_help_when:
    - "Ask for an urgent GP appointment or call 111 if you get worse"
    - "Call 999 or go to A&E in an emergency"
  where_to_go: "Make an appointment with a GP. For urgent help call 111 or use 111 online. In an emergency call 999."
