conversion_notes: 'Age is published as ''18-month-old'' and recorded here as 1.5 years. Sex is taken from ''she'' and ''her''. ''Overnight she developed a fever'' and ''has a fever'' (no temperature given) are mapped to very_high_temperature. The history is given by the parents. Ear findings come from otoscopy and have no matching question. Rule used for very_high_temperature in this set: present when the text states a fever (not described as low-grade), chills, rigors or feeling hot; left out when the fever is described as low-grade or measured below 38.0 C; absent when fever is explicitly ruled out. Text is from the ''Vignette'' column of Supplemental Table 2 in the web appendix (vignette 16 of 45, in the published order); the ''Simplified (added symptoms)'' column is not copied. The publication gives this vignette''s source as: Epocrates (online.epocrates.com), 2014.'
