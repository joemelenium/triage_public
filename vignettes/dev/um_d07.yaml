notes: 'Look-alike. testicle_lumps_and_swellings.txt names swollen veins in the testicles (varicocele) as a common cause. Source difference: testicle_pain.txt gives urgent advice for ''aching or discomfort in your testicles that you''re worried about'', while testicle_lumps_and_swellings.txt gives non-urgent GP advice for a lump or for aching that does not go away. He presents with pain and is worried, so testicle_pain.txt was used for the expected outcome and the non-urgent page sets the minimum. testicle_pain_over_an_hour is marked absent because the ache goes within minutes of lying down and is not pain that continues at rest. This is a judgement: a patient might answer this question ''yes'' because the ache goes on for hours while he is standing.'
