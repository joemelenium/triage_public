conversion_notes: '''Intermittent fevers as high as 100.8'' (about 38.2 C) is mapped to very_high_temperature present: it is stated as fever and not described as low-grade, though it is only just above 38 C. ''Otherwise healthy, except for chronic osteoarthritis of the right knee'' is mapped to weakened_immune_system absent. In the PDF the diagnosis label overlaps the start of this row; the opening words were read as ''Mr. R. is a 56 year-old man''. Rule used for very_high_temperature in this set: present when the text states a fever (not described as low-grade), chills, rigors or feeling hot; left out when the fever is described as low-grade or measured below 38.0 C; absent when fever is explicitly ruled out. Text is from the ''Vignette'' column of Supplemental Table 2 in the web appendix (vignette 43 of 45, in the published order); the ''Simplified (added symptoms)'' column is not copied. The publication gives this vignette''s source as: Gidengil CA et al. Using clinical vignettes to predict
  antibiotic prescribing for acute respiratory infections (listed as ''In review'').'
