  volunteered: [has_angina, cp_after_eating, angina_pain_not_settling, angina_worse_than_usual, cp_present_now]
atypical: false
notes: 'Low-urgency case: over-triage would be the mistake. For someone already diagnosed, angina.txt
  says to follow the instructions they have been given, that attacks ''should stop after resting for a
  few minutes or taking your angina medicine'', to call 999 only if the pain does not stop and to get
  help from NHS 111 only if the angina is worse than before, more frequent, longer or at rest. None applies.
  The same page names cold temperatures and eating large meals as angina triggers, so cp_after_eating
  is yes here (the pain started after a big meal, when she felt full) without pointing to indigestion;
  cp_on_exertion is yes for walking in the cold and easing with rest. Source differences: chest_pain.txt
  says ''See a GP'' for chest pain that comes and goes and its table links pain after eating with heartburn
  or indigestion; the first NHS 111 bullet on angina.txt (''chest pain or other symptoms of angina that
  come and go'') read literally would also cover her. Judgement: those are aimed at people without a diagnosis,
  because angina.txt deals separately with diagnosed angina and escalates only when it is worse. An answer
  of routine GP would be cautious rather than unsafe.'
