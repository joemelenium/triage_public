notes: "Probable panic attack, but heart_palpitations.txt says 999 or A&E for current palpitations with chest pain or shortness of breath, and chest_pain.txt says 999 for chest pain with sweating or breathlessness. panic_disorder.txt says panic attacks are not dangerous but warns that the symptoms can come from other conditions. She takes the combined pill, a blood clot risk on the question list, with no leg symptoms. Reassurance as panic alone would be under-triage by the sources. Level chosen as emergency department since the page gives 999 or A&E; an ambulance would also fit."
