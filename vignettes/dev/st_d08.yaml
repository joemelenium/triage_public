atypical: false
notes: "Two pages each give urgent advice here: sore_throat.txt for signs of dehydration, and tonsillitis.txt ('Get help from NHS 111 now') for a sore throat so painful it is difficult to eat or drink. He is refusing to drink because of pain but can swallow, so 'unable to swallow' is absent and emergency advice would be over-triage. A pharmacist, the usual route for a child aged 5 or over who needs help, would be under-triage. The parent cannot see his tonsils, so pus is unknown; pus would also lead to urgent advice on tonsillitis.txt, so the outcome does not depend on it. Timeframe: the page says 'now' for contacting 111 or the GP; 'today' is used because it is the timeframe that goes with the urgent level on the scale."
