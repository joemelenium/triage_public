conversion_notes: '''Specifically no pyrexia'' is mapped to very_high_temperature absent. Recurrent ulceration over years is not the same as one ulcer lasting more than 3 weeks, and the age of the current ulcers is not given, so mouth_ulcer_over_3_weeks is left out. ''No cervical lymph node enlargement'' rules out a neck lump on examination, but a lump in the mouth is not addressed in those words, so lump_in_mouth_or_neck is left out. Rule used for very_high_temperature in this set: present when the text states a fever (not described as low-grade), chills, rigors or feeling hot; left out when the fever is described as low-grade or measured below 38.0 C; absent when fever is explicitly ruled out. Text is from the ''Vignette'' column of Supplemental Table 2 in the web appendix (vignette 38 of 45, in the published order); the ''Simplified (added symptoms)'' column is not copied. The publication gives this vignette''s source as: Epocrates (online.epocrates.com), 2014.'
