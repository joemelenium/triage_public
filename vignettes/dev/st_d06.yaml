    any_of: ["111", "urgent GP"]
  - point: "Call 999 or go to A&E if there is difficulty breathing, they cannot swallow, they are drooling, or they get worse quickly"
    any_of: ["999", "A&E"]

source:
  expected_outcome: {page: sore_throat.txt, quote: "Urgent advice: Ask for an urgent GP appointment or get advice from 111 now if:"}
  minimum_safe_acuity: {page: sore_throat.txt, quote: "you have a weakened immune system – for example, because of diabetes or chemotherapy"}

context_test:
  what_context_adds: "The GP record lists type 2 diabetes, which sore_throat.txt gives as an example of a weakened immune system. Asked directly, the patient says he is not sure."
  expected_direction: more_urgent

atypical: false
notes: "Context test. Without the record, the only thing known is that he wants help for a sore throat, which leads to a pharmacist (routine). With the record, sore_throat.txt gives urgent advice for a sore throat in someone with a weakened immune system. The finding behind the red flag is listed under unknown because the patient cannot confirm it; the record supplies the answer. Timeframe: the page says 'now' for contacting 111 or the GP; 'today' is used because it is the timeframe that goes with the urgent level on the scale."
