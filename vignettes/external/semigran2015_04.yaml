conversion_notes: '''Dyspnea'' is mapped to short_of_breath, following the publication''s own simplified wording (''shortness of breath''); difficulty_breathing is left out. ''Intermittent, low-grade fever of 100 F (37.7 C)'' is not mapped to very_high_temperature (low-grade, below 38 C): left out rather than marked absent. Sputum is green and purulent; blood is not mentioned either way. Rule used for very_high_temperature in this set: present when the text states a fever (not described as low-grade), chills, rigors or feeling hot; left out when the fever is described as low-grade or measured below 38.0 C; absent when fever is explicitly ruled out. Text is from the ''Vignette'' column of Supplemental Table 2 in the web appendix (vignette 4 of 45, in the published order); the ''Simplified (added symptoms)'' column is not copied. The publication gives this vignette''s source as: Epocrates (online.epocrates.com), 2014.'
