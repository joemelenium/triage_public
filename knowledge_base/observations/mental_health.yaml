# Observations: mental health.
# NOT FOR CLINICAL USE. A demonstration and proof of concept only.
#
# Fields are described in observations/general.yaml.
#
# Questions about suicide and self-harm are asked plainly and kindly. Asking
# about suicide does not put the idea in someone's head, and plain words make it
# easier to answer honestly.
#

# ===========================================================================
# Main symptoms (one per entry symptom)
# ===========================================================================
- id: low_mood
  label: "Feeling low, sad or depressed"
  question: "Have you been feeling low, sad, hopeless or depressed?"
  question_carer: "Has the person been feeling low, sad or hopeless, or seemed depressed?"
  checklist_text: "Feeling low, sad, hopeless or depressed"
  kind: presenting
  snomed: "366979004"
  phrases: ["feeling down", "depressed", "really low", "can't stop crying"]
  source: nhs_low_mood

- id: feeling_anxious
  label: "Feeling anxious, worried or panicky"
  question: "Have you been feeling anxious, worried, frightened or panicky?"
  question_carer: "Has the person been feeling anxious, worried, scared or panicky?"
  checklist_text: "Feeling anxious, worried or panicky"
  kind: presenting
  phrases: ["anxious", "panicky", "on edge", "can't stop worrying"]
  source: nhs_anxiety_fear_panic

- id: suicidal_thoughts_or_self_harm
  label: "Thoughts of suicide or self-harm, or has self-harmed"
  question: "Have you had thoughts of ending your life, or of harming yourself? Or have you harmed yourself on purpose?"
  question_carer: "Has the person talked about ending their life or harming themselves? Or have they harmed themselves on purpose?"
  checklist_text: "Thoughts of ending your life or harming yourself, or harmed yourself on purpose"
  kind: presenting
  phrases: ["want to die", "suicidal", "want to end it all", "cutting myself", "hurting myself"]
  source: nhs_suicidal_thoughts

- id: hearing_or_seeing_things
  label: "Hearing, seeing or feeling things that other people do not"
  question: "Have you been hearing, seeing or feeling things that other people do not? For example, hearing voices when no one is there."
  question_carer: "Has the person been hearing, seeing or feeling things that other people do not? For example, hearing voices when no one is there."
  checklist_text: "Hearing, seeing or feeling things that other people do not"
  kind: presenting
  snomed: "7011001"
  phrases: ["hearing voices", "seeing things", "seeing people who aren't there"]
  source: nhs_psychosis

- id: agitated_or_out_of_control
  label: "Feeling out of control, or very agitated or restless"
  question: "Have you been feeling out of control, or very agitated or restless? Or have you been acting in a way that is not like you?"
  question_carer: "Has the person been very agitated, restless or out of control? Or have they been acting in a way that is not like them?"
  checklist_text: "Feeling out of control, very agitated or restless"
  kind: presenting
  snomed: "24199005"
  phrases: ["can't calm down", "out of control", "losing it", "not acting like himself"]
  source: nhs_urgent_mental_health

- id: alcohol_or_drug_problem
  label: "Worried about alcohol or drug use"
  question: "Are you worried about how much alcohol you drink, or about drug use? Or have you had problems after drinking or taking a drug?"
  question_carer: "Are you worried about how much alcohol the person drinks, or about their drug use? Or have they had problems after drinking or taking a drug?"
  checklist_text: "Worried about alcohol or drug use"
  kind: presenting
  phrases: ["drinking too much", "can't stop drinking", "using again", "addicted"]
  source: nhs_alcohol_misuse

- id: eating_problem
  label: "Worried about eating, weight or body shape"
  question: "Are you worried about your eating, or about your weight or body shape? For example, eating very little, making yourself sick, or eating large amounts and feeling out of control."
  question_carer: "Are you worried about the person's eating, or how they feel about their weight or body shape?"
  checklist_text: "Worried about eating, weight or body shape"
  kind: presenting
  phrases: ["not eating", "making myself sick", "binge eating", "obsessed with my weight"]
  source: nhs_eating_disorders

# ===========================================================================
# Suicide and self-harm
# ===========================================================================
- id: suicidal_thoughts
  label: "Thoughts of ending their life"
  question: "Have you been having thoughts of ending your life?"
  question_carer: "Has the person been having thoughts of ending their life, or talked about it?"
