  question_carer: "Do you feel that you cannot keep the person, or someone else, safe right now?"
  checklist_text: "Cannot keep yourself or someone else safe right now"
  kind: symptom
  seriousness: emergency
  phrases: ["I can't keep myself safe", "I'm scared of what I'll do"]
