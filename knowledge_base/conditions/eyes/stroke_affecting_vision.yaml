  vision_loss_brief: strongly_supports
  vision_change_sudden: strongly_supports
  difficulty_speaking: supports
  dizziness: supports
  double_vision_sudden: supports
  heart_risk_factors: supports
key_findings: [lost_half_of_vision, vision_loss_brief, dizziness, heart_risk_factors]
