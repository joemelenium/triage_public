presenting: [red_eye]

summary: "A 48-year-old man woke up with a flat, bright red patch on the white of his left eye after a bad coughing fit with a cold last night. It does not hurt, his sight is normal and he feels well. He does not take blood thinners."

opening_statement: "I've woken up and half the white of my eye is bright red, like blood. It looks awful but it doesn't hurt and I can see fine. I was coughing a lot last night."

findings:
  present: [red_eye, bright_red_patch, redness_in_one_patch, cough_or_runny_nose]
  absent: [eye_pain, vision_change, bothered_by_light, eye_very_dark_red, headache, nausea_or_vomiting, eye_injury, something_in_eye, contact_lens_wearer, takes_blood_thinners, sticky_discharge, pupils_different_sizes, feels_very_unwell, both_eyes_affected, bruising_or_bleeding_easily]
  unknown: []

