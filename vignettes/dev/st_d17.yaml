notes: "Ordinary cold-type course that is already improving. sore_throat.txt lists 'a mild cough' as an ordinary symptom and says sore throats 'are usually caused by viruses (like cold or flu)'. Neither page gives age alone as a reason to do more for an adult, so advice above self-care or a pharmacist would be over-triage."
