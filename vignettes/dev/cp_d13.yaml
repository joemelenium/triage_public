id: cp_d13
status: AI-drafted, not clinically approved
authored_by: AI, in a session separate from the knowledge base
presenting: [chest_pain]
summary: 57-year-old man who for two weeks has had a dull ache across his chest when walking uphill to
  work. It goes within a couple of minutes of stopping. He never gets it at rest and has no pain now.
  His brother has angina and he wonders if he has it too.
opening_statement: For the last couple of weeks I get a dull ache across my chest when I walk up the hill
  to work. It goes within a couple of minutes if I stop. I don't get it sitting down and I haven't got
  it now. My brother has angina and I'm wondering if that's what this is.
