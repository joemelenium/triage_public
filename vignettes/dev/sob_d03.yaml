notes: "Over-triage test. covid_19.txt gives home advice specifically for breathlessness and only escalates if symptoms get worse or do not get better (urgent) or if 'so breathless you're unable to say short sentences when resting or your breathing has suddenly got worse' (999). SOURCE DIFFERENCE: shortness_of_breath.txt says 'Contact NHS 111 if you have difficulty breathing – you may be more short of breath than usual' and 'Do not try to self-diagnose the cause of shortness of breath – always see a GP'; flu.txt sends 'you feel short of breath' with flu to an urgent GP appointment or NHS 111. Judgement: the COVID page is the most specific to this illness and he is improving, so self-care is expected. An engine that says NHS 111 or a GP is being cautious but defensible from shortness_of_breath.txt; reviewers may wish to relax minimum_safe_acuity. worried_about_symptoms listed absent: he asks a question but is not worried."
