context_test: {what_context_adds: The record shows a diagnosis of angina. The patient remembers a heart
    scan and being started on tablets but does not recall being told she has angina., expected_direction: more_urgent}
atypical: false
notes: 'Context test, and a danger sign that is easy to miss because the pattern looks like a minor cause.
  She cannot say whether a doctor has told her she has angina (she remembers a scan and tablets, not the
  word), so has_angina is ''not sure''; the record says yes. With the record, angina.txt applies directly:
  diagnosed angina with pain that does not stop after resting for a few minutes means call 999, and the
  same page says attacks are often brought on by stress or emotion. Without the record, the pain was triggered
  by a stressful situation (the anxiety row of the chest_pain.txt table), it is not sudden, does not spread
  and has no associated symptoms, so no 999 sign on chest_pain.txt is met and the supported advice is
  less urgent: see a GP, or NHS 111 because she cannot be sure whether 999 is needed (when_to_call_999.txt).
  Hence more_urgent. Source difference: pulmonary_embolism.txt lists ''pain in your chest or upper back''
  under ''Call 999 or go to A&E'', which read literally would make this an emergency even without the
  record. cp_on_exertion is no: it came on with stress but has not eased with rest. worried_about_symptoms
  is no.'
