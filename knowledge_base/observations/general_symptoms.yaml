  checklist_text: "A swollen arm or hand"
  kind: presenting
  phrases: ["swollen hand", "puffy arm", "fingers swollen", "rings too tight"]
  source: nhs_swollen_arms_and_hands_oedema

- id: blue_or_grey_skin
  label: "Skin, lips, fingers or toes look blue or grey"
  question: "Has your skin, lips, tongue, fingers or toes turned blue or grey? On brown or black skin this may be easier to see on the palms, soles of the feet, lips, gums or inside the eyelids."
  question_carer: "Has your child's skin, lips, tongue, fingers or toes turned blue or grey? On brown or black skin this may be easier to see on the palms, soles of the feet, lips, gums or inside the eyelids."
  kind: presenting
  snomed: "3415004"
  phrases: ["going blue", "blue fingers", "grey lips", "blue toes"]
  source: nhs_blue_skin_or_lips_cyanosis

- id: generally_unwell
  label: "Feeling generally unwell"
  question: "Do you feel generally unwell, without one main symptom?"
  question_carer: "Does your child seem generally unwell, without one main symptom?"
  kind: presenting
  phrases: ["feel rubbish", "just not right", "under the weather", "feel off"]
  source: ai_judgement

- id: baby_unsettled_or_not_feeding
  label: "Baby not feeding well, or unsettled"
  question: "Is your baby not feeding well, or more unsettled or crying more than usual?"
