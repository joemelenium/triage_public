# Advice: safety-netting and self-care text for each outcome.
# NOT FOR CLINICAL USE. AI-drafted, not clinically reviewed.
#
# Wording is adapted from the cited NHS website page, aiming for a reading age
# of 9 to 11. Adapted text no longer carries the NHS website's clinical approval.
#
# Every entry has the three parts of safety-netting:
#   look_out_for        what to watch for
#   get_more_help_when  when to get more help
#   where_to_go         where to get it

# ---------------------------------------------------------------------------
# Universal red flags
# ---------------------------------------------------------------------------
- id: advice_stroke
  what_to_do: "Call 999 now. You may be having a stroke, or may have had one."
  look_out_for:
    - "One side of the face drooping"
    - "Not being able to lift both arms and keep them up"
    - "Slurred or confused speech"
    - "Signs of a stroke can stop after a short time. Get help straight away even if they have stopped."
  get_more_help_when:
    - "Call 999 again if things get worse before help arrives"
  where_to_go: "Call 999. Do not drive yourself to A&E. The person you speak to at 999 will tell you what to do."
  source: nhs_stroke_symptoms

- id: advice_breathing_emergency
  what_to_do: "Call 999 now."
  look_out_for:
    - "Keep checking that the person is still responding and breathing"
    - "If they stop responding and stop breathing, start CPR: press hard and fast in the middle of their chest. The 999 call handler will tell you how."
  get_more_help_when:
    - "Call 999 again if the person's condition changes"
    - "Call 999 again if you move to a different place"
  where_to_go: "Call 999. Do not drive yourself to A&E. Stay with the person until help arrives."
  source: nhs_heart_attack
  also_informed_by: [nhs_when_to_call_999]

- id: advice_heavy_bleeding
  what_to_do: "Call 999 or go to A&E now."
  look_out_for:
    - "Blood that comes out in spurts and is bright red and hard to control"
    - "Blood coming through the bandage or cloth. If it does, put another one on top and keep pressing."
  get_more_help_when:
    - "Call 999 if you cannot stop the bleeding or cannot get to A&E safely"
  where_to_go: "Call 999 or go to A&E. Do not drive to A&E. Ask someone to drive you or call 999 and ask for an ambulance. Bring any medicines you take."
  self_care:
    - "Press firmly on the wound with a bandage or a clean, folded cloth"
    - "If something is stuck in the wound, do not take it out. Press on either side of it."
    - "If the wound is on a hand or arm, raise it above your head. If it is on a leg, lie down and raise it above the level of your heart."
  source: nhs_cuts_and_grazes

- id: advice_self_harm
  what_to_do: "Call 999 for an ambulance or go straight to A&E. Or ask someone else to call 999 or take you to A&E."
  look_out_for:
    - "Feeling that you may be about to harm yourself"
  get_more_help_when:
    - "If your life is in danger, call 999 now"
    - "If you need someone to talk to, call Samaritans on 116 123 at any time, or text SHOUT to 85258"
  where_to_go: "Call 999 or go straight to A&E. Try to be around other people and get yourself to a safe place."
  source: nhs_suicidal_thoughts

- id: advice_sudden_confusion
  what_to_do: "Call 999 or go to A&E now."
  look_out_for:
    - "Severe difficulty breathing, such as gasping, choking or not being able to get words out"
    - "Lips or skin turning very pale, blue or grey"
  get_more_help_when:
    - "Call 999 if you get worse or cannot get to A&E safely"
  where_to_go: "Call 999 or go to A&E. Do not drive to A&E. Ask someone to drive you or call 999 and ask for an ambulance. Bring any medicines you take."
  source: nhs_shortness_of_breath

# ---------------------------------------------------------------------------
# Chest pain
# ---------------------------------------------------------------------------
- id: advice_chest_pain_999
  what_to_do: "Call 999 now. You could be having a heart attack and need treatment in hospital straight away."
  look_out_for:
    - "Keep checking that the person is still responding and breathing"
    - "If they stop responding and stop breathing, start CPR: press hard and fast in the middle of their chest. The 999 call handler will tell you how."
  get_more_help_when:
    - "Call 999 again if the person's condition changes"
  where_to_go: "Call 999. Do not drive yourself to A&E. The person you speak to at 999 will tell you what to do."
  self_care:
    - "If you think you or someone else is having a heart attack, do these things while you wait for help."
    - "Sit and rest on the floor with your knees bent and your back supported. If you cannot do this, sit on a chair."
    - "Take aspirin (300mg) if you have any. Do not give aspirin to someone who has an aspirin allergy."
    - "If you have angina (chest pain caused by narrowed blood vessels to the heart), use your spray if you have it with you. It goes under your tongue. It may be called glyceryl trinitrate or GTN."
  source: nhs_heart_attack
  also_informed_by: [nhs_chest_pain, nhs_angina]

- id: advice_chest_pain_ae
  what_to_do: "Call 999 or go to A&E now. This could be a sign of a serious condition."
  look_out_for:
    - "Pain that spreads to your arm, neck, jaw, stomach or back"
    - "Your chest feeling tight or squeezed"
    - "Feeling sweaty, sick, light-headed or short of breath"
    - "Difficulty breathing that comes on suddenly, or passing out"
  get_more_help_when:
    - "Call 999 straight away if you get any of the signs above. You could be having a heart attack."
    - "Call 999 if you get worse or cannot get to A&E safely"
  where_to_go: "Call 999 or go to A&E. Do not drive to A&E. Ask someone to drive you or call 999 and ask for an ambulance. Bring any medicines you take."
  source: nhs_pulmonary_embolism
  also_informed_by: [nhs_chest_pain, nhs_heart_attack]

- id: advice_chest_pain_urgent
  what_to_do: "Get help from NHS 111 today. You can call 111 or use 111 online."
  look_out_for:
    - "Sudden pain or discomfort in your chest that does not go away"
    - "Chest pain that feels tight or like squeezing"
    - "Pain that spreads to your arm, neck, jaw, stomach or back"
    - "Chest pain with feeling sweaty, sick, light-headed or short of breath"
  get_more_help_when:
    - "Call 999 straight away if you get any of the signs above. You could be having a heart attack."
    - "Call 999 or go to A&E if the chest pain comes back and does not go away. Do the same if your heart beats very fast, you suddenly find it hard to breathe, or you pass out."
  where_to_go: "Call 111 or use 111 online today. Call 999 if you get any of the signs above."
  source: nhs_angina
  also_informed_by: [nhs_chest_pain, nhs_heart_attack, nhs_pulmonary_embolism]

- id: advice_chest_pain_urgent_gp_or_111
  what_to_do: "Ask for an urgent GP appointment or get help from NHS 111 today. You can call 111 or use 111 online."
  look_out_for:
    - "Difficulty breathing that comes on suddenly"
    - "Your heart beating very fast"
    - "Passing out"
    - "Sudden chest pain that does not go away, feels tight or like squeezing, or spreads to your arm, neck, jaw, stomach or back"
  get_more_help_when:
    - "Call 999 or go to A&E if you get any of the signs above"
  where_to_go: "Ask your GP surgery for an urgent appointment, or call 111 or use 111 online. Call 999 or go to A&E if you get any of the signs above. Do not drive to A&E."
  source: nhs_pulmonary_embolism
  also_informed_by: [nhs_chest_pain, nhs_heart_attack]

- id: advice_chest_pain_angina_urgent
  what_to_do: "Get help from NHS 111 today, because your angina (chest pain caused by narrowed blood vessels to the heart) is worse than usual. You can call 111 or use 111 online."
  look_out_for:
    - "Chest pain that does not stop after a few minutes of rest. Or that does not stop after you take your angina medicine."
    - "Sudden pain or discomfort in your chest that does not go away"
    - "Pain that spreads to your arm, neck, jaw, shoulder, stomach or back"
    - "Chest pain with feeling sweaty, sick, light-headed or short of breath"
  get_more_help_when:
    - "Call 999 now if you get any of the signs above. You could be having a heart attack."
  where_to_go: "Call 111 or use 111 online today. Call 999 if you get any of the signs above. Do not drive yourself to A&E."
  self_care:
    - "If you get chest pain, stop what you are doing and rest"
    - "Use the angina medicine you have been prescribed. This is usually a spray you use under your tongue. Take another dose after 5 minutes if the first dose does not help."
    - "If you still have symptoms 5 minutes after the second dose, call 999 for an ambulance"
  source: nhs_angina

- id: advice_angina_self_care
  what_to_do: "Follow the instructions you have been given for your angina. Angina is chest pain caused by narrowed blood vessels to the heart."
  look_out_for:
    - "Chest pain that does not stop after a few minutes of rest. Or that does not stop after you take your angina medicine."
    - "Angina that feels worse than before, happens more often, lasts longer or happens when you are resting"
    - "Pain that spreads to your arm, neck, jaw, shoulder, stomach or back"
    - "Chest pain with feeling sweaty, sick, light-headed or short of breath"
  get_more_help_when:
    - "Call 999 if you still have pain 5 minutes after your second dose. Do not wait."
    - "Call 999 now if the pain spreads, or you feel sweaty, sick, light-headed or short of breath. You could be having a heart attack."
    - "Get help from NHS 111 if your angina is worse than before. For example, it comes more often, lasts longer, or comes when you are resting."
  where_to_go: "You do not need an appointment now. For urgent help call 111 or use 111 online. In an emergency call 999. Do not drive yourself to A&E."
  self_care:
    - "Stop what you are doing and rest"
    - "Use any medicine you have been prescribed. This is usually a spray you use under your tongue, called glyceryl trinitrate or GTN."
    - "Take another dose after 5 minutes if the first dose does not help"
  source: nhs_angina

- id: advice_chest_pain_gp
  what_to_do: "See a GP. Most chest pain is not a sign of anything serious, but get medical advice to make sure."
  look_out_for:
    - "Sudden pain or discomfort in your chest that does not go away"
    - "Chest pain that feels tight or like squeezing"
    - "Pain that spreads to your arm, neck, jaw, stomach or back"
    - "Chest pain with feeling sweaty, sick, light-headed or short of breath"
  get_more_help_when:
    - "Call 999 straight away if you get any of the signs above. You could be having a heart attack."
    - "Call 999 or go to A&E if the chest pain comes back and does not go away. Do the same if your heart beats very fast, you suddenly find it hard to breathe, or you pass out."
    - "Get help from NHS 111 if the chest pain keeps coming and going"
  where_to_go: "Make an appointment with a GP. Call 999 if you get any of the signs above."
  source: nhs_chest_pain
  also_informed_by: [nhs_angina, nhs_heart_attack, nhs_pulmonary_embolism]

# ---------------------------------------------------------------------------
# Sore throat
# ---------------------------------------------------------------------------
- id: advice_sore_throat_emergency
  what_to_do: "Call 999 or go to A&E now."
  look_out_for:
    - "Difficulty breathing"
    - "Not being able to swallow, or drooling"
    - "A high-pitched sound when breathing"
    - "Swelling inside your mouth and throat. Or finding it hard to speak or open your mouth."
  get_more_help_when:
    - "Call 999 if you get worse or cannot get to A&E safely"
  where_to_go: "Call 999 or go to A&E. Do not drive to A&E. Ask someone to drive you or call 999 and ask for an ambulance. Bring any medicines you take."
  source: nhs_sore_throat
  also_informed_by: [nhs_tonsillitis]

- id: advice_sore_throat_urgent
  what_to_do: "Ask for an urgent GP appointment or get advice from 111 now. You can call 111 or use 111 online."
  look_out_for:
    - "Difficulty breathing, or a high-pitched sound when you breathe"
    - "Not being able to swallow, or drooling"
    - "Severe symptoms that are getting worse quickly"
    - "Swelling inside your mouth and throat. Or finding it hard to speak or open your mouth."
  get_more_help_when:
    - "Call 999 or go to A&E now if you get any of the signs above"
  where_to_go: "Ask your GP surgery for an urgent appointment, or call 111 or use 111 online. Call 999 or go to A&E if you get any of the signs above."
  self_care:
    - "Drink plenty of water"
    - "Eat cool or soft foods"
    - "Rest"
  source: nhs_sore_throat
  also_informed_by: [nhs_tonsillitis]

- id: advice_sore_throat_gp
  what_to_do: "See a GP about your sore throat."
  look_out_for:
    - "A very high temperature, or feeling hot, cold or shivery"
    - "Signs of dehydration, such as peeing less than usual or dark, strong-smelling pee"
    - "Difficulty breathing, not being able to swallow, drooling, or a high-pitched sound when you breathe"
    - "Swelling inside your mouth and throat. Or finding it hard to speak or open your mouth."
  get_more_help_when:
    - "Ask for an urgent GP appointment or call 111 if you get a very high temperature, or you are worried. Do the same if you are peeing less than usual. This can be a sign of dehydration."
    - "Get help from NHS 111 if you get pus-filled spots on your tonsils, at the back of your throat. Do the same if your throat is so sore it is hard to eat or drink."
    - "Call 999 or go to A&E now if you find it hard to breathe, speak or open your mouth. Do the same if you cannot swallow, are drooling, or are quickly getting much worse."
  where_to_go: "Make an appointment with a GP. For urgent help call 111 or use 111 online. In an emergency call 999 or go to A&E."
  self_care:
    - "Gargle with warm, salty water (children should not try this)"
    - "Drink plenty of water"
    - "Eat cool or soft foods"
    - "Avoid smoking or smoky places"
    - "Rest"
  source: nhs_sore_throat
  also_informed_by: [nhs_tonsillitis]


- id: advice_sore_throat_gp_lump_or_ulcer
  what_to_do: "See a GP about the lump or the mouth ulcer, as well as your sore throat."
  look_out_for:
    - "A very high temperature, or feeling hot, cold or shivery"
    - "Signs of dehydration, such as peeing less than usual or dark, strong-smelling pee"
    - "Difficulty breathing, not being able to swallow, drooling, or a high-pitched sound when you breathe"
    - "Swelling inside your mouth and throat. Or finding it hard to speak or open your mouth."
  get_more_help_when:
    - "Ask for an urgent GP appointment or call 111 if you get a very high temperature, or you are worried. Do the same if you are peeing less than usual. This can be a sign of dehydration."
    - "Get help from NHS 111 if you get pus-filled spots on your tonsils, at the back of your throat. Do the same if your throat is so sore it is hard to eat or drink."
    - "Call 999 or go to A&E now if you find it hard to breathe, speak or open your mouth. Do the same if you cannot swallow, are drooling, or are quickly getting much worse."
  where_to_go: "Make an appointment with a GP. For urgent help call 111 or use 111 online. In an emergency call 999 or go to A&E."
  self_care:
    - "Gargle with warm, salty water (children should not try this)"
    - "Drink plenty of water"
    - "Eat cool or soft foods"
    - "Avoid smoking or smoky places"
    - "Rest"
  source: nhs_sore_throat
  also_informed_by: [nhs_tonsillitis]

- id: advice_sore_throat_pharmacy
  what_to_do: "See a pharmacist. They can suggest treatments, give advice, and give antibiotics if you need them."
  look_out_for:
    - "A sore throat that does not improve after a week"
    - "A very high temperature, or feeling hot, cold or shivery"
    - "Difficulty breathing, not being able to swallow, drooling, or a high-pitched sound when you breathe"
    - "Swelling inside your mouth and throat. Or finding it hard to speak or open your mouth."
  get_more_help_when:
    - "See a GP if your sore throat does not improve after a week"
    - "Ask for an urgent GP appointment or call 111 if you get a very high temperature, or you are worried. Do the same if you are peeing less than usual. This can be a sign of dehydration."
    - "Get help from NHS 111 if you get pus-filled spots on your tonsils, at the back of your throat. Do the same if your throat is so sore it is hard to eat or drink."
    - "Call 999 or go to A&E now if you find it hard to breathe, speak or open your mouth. Do the same if you cannot swallow, are drooling, or are quickly getting much worse."
  where_to_go: "Go to a pharmacy. For urgent help call 111 or use 111 online. In an emergency call 999 or go to A&E."
  self_care:
    - "Gargle with warm, salty water (children should not try this)"
    - "Drink plenty of water"
    - "Eat cool or soft foods"
    - "Avoid smoking or smoky places"
    - "Suck ice cubes, ice lollies or hard sweets. Do not give young children anything small and hard to suck, because they could choke."
    - "Rest"
    - "Some medicines are not safe for everyone, for example if you are pregnant. Check the leaflet or ask the pharmacist before taking them."
  source: nhs_sore_throat
  also_informed_by: [nhs_tonsillitis]

- id: advice_sore_throat_self_care
  what_to_do: "You can treat this yourself. Sore throats usually get better by themselves within a week."
  look_out_for:
    - "A sore throat that does not improve after a week"
    - "A very high temperature, or feeling hot, cold or shivery"
    - "Difficulty breathing, not being able to swallow, drooling, or a high-pitched sound when you breathe"
    - "Swelling inside your mouth and throat. Or finding it hard to speak or open your mouth."
  get_more_help_when:
    - "See a pharmacist if you would like help with your sore throat"
    - "See a GP if your sore throat does not improve after a week, or you often get sore throats"
    - "Ask for an urgent GP appointment or call 111 if you get a very high temperature, or you are worried. Do the same if you are peeing less than usual. This can be a sign of dehydration."
    - "Get help from NHS 111 if you get pus-filled spots on your tonsils, at the back of your throat. Do the same if your throat is so sore it is hard to eat or drink."
    - "Call 999 or go to A&E now if you find it hard to breathe, speak or open your mouth. Do the same if you cannot swallow, are drooling, or are quickly getting much worse."
  where_to_go: "You do not need an appointment now. A pharmacist can help if you need it. For urgent help call 111 or use 111 online. In an emergency call 999 or go to A&E."
  self_care:
    - "Gargle with warm, salty water (children should not try this)"
    - "Drink plenty of water"
    - "Eat cool or soft foods"
    - "Avoid smoking or smoky places"
    - "Suck ice cubes, ice lollies or hard sweets. Do not give young children anything small and hard to suck, because they could choke."
    - "Rest"
  source: nhs_sore_throat
  also_informed_by: [nhs_tonsillitis]

