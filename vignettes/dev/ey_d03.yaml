    findings: [high_speed_object]
    minimum_acuity: emergency
    source: {page: eye_injuries.txt, quote: "something has hit your eye at high speed"}
  - description: "Change in sight after an eye injury"
    findings: [blurred_vision, eye_injury]
    minimum_acuity: emergency
    source: {page: eye_injuries.txt, quote: "there are any changes to your sight after an eye injury"}

