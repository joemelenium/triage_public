# Build plan: body systems after the chest and breathing pilot.
# A demonstration and proof of concept only. Never for clinical use.
#
# Each batch is drafted by one agent in its own copy of the repository, then
# merged. "entry_symptoms" are main symptoms a patient can start with: each
# NHS Symptoms A to Z page must end up covered by one (directly, or listed in
# its "also_covers"). "conditions" is a starting list: agents add any others a
# triage service would commonly see for those symptoms, and every
# life-threatening cause that must not be missed.

ear_nose_throat:
  entry_symptoms: [earache, hearing loss, tinnitus, catarrh, lost or changed sense of smell, swollen glands,
                   swallowing problems, bad breath, dry mouth, sore or dry lips, sore or white tongue,
                   metallic taste, toothache, teeth grinding, snoring, hiccups, nosebleed, blocked or runny nose]
  existing: [sore throat (entry symptom and 5 conditions already built)]
  conditions: [middle ear infection, outer ear infection, glue ear, earwax build-up, perforated eardrum,
               labyrinthitis or vestibular neuritis, sudden hearing loss, sinusitis, nasal polyps, allergic rhinitis,
               nosebleed, dental abscess, tooth decay, gum disease, wisdom tooth problems, mouth ulcers, oral thrush,
               glandular fever, swollen glands from infection, salivary gland stones, oesophageal cancer warning signs,
               mouth cancer warning signs, epiglottitis, peritonsillar abscess (quinsy exists), dry mouth from medicines,
               obstructive sleep apnoea, temporomandibular joint disorder]

stomach_and_bowel:
  entry_symptoms: [stomach ache, diarrhoea and vomiting, feeling sick, vomiting blood, bleeding from the bottom,
                   constipation, bloating, farting, indigestion, anal pain, itchy bottom, bowel incontinence,
                   soiling in children, worms, reflux in babies, difficulty swallowing is in ear_nose_throat]
  conditions: [appendicitis, gastroenteritis, food poisoning, irritable bowel syndrome, constipation, gallstones,
               acute pancreatitis, stomach ulcer, bleeding stomach ulcer, gastritis, heartburn (exists), hernia,
               strangulated hernia, bowel obstruction, diverticulitis, inflammatory bowel disease (Crohn's, ulcerative colitis),
               coeliac disease, bowel cancer warning signs, stomach cancer warning signs, haemorrhoids, anal fissure,
               threadworms, ectopic pregnancy (also women's health), urinary tract infection (also urinary),
               kidney stones (also urinary), abdominal aortic aneurysm, mesenteric ischaemia, intussusception (babies),
               pyloric stenosis (babies), reflux in babies, colic, cows' milk allergy, liver problems (jaundice),
               diabetic ketoacidosis, sepsis (exists)]

