notes: "Burst blood vessel (red_eye.txt: 'Bright red area in the white of your eye'). A frightening look-alike where over-triage is the risk. Source difference: eyelid_problems.txt gives urgent advice if 'the white of your eye is very red, in part or all over', but that list is about eyelid problems; red_eye.txt fits this story better. eye_very_red is left unstated because a patch may or may not count as 'very red'."
