    style: "long and rambling, mentions lots up front"
    opening_statement: "We were just sitting reading and I looked over and his mouth had dropped on the right side, and when I asked him to lift his arms the right one just fell down, and he's talking like he's had a drink but he hasn't, and he didn't bang his head or anything."
    volunteered: [face_droop_one_side, arm_weakness, difficulty_speaking, head_injury_last_3_months]

