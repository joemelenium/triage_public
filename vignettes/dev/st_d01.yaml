atypical: false
notes: "Plain emergency case. The two pages agree: sore_throat.txt ('are unable to swallow', 'are drooling') and tonsillitis.txt ('you cannot swallow') both say call 999 or go to A&E. The page offers either 999 or A&E, so emergency_department is used as the level of care, together with the page's advice not to drive there. The story is of slow worsening over days, so 'severe and getting worse quickly' is recorded as absent."
