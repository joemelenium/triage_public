notes: 'Low-urgency case: over-triage would be the mistake. The chest_pain.txt table gives a sharp pain
  ''triggered by worries or a stressful situation'' as anxiety, depression or a panic attack, adds ''Do
  not self-diagnose'', and puts chest pain that comes and goes under non-urgent ''See a GP''. None of
  the signs that table lists alongside (faster heartbeat, sweating, dizziness) is present, so the 999
  and NHS 111 advice tied to those signs does not apply. Source difference: angina.txt says angina attacks
  are ''often brought on by exercise, stress, emotion or cold temperatures'' and puts chest pain that
  comes and goes under NHS 111. Judgement: his pain never comes with effort and does not depend on resting,
  so it does not match that page''s description and chest_pain.txt is followed. cp_on_exertion is no for
  the same reason: the question joins ''active, stressed or cold'' with ''ease when you rest'', and for
  him only the stress half is true. That one question covers both stress and effort is a point where the
  list cannot separate the two patterns cleanly.'
