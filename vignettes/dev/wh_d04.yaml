notes: 'Source difference: pelvic_pain.txt sends pelvic pain that is ''severe, getting worse, or hurts when you
  move or touch the area'' to 999. period_pain.txt sends period pain that is severe or worse than usual and not
  helped by painkillers to an urgent GP or 111. The period_pain page fits better: the pain is typical cramping at
  the start of a period, is not getting worse, does not hurt on moving or touch, and there are no faint, fever or
  pregnancy features. So pelvic_pain_severe_or_worsening is no, and ''worse than usual'' is captured by pain_not_helped_by_painkillers.'
