id: urinary_tract_infection
body_system: urinary_and_male
# A urine infection with a high temperature, in a child, or in an older person, needs an
# urgent GP appointment (UTI page). In older people it can show only as feeling unwell
# or confused.
entry_symptoms: [very_high_temperature, generally_unwell, baby_unsettled_or_not_feeding, stomach_ache, diarrhoea_or_vomiting, feeling_sick, painful_or_frequent_peeing, smelly_urine, blood_in_urine, urinary_incontinence, bedwetting, blood_in_semen, pelvic_pain, stomach_pain_in_pregnancy]
