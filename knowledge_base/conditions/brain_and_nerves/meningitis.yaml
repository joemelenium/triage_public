# Merged with the general card for this condition. Its notes: Must not be missed. Can
# kill within hours. What tells it apart from flu: a stiff neck, bright light hurting, a
# rash that does not fade, being very sleepy, and in babies a high-pitched cry or
# bulging soft spot. Merged with the skin_and_hair card for this condition. Its notes:
# Very rare among people with a rash, and only plausible with a rash that does not fade
# or a high temperature, so it starts very rare and is raised by those signs. What tells
# it apart from Henoch-Schonlein purpura or a viral rash: feeling very unwell, a high
# temperature, cold hands and feet, a stiff neck or bright light hurting, and getting
# worse quickly.
