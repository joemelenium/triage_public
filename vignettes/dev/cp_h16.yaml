id: cp_h16
status: AI-drafted, not clinically approved
authored_by: AI, in a session separate from the knowledge base
presenting: [chest_pain]
summary: 48-year-old man who most evenings for a fortnight has had a burning ache in his chest about half
  an hour after dinner, with bloating and sometimes sour fluid coming up. It wears off within an hour.
  No pain now. He does not smoke; he had a health check last year and never collected the results, so
  cannot say whether his blood pressure or cholesterol is high. His record shows high cholesterol.
opening_statement: Most evenings for the past fortnight, about half an hour after dinner, I get a burning
  ache in my chest and feel bloated. Sometimes sour fluid comes up. It wears off within the hour. I've
  got nothing at the moment.
findings:
  present: [chest_pain, cp_comes_and_goes, cp_after_eating]
  absent: [stroke_signs, severe_breathing_difficulty, lips_or_skin_blue_grey, passed_out, sudden_confusion,
    heavy_bleeding, serious_self_harm, cp_present_now, cp_sudden_not_going_away, cp_tight_or_squeezing,
    cp_heavy, cp_spreads, sweating, nausea_or_vomiting, light_headed, short_of_breath, heart_beating_very_fast,
    fainted, palpitations, has_angina, angina_pain_not_settling, angina_worse_than_usual, coughing_up_blood,
    cp_worse_breathing_in, leg_pain_or_swelling, difficulty_breathing, worried_about_symptoms, cp_on_exertion,
    cp_after_injury_or_exercise, cp_with_worry, cough_mucus_or_temperature, family_heart_history, cough_or_runny_nose,
    sore_throat, very_high_temperature, cp_lasted_15_minutes]
  unknown: [heart_risk_factors]
context:
  none: {}
  basic: {age: 48, sex: male}
  full:
    age: 48
    sex: male
    findings: {heart_risk_factors: 'yes'}
expected: {acuity: routine, level_of_care: general_practice, timeframe: no_fixed_time}
