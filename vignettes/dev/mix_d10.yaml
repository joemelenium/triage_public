notes: "asthma.txt puts 'had an asthma attack and have recovered' under 'Urgent advice: Ask for an urgent GP appointment' but says to see a GP within 2 days, so it is mapped to soon / general practice / within a few days. When this case was written the question list had no question for 'has had an asthma attack and recovered'; the nearest was asthma_needing_reliever_more, which asthma.txt places under non-urgent 'See a GP', so an engine could only reach routine from the questions it could ask. The recovered attack is now expressed with asthma_attack_recovered."
