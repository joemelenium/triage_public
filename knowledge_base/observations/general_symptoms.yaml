# Observations: general symptoms (high temperature, tiredness, weight loss,
# night sweats, thirst, dehydration, swelling, blue or grey skin, feeling
# unwell, and an unsettled baby).
# NOT FOR CLINICAL USE. A demonstration and proof of concept only.
#
# The universal red flags and patient context are in general.yaml. This file
# holds what the general body system added. Fields are described in general.yaml.
#

# ===========================================================================
# Main symptoms (entry symptoms) added by this body system
# ===========================================================================
- id: very_thirsty
  label: "Feeling very thirsty all the time"
  question: "Do you feel very thirsty all the time, even when you are drinking a lot?"
  question_carer: "Is your child very thirsty all the time, even when they are drinking a lot?"
  checklist_text: "Feeling very thirsty all the time, even when drinking a lot"
  kind: presenting
  snomed: "17173007"
  phrases: ["always thirsty", "can't stop drinking", "mouth always dry and thirsty"]
  source: nhs_thirst

- id: swollen_arm_or_hand
  label: "Swollen arm or hand"
  question: "Is one or both of your arms or hands swollen or puffy?"
