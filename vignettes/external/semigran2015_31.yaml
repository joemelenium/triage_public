conversion_notes: 'She ''initially had nasal congestion and a mild sore throat, but now her symptoms are all related to a productive cough'', so sore_throat is not listed as presenting. ''Afebrile with normal vital signs'' is mapped to very_high_temperature absent. ''Not in respiratory distress'' is mapped to severe_breathing_difficulty absent; difficulty_breathing and short_of_breath are left out. The opening sentence is copied as printed (a verb appears to be missing in the published text). Rule used for very_high_temperature in this set: present when the text states a fever (not described as low-grade), chills, rigors or feeling hot; left out when the fever is described as low-grade or measured below 38.0 C; absent when fever is explicitly ruled out. Text is from the ''Vignette'' column of Supplemental Table 2 in the web appendix (vignette 31 of 45, in the published order); the ''Simplified (added symptoms)'' column is not copied. The publication gives this vignette''s source as: Epocrates
  (online.epocrates.com), 2014.'
