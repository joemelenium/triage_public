# Entry symptom: hearing, seeing or feeling things that other people do not.
# NOT FOR CLINICAL USE. AI-drafted, not clinically reviewed.
#
# Each rule says: WHEN these findings are present, the outcome is at least THIS.
# A rule marked "soft: true" is the exception: the conditions that look likely
# may lower its outcome, if something the patient said points to a milder cause.
# The engine takes the most urgent rule that fires. If none fires, it uses the
# default at the bottom.
#
# Must-not-miss causes: sudden confusion (delirium) from an infection or other
# physical illness, severe alcohol withdrawal, poisoning or a bad reaction to a
# drug, psychosis after giving birth, and a first episode of psychosis. Most are
# caught by the red flags. The default is urgent, from the Charles Bonnet syndrome
# page, which says to get urgent help for hallucinations to rule out serious
# causes. It is soft, so a clearly harmless pattern (only when falling asleep or
# waking, knowing it is not real) can lower it.

id: hearing_or_seeing_things
name: "Hearing or seeing things that others do not"
presenting_finding: hearing_or_seeing_things
status: "AI-drafted, not clinically reviewed"

screens:
  - id: hallucinations_emergency_screen
    level: emergency
    question: "Do any of these apply right now? Choose all that apply."
    findings:
      - cannot_keep_safe
      - voices_telling_to_harm
      - taken_overdose
      - drug_bad_reaction
      - had_a_fit
      - drowsy_hard_to_wake
      - child_floppy_or_hard_to_wake
      - severe_withdrawal_signs
      - very_high_temperature

  - id: hallucinations_urgent_screen
    level: urgent
    question: "These questions help us find the right help. Do any of these apply? Choose all that apply."
    findings:
      - alcohol_or_drug_stopped_recently
      - pregnant_or_recently_given_birth
      - came_on_over_hours_or_days
      - suicidal_thoughts_or_self_harm
      - high_mood_now
      - believes_things_not_true
      - recent_drug_use

red_flags:
  # ---- Emergency ---------------------------------------------------------
  - id: rf_hs_cannot_keep_safe
    description: "Hearing or seeing things and cannot keep themselves or someone else safe"
    when: cannot_keep_safe
    outcome: {acuity: emergency, level_of_care: emergency_department, timeframe: now, timeframe_detail: "Call 999 or go to A&E now"}
    advice: advice_mh_cannot_keep_safe
    source: nhs_urgent_mental_health

  - id: rf_hs_voices_harm
    description: "Voices telling them to harm themselves or someone else"
    when: voices_telling_to_harm
    outcome: {acuity: emergency, level_of_care: emergency_department, timeframe: now, timeframe_detail: "Call 999 or go to A&E now"}
    advice: advice_mh_cannot_keep_safe
    source: ai_judgement
    note: "Clinical knowledge: voices telling someone to harm themselves or others need assessment now. The Postpartum psychosis page says go to A&E or call 999 if there may be danger of harm."

  - id: rf_hs_overdose
    description: "Hearing or seeing things after an overdose, or after swallowing something harmful"
    when: taken_overdose
    outcome: {acuity: emergency, level_of_care: emergency_department, timeframe: now, timeframe_detail: "Call 999 or go to A&E now"}
    advice: advice_mh_overdose_or_injury
    source: nhs_poisoning

  - id: rf_hs_drug_reaction
    description: "Hearing or seeing things and very unwell after taking a drug"
    when: drug_bad_reaction
    outcome: {acuity: emergency, level_of_care: emergency_department, timeframe: now, timeframe_detail: "Call 999 or go to A&E now"}
    advice: advice_poisoning_ae
    source: nhs_poisoning

  - id: rf_hs_fit
    description: "Hearing or seeing things, and has had a seizure (fit)"
    when: had_a_fit
    outcome: {acuity: emergency, level_of_care: emergency_ambulance, timeframe: now, timeframe_detail: "Call 999"}
    advice: advice_mh_physical_cause_ae
    source: nhs_alcohol_poisoning
    note: "The Alcohol poisoning and Poisoning pages say call 999 after a seizure. The Alcohol misuse page lists a seizure as a sign of severe withdrawal."

  - id: rf_hs_drowsy
    description: "Hearing or seeing things and very sleepy or hard to wake"
    when: {any: [drowsy_hard_to_wake, child_floppy_or_hard_to_wake]}
    outcome: {acuity: emergency, level_of_care: emergency_department, timeframe: now, timeframe_detail: "Call 999 or go to A&E now"}
    advice: advice_mh_physical_cause_ae
    source: ai_judgement
    note: "Clinical knowledge: drowsiness with hallucinations suggests sudden confusion (delirium) or poisoning, which the Confusion and Poisoning pages say need A&E or 999."

  - id: rf_hs_severe_withdrawal
    description: "Signs of severe alcohol withdrawal"
    when: severe_withdrawal_signs
    outcome: {acuity: emergency, level_of_care: emergency_department, timeframe: now, timeframe_detail: "Call 999 or go to A&E now"}
    advice: advice_withdrawal_ae
    source: nhs_alcohol_misuse

  - id: rf_hs_after_stopping
    description: "Hearing or seeing things after stopping or cutting down alcohol, or a drug or medicine they rely on"
    when: alcohol_or_drug_stopped_recently
    outcome: {acuity: emergency, level_of_care: emergency_department, timeframe: now, timeframe_detail: "Call 999 or go to A&E now"}
    advice: advice_withdrawal_ae
    source: nhs_alcohol_misuse
    note: "The Alcohol misuse page lists seeing, hearing or feeling things that are not there after stopping drinking as severe withdrawal (999 or A&E). Applying it to stopping other drugs or medicines someone relies on (for example sleeping tablets) is AI judgement."

  - id: rf_hs_high_temperature
    description: "Hearing or seeing things with a very high temperature, or feeling hot, cold or shivery"
    when: very_high_temperature
    outcome: {acuity: emergency, level_of_care: emergency_department, timeframe: now, timeframe_detail: "Call 999 or go to A&E now"}
    advice: advice_mh_physical_cause_ae
    source: ai_judgement
    soft: true    # likely conditions may lower this: it is AI judgement
    note: "Clinical knowledge: hallucinations with a high temperature suggest an infection causing sudden confusion (delirium). The Confusion page lists seeing or hearing things as a sign of confusion, and an infection as a common cause."

  - id: rf_hs_sudden_older
    description: "Hearing or seeing things that came on suddenly, in someone aged 65 or over"
    when: {all: [came_on_over_hours_or_days, age_65_or_over]}
    outcome: {acuity: emergency, level_of_care: emergency_department, timeframe: now, timeframe_detail: "Go to A&E or call 999"}
    advice: advice_mh_physical_cause_ae
    source: nhs_confusion
    soft: true    # likely conditions may lower this: it rests on a reading of the source
    note: "The Confusion page lists seeing or hearing things that are not there as a sign of confusion, and says go to A&E or call 999 if someone suddenly becomes confused. Reading new hallucinations in an older person as possible sudden confusion is AI judgement."

  # ---- Urgent --------------------------------------------------------------
  - id: rf_hs_after_birth
    description: "Hearing or seeing things while pregnant or within 6 weeks of giving birth (possible postpartum psychosis)"
    when: pregnant_or_recently_given_birth
    outcome: {acuity: urgent, level_of_care: urgent_care, timeframe: today, timeframe_detail: "See a GP straight away and ask for an urgent assessment today. Call 111 if you cannot. Call 999 or go to A&E if anyone may be in danger."}
    advice: advice_postpartum_psychosis_urgent
    source: nhs_postpartum_psychosis
    note: "The page says postpartum psychosis is a medical emergency, to see a GP immediately and ask for an assessment the same day, and to go to A&E or call 999 if there is danger of harm. Including pregnancy is AI judgement."

  - id: rf_hs_high_mood
    description: "Hearing or seeing things with a very high, excited or overactive mood (possible mania)"
    when: high_mood_now
    outcome: {acuity: urgent, level_of_care: urgent_care, timeframe: today, timeframe_detail: "Call NHS 111 and choose the mental health option (option 2), or ask your GP surgery for an urgent appointment today"}
    advice: advice_mh_urgent
    source: nhs_bipolar

  - id: rf_hs_drug_use
    description: "Hearing or seeing things after taking a drug in the last few days"
    when: recent_drug_use
    outcome: {acuity: urgent, level_of_care: urgent_care, timeframe: today, timeframe_detail: "Call NHS 111 today"}
    advice: advice_hallucinations_urgent
    source: ai_judgement
    note: "Clinical knowledge: drugs such as cannabis, cocaine, ketamine or speed can cause psychosis. If the person is very unwell, the emergency rule applies."

outcome_rules: []

default:
  description: "Hearing or seeing things, with no sign of immediate danger: get help today to rule out serious causes"
  outcome: {acuity: urgent, level_of_care: urgent_care, timeframe: today, timeframe_detail: "Ask your GP surgery for an urgent appointment, or call NHS 111 and choose the mental health option (option 2), today"}
  advice: advice_hallucinations_urgent
  source: nhs_charles_bonnet
  note: "The Charles Bonnet syndrome page says ask for an urgent GP appointment or get help from 111 if you or someone else have hallucinations, to rule out more serious conditions. Not a floor: a clearly harmless pattern can lower it."

default_exceptions:
  - id: ex_hs_known_and_unchanged
    description: "Long-standing hallucinations that a doctor or mental health team already knows about, with no change"
    when: hallucinations_usual_and_managed
    outcome: {acuity: routine, level_of_care: general_practice, timeframe: no_fixed_time, timeframe_detail: "Speak to your GP or mental health team about any worries. No fixed time."}
    advice: advice_hallucinations_routine
    source: ai_judgement
    note: "Clinical knowledge: experiences that are long-standing, known to a doctor and unchanged do not need same-day help on their own. Only used when no red flag or other rule applies."
