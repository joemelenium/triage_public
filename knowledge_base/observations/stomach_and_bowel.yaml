  kind: presenting
  snomed: "21522001"
  phrases: ["tummy ache", "stomach pain", "belly ache", "pain in my tummy", "cramps in my stomach"]
  source: nhs_stomach_ache

- id: sa_sudden_severe
  label: "Stomach ache that started suddenly and is severe"
  question: "Did the pain in your tummy start suddenly, and is it severe? Severe pain is there all the time and is so bad it is hard to think or talk."
  question_carer: "Did the pain in your child's tummy start suddenly, and is it severe? Severe pain is there all the time and is so bad it is hard for them to think or talk."
