notes: 'pulmonary_embolism.txt puts coughing up blood under ''Ask for an urgent GP appointment or get
  help from NHS 111'', and shortness_of_breath.txt puts it under ''Contact NHS 111''. Source difference
  within and between pages: pulmonary_embolism.txt also lists ''you feel pain in your chest or upper back''
  under ''Call 999 or go to A&E'', and names coughing up blood as a symptom of pulmonary embolism, so
  a literal reading of that page gives emergency for anyone with both. Judgement: her chest is sore only
  when she coughs, after a week of coughing; she has no difficulty breathing, no pain on breathing in,
  no leg symptoms and no fast heartbeat. The specific advice for coughing up blood is followed and recorded
  as both expected and minimum. A reviewer who reads the pulmonary embolism page literally could reasonably
  expect emergency; an emergency answer here is cautious, not wrong. Level of care: the source offers
  an urgent GP appointment or NHS 111; general_practice is recorded and urgent_care is equally supported.
  heavy_bleeding is no: streaks only. The link between the pain and coughing cannot be expressed with
  any question on the list. For the questions added to the list later: cough_or_runny_nose is yes, and
  cough_mucus_or_temperature is yes for the green mucus she brings up with her chesty cough; she has no
  high temperature.'
