notes: "Atypical: the sore throat is minor and the feature that matters is a mouth ulcer of about a month, mentioned almost in passing. sore_throat.txt says to see a GP for a sore throat with 'a mouth ulcer that lasts for more than 3 weeks'; tonsillitis.txt does not mention ulcers. The page gives no timescale, so the acuity is routine and the red flag is recorded with a minimum of routine. She also wants help, which meets the pharmacist criterion; the GP criterion should take priority, and pharmacy or self-care advice alone would fall short. She cannot say whether the sore throat has gone a week without improving, so that finding is unknown; either answer leads to a GP. The pages do not say whether an on-and-off sore throat counts as 'often'; frequent_sore_throats is recorded as absent because she describes one spell."
