presenting: [chest_pain]
summary: 66-year-old man diagnosed with angina three years ago. Over the past week attacks have gone from
  once or twice a month to nearly every day, and twice came on while he was sitting. Each settles within
  a couple of minutes of using his spray. No pain at present.
opening_statement: I've had angina for three years. Normally I get it once or twice a month going up hills.
  This past week it's been nearly every day, and twice it came on when I was just sat watching telly.
  My spray gets rid of it in a couple of minutes. I'm fine right now.
