notes: 'Low-urgency case: over-triage would be the mistake. Source difference: chest_pain.txt puts ''chest
  pain that comes and goes'' under non-urgent ''See a GP''; angina.txt puts ''chest pain or other symptoms
  of angina that come and go'' under urgent NHS 111; pulmonary_embolism.txt lists ''pain in your chest
  or upper back'' under ''Call 999 or go to A&E''. Judgement: her story (burning after large meals with
  a bitter taste, no pain now, no breathing symptoms) matches the heartburn row of the chest_pain.txt
  table and has none of the features the angina or pulmonary embolism pages describe, so the general chest
  pain page is followed. The sources give no self-care advice for chest pain (''get medical advice just
  in case''), so routine is also the minimum. The meal trigger and the bitter taste are expressed with
  cp_after_eating, a question added after this case was first written.'
