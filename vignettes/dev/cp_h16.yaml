safety_netting_should_cover:
- point: See a GP
  any_of: [GP, doctor]
- point: Call 999 if the pain comes on suddenly and does not go away, spreads to the arm, neck, jaw, stomach
    or back, or comes with feeling sweaty, sick, light-headed or short of breath
  any_of: ['999']
source:
  expected_outcome: {page: chest_pain.txt, quote: you have chest pain that comes and goes}
  minimum_safe_acuity: {page: chest_pain.txt, quote: Most chest pain is not a sign of anything serious
      but get medical advice just in case.}
context_test: {what_context_adds: 'The record shows high cholesterol, found at a health check. The patient
    never collected the results and cannot say whether he has any of the listed risk factors.', expected_direction: same}
atypical: false
notes: 'Context test where the record should make no difference, and a low-urgency case. He cannot answer
  heart_risk_factors (he does not smoke, but never collected the results of a health check), so it is
  ''not sure''; the record shows high cholesterol. chest_pain.txt says people at risk of coronary heart
  disease, for example with high cholesterol, are ''more likely to have heart problems'', but neither
  it nor the other pages give different advice because of a risk factor. His pain starts after eating,
  with bloating and fluid coming up, which is the heartburn or indigestion row of the chest_pain.txt table,
  and chest pain that comes and goes is non-urgent ''See a GP''. Hence ''same''. An engine that becomes
  somewhat more cautious once it knows about the cholesterol is not unsafe, but the sources do not ask
  for it. Source differences: angina.txt puts chest pain that comes and goes under NHS 111, and heart_attack_symptoms.txt
  lists an indigestion-like burning and feeling full or bloated among heart attack symptoms. Judgement:
  his pain is tied to meals, comes and goes, and is not the sudden discomfort that does not go away for
  which the pages say 999, so chest_pain.txt is followed. worried_about_symptoms is no.'
