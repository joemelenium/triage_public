conversion_notes: 'Sex is taken from ''son''. ''Vomited twice'' and ''immediately vomits up the juice'' are mapped to nausea_or_vomiting. ''Elizabeth worries about dehydration'' is mapped to worried_about_symptoms present (the worry is the mother''s). No signs of dehydration are described, so dehydration_signs is left out. He ''has a fever'' with ''Temperature = 100.5'' (about 38.1 C); the publication''s simplified version calls this a ''low grade fever'', so very_high_temperature is left out rather than marked present or absent. The published text is written as a short story about the mother''s decision and names the child. Rule used for very_high_temperature in this set: present when the text states a fever (not described as low-grade), chills, rigors or feeling hot; left out when the fever is described as low-grade or measured below 38.0 C; absent when fever is explicitly ruled out. Text is from the ''Vignette'' column of Supplemental Table 2 in the web appendix (vignette 45 of 45, in
  the published order); the ''Simplified (added symptoms)'' column is not copied. The publication gives this vignette''s source as: Boroughs DS, Dougherty JA, Goldsmith C. Telephone Triage: Help Is Just a Call Away (ce.nurse.com).'
