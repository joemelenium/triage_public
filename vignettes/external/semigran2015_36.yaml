conversion_notes: '''He also denies fevers, chills'' is mapped to very_high_temperature absent. ''He denies any leg pain or weakness'': leg swelling is not mentioned, so leg_pain_or_swelling is left out rather than marked absent. The unremarkable neurologic examination is described in the context of back pain and is not mapped to stroke_signs absent. Rule used for very_high_temperature in this set: present when the text states a fever (not described as low-grade), chills, rigors or feeling hot; left out when the fever is described as low-grade or measured below 38.0 C; absent when fever is explicitly ruled out. Text is from the ''Vignette'' column of Supplemental Table 2 in the web appendix (vignette 36 of 45, in the published order); the ''Simplified (added symptoms)'' column is not copied. The publication gives this vignette''s source as: Epocrates (online.epocrates.com), 2014.'
