presenting: [something_in_eye, eye_pain]

summary: "A 42-year-old man was strimming the garden without goggles when something flew into his right eye at speed. It is painful and watering and his sight in that eye is a bit blurred. He cannot tell whether anything went into the eye itself."

opening_statement: "Something shot up off the strimmer and hit me in the eye. It really hurts, it won't stop watering and it's a bit blurry."

findings:
