conversion_notes: '''Acutely disoriented'', with altered mental status over the last several hours, is mapped to sudden_confusion. ''Increasingly somnolent'' is not mapped to passed_out: the text does not say she passed out or is unresponsive. The text describes taking additional acetaminophen (paracetamol) pills for back pain on top of other acetaminophen-containing medicines; it does not call this an overdose or self-harm, so serious_self_harm is left out. Examination and laboratory findings (scleral icterus, asterixis, ALT, bilirubin, INR) have no matching question. Text is from the ''Vignette'' column of Supplemental Table 2 in the web appendix (vignette 1 of 45, in the published order); the ''Simplified (added symptoms)'' column is not copied. The publication gives this vignette''s source as: Epocrates (online.epocrates.com), 2014.'
