notes: 'Classic first gout attack (joint_pain.txt: ''Hot, swollen toe joint (usually the big toe) with very bad pain that comes on suddenly, often overnight''). Source difference: gout.txt gives ''See a GP'' for a first attack and keeps urgent help for worsening pain, fever or feeling sick; joint_pain.txt and septic_arthritis.txt give ''Ask for an urgent GP appointment or get help from NHS 111'' for a joint that is swollen and feels hot. The gout page fits this story better, so soon (GP within a few days, given a first painful attack); the joint_pain page would support urgent, so over-triage to urgent is acceptable here. Minimum safe acuity soon rather than routine because a hot swollen joint should not wait.'
