notes: 'The pattern points to a common, minor cause: over-triage would be the mistake. The chest_pain.txt
  table gives pain that ''Starts after eating, bringing up food or bitter tasting fluids, feeling full
  and bloated'' as heartburn or indigestion, adds ''Do not self-diagnose'', and puts chest pain that comes
  and goes under non-urgent ''See a GP''. Her age matters to the story: chest_pain.txt says ''You''re
  more likely to have heart problems if you''re older'', and heart_attack_symptoms.txt lists an indigestion-like
  burning and feeling full or bloated among heart attack symptoms. But the 999 advice on those pages is
  for sudden discomfort that does not go away; hers is tied to meals, goes within the hour and is absent
  now, and no page gives different advice because of age. Source difference: angina.txt puts chest pain
  that comes and goes under NHS 111; nothing in her story matches that page''s description. The sources
  give no self-care or pharmacist route for chest pain (''get medical advice just in case''), so routine
  is also the minimum.'
